said he has a friend renting a place off campus, and then discussed that the friend invited him to join him, and they agreed to share cleaning duties. \nAnd then, Speaker 1 argued that cleaning is a big issue, and also mentioned her old roommates never did any cleaning.","points":[{"speaker":"Speaker 1 (Female)","points":["where to live for our final year \u4f60\u4eec\u5bf9\u4e8e\u6700\u540e\u4e00\u5e74\u4f4f\u54ea\u91cc\u6709\u4ec0\u4e48\u60f3\u6cd5\uff1f"]},{"speaker":"Speaker 2 (Male)","points":["live off campus \u6211\u51c6\u5907\u4f4f\u6821\u5916"]},{"speaker":"Speaker 1 (Female)","points":["move back into the school residence \u6211\u51c6\u5907\u56de\u5230\u5b66\u6821\u4f4f"]},{"speaker":"Speaker 2 (Male)","points":["living on campus \u4f4f\u5b66\u6821\u5176\u5b9e\u633a\u597d\u7684","good facilities, entertainment \u6709\u8bbe\u65bd\u3001\u6709\u5a31\u4e50","flat share after two years \u51c6\u5907\u4e24\u5e74\u540e\u5408\u79df"]},{"speaker":"Speaker 3 (Male)","points":["a new environment and the chance to meet more people \u6211\u60f3\u6362\u4e2a\u73af\u5883\uff0c\u89c1\u66f4\u591a\u4eba","exam season \u5c24\u5176\u662f\u5728\u671f\u672b\u5b66\u4e60\u7684\u65f6\u5019","in the library surrounded by stressed-out students \u4e0d\u60f3\u5728\u56fe\u4e66\u9986\uff0c\u5468\u56f4\u90fd\u662f\u538b\u529b\u5927\u7684\u5b66\u751f"]},{"speaker":"Speaker 1 (Female)","points":["be careful when choosing who to live with \u4f60\u4eec\u627e\u4f4f\u5bbf\u7684\u65f6\u5019\u8981\u5c0f\u5fc3","my roommate only wanted to party\u6211\u4e4b\u524d\u5408\u79df\u7684\u5ba4\u53cb\u53ea\u60f3\u73a9","shut myself in my room \u6211\u53ea\u80fd\u5173\u5728\u623f\u95f4\u91cc\u81ea\u5df1\u5b66"]},{"speaker":"Speaker 2 (Male)","points":["friends decided to share a flat together \u6211\u4eec\u56db\u4e2a\u670b\u53cb\u5df2\u7ecf\u51b3\u5b9a\u597d\u4e00\u8d77\u5408\u79df","study together and stay focused \u6211\u4eec\u53ef\u4ee5\u4e00\u8d77\u4e13\u6ce8\u5b66\u4e60","manage to get top grades \u6211\u4eec\u5e73\u65f6\u4e5f\u90fd\u662f\u80fd\u62ff\u9ad8\u5206\u7684"]},{"speaker":"Speaker 3 (Male)","points":["have a friend renting a place off campus\u6211\u5df2\u7ecf\u6709\u4e00\u4e2a\u670b\u53cb\u5728\u5916\u9762\u79df\u623f","invited me to join him \u4ed6\u9080\u8bf7\u6211\u4e0e\u4ed6\u5408\u79df","agreed to share cleaning duties \u6211\u4eec\u4fdd\u8bc1\u4e00\u8d77\u6e05\u6d01\u623f\u95f4"]},{"speaker":"Speaker 1 (Female)","points":["cleaning is a big issue \u6e05\u6d01\u4e5f\u662f\u4e00\u4e2a\u5927\u95ee\u9898","my old roommates never did any cleaning \u6211\u4ee5\u524d\u7684\u5ba4\u53cb\u90fd\u5b8c\u5168\u4e0d\u505a\u6e05\u6d01"]}],"keywords":["entertainment","environment","facilities","surrounded","residence","roommates","stressed","choosing","roommate","together","cleaning","library","careful","friends","decided","focused","renting","invited","living","chance","season","myself","manage","grades","friend","agreed","duties","final","share","after","years","party","study","place","issue","live","year","move","back","good","flat","meet","exam","shut","room","stay","join","new","top","big","old"]},{"qid":"F211045","title":"Street Graffiti and Public Art \u8857\u5934\u6d82\u9e26\u4e0e\u516c\u5171\u827a\u672f","source":"\u8424\u706b\u866b\u5b98\u65b9\u5468\u9884\u6d4b \u00b7 \u6781\u9ad8\u9891","tags":["\u6781\u9ad8\u9891"],"kind":"F","audio":"sgd_audio/F211045.mp3","audio_remote":"https://upload.fireflyau.com/pte/SSGD/r/de0c48046522acdde6547b72dbd262cb.mp3","discussion":"Three students are discussing graffiti and street art.\n\nSpeaker 1 (Male)\nWhen I was walking towards the train station yesterday, I passed an old factory wall covered with graffiti. I just stood there looking at it, and honestly, it was amazing. The paintings were so detailed and colorful that it almost felt like an outdoor art gallery.\n\nSpeaker 2 (Female)\nYes, but isn\u2019t it illegal? Even if it isn\u2019t, I think it probably should be. Personally, I\u2019m against it because it\u2019s basically vandalism. A lot of people do it during the night when there are no police around, and usually they even have someone watching out for them.\n\nSpeaker 3 (Female)\nI agree to some extent. There are other places where they can paint and express themselves, and nowadays there are also online platforms. Artists can post their work on the Internet instead of painting on public walls.\n\nSpeaker 1 (Male)\nBut I wasn\u2019t talking about random writing or tagging. I mean actual paintings of people on the street, wearing sunglasses and things like that. Some of them are incredibly creative. I stood there for quite a while just looking at them and thinking. It made the whole area feel more alive and interesting.\n\nSpeaker 2 (Female)\nI understand what you mean, but surely there should be designated places for that kind of art. Artists could also sell their work online or display it legally in galleries instead of painting on factory walls without permission.\n\nSpeaker 3 (Female)\nPersonally, I don\u2019t like the idea of doing absolutely everything online. Seeing artwork in real public spaces feels different. It creates an atmosphere that you can\u2019t really experience through a screen.\n\nSpeaker 1 (Male)\nExactly. I think artists should have some freedom to express themselves in public spaces, especially when the artwork actually improves the environment instead of damaging it.\n\nSpeaker 2 (Female)\nMaybe. But I still think there should be rules and designated areas. I actually know an artist who paints legally in public spaces, and his work is still very popular without causing problems for anyone.","bilingual":"Three students are discussing graffiti and street art.\n\u4e09\u540d\u5b66\u751f\u6b63\u5728\u8ba8\u8bba\u8857\u5934\u6d82\u9e26\u548c\u8857\u5934\u827a\u672f\u3002\n\nSpeaker 1 (Male)\nWhen I was walking towards the train station yesterday, I passed an old factory wall covered with graffiti. I just stood there looking at it, and honestly, it was amazing. The paintings were so detailed and colorful that it almost felt like an outdoor art gallery.\n\u53d1\u8a00\u4eba1\uff08\u7537\uff09\n\u6628\u5929\u6211\u8d70\u5411\u706b\u8f66\u7ad9\u7684\u65f6\u5019\uff0c\u7ecf\u8fc7\u4e86\u4e00\u9762\u6ee1\u662f\u6d82\u9e26\u7684\u65e7\u5de5\u5382\u5899\u3002\u6211\u5c31\u7ad9\u5728\u90a3\u91cc\u770b\u4e86\u4e00\u4f1a\u513f\uff0c\u8bf4\u5b9e\u8bdd\uff0c\u771f\u7684\u5f88\u60ca\u8273\u3002\u90a3\u4e9b\u753b\u975e\u5e38\u7cbe\u7ec6\u3001\u8272\u5f69\u4e30\u5bcc\uff0c\u611f\u89c9\u5c31\u50cf\u4e00\u4e2a\u9732\u5929\u827a\u672f\u9986\u3002\n\nSpeaker 2 (Female)\nYes, but isn\u2019t it illegal? Even if it isn\u2019t, I think it probably should be. Personally, I\u2019m against it because it\u2019s basically vandalism. A lot of people do it during the night when there are no police around, and usually they even have someone watching out for them.\n\u53d1\u8a00\u4eba2\uff08\u5973\uff09\n\u662f\u554a\uff0c\u4f46\u8fd9\u4e0d\u662f\u8fdd\u6cd5\u5417\uff1f\u5373\u4f7f\u4e0d\u662f\uff0c\u6211\u89c9\u5f97\u4e5f\u5e94\u8be5\u7b97\u8fdd\u6cd5\u3002\u6211\u4e2a\u4eba\u662f\u53cd\u5bf9\u7684\uff0c\u56e0\u4e3a\u8fd9\u672c\u8d28\u4e0a\u5c31\u662f\u7834\u574f\u516c\u5171\u8bbe\u65bd\u3002\u5f88\u591a\u4eba\u90fd\u662f\u665a\u4e0a\u8d81\u6ca1\u6709\u8b66\u5bdf\u7684\u65f6\u5019\u53bb\u753b\uff0c\u751a\u81f3\u8fd8\u4f1a\u6709\u4eba\u4e13\u95e8\u5e2e\u4ed6\u4eec\u653e\u98ce\u3002\n\nSpeaker 3 (Female)\nI agree to some extent. There are other places where they can paint and express themselves, and nowadays there are also online platforms. Artists can post their work on the Internet instead of painting on public walls.\n\u53d1\u8a00\u4eba3\uff08\u5973\uff09\n\u6211\u67d0\u79cd\u7a0b\u5ea6\u4e0a\u540c\u610f\u3002\u5176\u5b9e\u4ed6\u4eec\u8fd8\u6709\u5176\u4ed6\u5730\u65b9\u53ef\u4ee5\u753b\u753b\u3001\u8868\u8fbe\u81ea\u5df1\uff0c\u800c\u4e14\u73b0\u5728\u4e5f\u6709\u5f88\u591a\u7f51\u7edc\u5e73\u53f0\u3002\u827a\u672f\u5bb6\u5b8c\u5168\u53ef\u4ee5\u628a\u4f5c\u54c1\u53d1\u5230\u7f51\u4e0a\uff0c\u800c\u4e0d\u662f\u753b\u5728\u516c\u5171\u5899\u9762\u4e0a\u3002\n\nSpeaker 1 (Male)\nBut I wasn\u2019t talking about random writing or tagging. I mean actual paintings of people on the street, wearing sunglasses and things like that. Some of them are incredibly creative. I stood there for quite a while just looking at them and thinking. It made the whole area feel more alive and interesting.\n\u53d1\u8a00\u4eba1\uff08\u7537\uff09\n\u4f46\u6211\u8bf4\u7684\u4e0d\u662f\u90a3\u79cd\u4e71\u5199\u4e71\u753b\u3002\u6211\u6307\u7684\u662f\u90a3\u79cd\u771f\u6b63\u7684\u8857\u5934\u7ed8\u753b\uff0c\u6bd4\u5982\u753b\u8857\u4e0a\u7684\u4eba\u7269\u3001\u6234\u7740\u58a8\u955c\u7684\u4eba\u4e4b\u7c7b\u7684\u3002\u6709\u4e9b\u4f5c\u54c1\u771f\u7684\u7279\u522b\u6709\u521b\u610f\u3002\u6211\u5728\u90a3\u91cc\u7ad9\u4e86\u5f88\u4e45\uff0c\u4e00\u8fb9\u770b\u4e00\u8fb9\u601d\u8003\u3002\u90a3\u4e9b\u4f5c\u54c1\u8ba9\u6574\u4e2a\u533a\u57df\u90fd\u53d8\u5f97\u66f4\u6709\u6d3b\u529b\u3001\u66f4\u6709\u610f\u601d\u3002\n\nSpeaker 2 (Female)\nI understand what you mean, but surely there should be designated places for that kind of art. Artists could also sell their work online or display it legally in galleries instead of painting on factory walls without permission.\n\u53d1\u8a00\u4eba2\uff08\u5973\uff09\n\u6211\u660e\u767d\u4f60\u7684\u610f\u601d\uff0c\u4f46\u8fd9\u79cd\u827a\u672f\u5e94\u8be5\u8fd8\u662f\u8981\u6709\u4e13\u95e8\u7684\u533a\u57df\u5427\u3002\u827a\u672f\u5bb6\u4e5f\u53ef\u4ee5\u5728\u7f51\u4e0a\u5356\u4f5c\u54c1\uff0c\u6216\u8005\u5408\u6cd5\u5730\u5728\u753b\u5eca\u5c55\u51fa\uff0c\u800c\u4e0d\u662f\u672a\u7ecf\u5141\u8bb8\u5c31\u5728\u5de5\u5382\u5899\u4e0a\u4f5c\u753b\u3002\n\nSpeaker 3 (Female)\nPersonally, I don\u2019t like the idea of doing absolutely everything online. Seeing artwork in real public spaces feels different. It creates an atmosphere that you can\u2019t really experience through a screen.\n\u53d1\u8a00\u4eba3\uff08\u5973\uff09\n\u5c31\u6211\u4e2a\u4eba\u800c\u8a00\uff0c\u6211\u4e0d\u559c\u6b22\u6240\u6709\u4e8b\u60c5\u90fd\u642c\u5230\u7f51\u4e0a\u3002\u5728\u771f\u5b9e\u516c\u5171\u7a7a\u95f4\u91cc\u770b\u5230\u827a\u672f\u4f5c\u54c1\u7684\u611f\u89c9\u662f\u4e0d\u4e00\u6837\u7684\uff0c\u90a3\u79cd\u6c1b\u56f4\u662f\u5c4f\u5e55\u91cc\u611f\u53d7\u4e0d\u5230\u7684\u3002\n\nSpeaker 1 (Male)\nExactly. I think artists should have some freedom to express themselves in public spaces, especially when the artwork actually improves the environment instead of damaging it.\n\u53d1\u8a00\u4eba1\uff08\u7537\uff09\n\u6ca1\u9519\u3002\u6211\u89c9\u5f97\u827a\u672f\u5bb6\u5e94\u8be5\u6709\u4e00\u5b9a\u7684\u81ea\u7531\u5728\u516c\u5171\u7a7a\u95f4\u8868\u8fbe\u81ea\u5df1\uff0c\u5c24\u5176\u662f\u5f53\u8fd9\u4e9b\u4f5c\u54c1\u5b9e\u9645\u4e0a\u662f\u5728\u7f8e\u5316\u73af\u5883\uff0c\u800c\u4e0d\u662f\u7834\u574f\u73af\u5883\u7684\u65f6\u5019\u3002\n\nSpeaker 2 (Female)\nMaybe. But I still think there should be rules and designated areas. I actually know an artist who paints legally in public spaces, and his work is still very popular without causing problems for anyone.\n\u53d1\u8a00\u4eba2\uff08\u5973\uff09\n\u4e5f\u8bb8\u5427\u3002\u4f46\u6211\u8fd8\u662f\u89c9\u5f97\u5e94\u8be5\u6709\u89c4\u5219\u548c\u4e13\u95e8\u533a\u57df\u3002\u6211\u5176\u5b9e\u8ba4\u8bc6\u4e00\u4e2a\u827a\u672f\u5bb6\uff0c\u4ed6\u4f1a\u5728\u5408\u6cd5\u7684\u516c\u5171\u533a\u57df\u4f5c\u753b\uff0c\u800c\u4ed6\u7684\u4f5c\u54c1\u540c\u6837\u5f88\u53d7\u6b22\u8fce\uff0c\u4e5f\u4e0d\u4f1a\u7ed9\u522b\u4eba\u5e26\u6765\u9ebb\u70e6\u3002","answer":"The conversation is about three speakers discussing graffiti and street art.\nSpeaker 1 mentioned that when he was walking towards a train station, he saw an old factory wall covered with graffiti, and also mentioned that it was amazing.\nThen, Speaker 2 asked, \u201cIsn\u2019t it illegal\u201d?  She then argued it\u2019s basically vandalism and said some people do it during the night when there are no police around.\nAnd then, Speaker 3 argued that there are other places where they can paint and express themselves.\nSpeaker 1 talked about actual paintings of people on the street, and also mentioned he stood there just looking at them and thinking.\nThen, Speaker 2 said the artists should sell their work online or display it legally in galleries.\nAnd then, Speaker 3 argued she doesn\u2019t like doing everything online.\nSpeaker 1 argued that artists should have some freedom.\nThen, Speaker 2 said there should be rules and designated areas, and then mentioned that she knows an artist who paints legally in public spaces.","points":[{"speaker":"Speaker 1 (Male)","points":["walking towards the train station \u8d70\u5411\u706b\u8f66\u7ad9\u7684\u65f6\u5019","an old factory wall covered with graffiti \u4e00\u9762\u6ee1\u662f\u6d82\u9e26\u7684\u65e7\u5de5\u5382\u5899","it was amazing \u5f88\u60ca\u8273"]},{"speaker":"Speaker 2 (Female)","points":["isn\u2019t it illegal? \u8fd9\u4e0d\u662f\u8fdd\u6cd5\u7684\u5417\uff1f","it\u2019s basically vandalism \u8fd9\u672c\u8d28\u4e0a\u5c31\u662f\u7834\u574f\u516c\u5171\u8bbe\u65bd","do it during the night when there are no police around \u665a\u4e0a\u8d81\u6ca1\u6709\u8b66\u5bdf\u65f6\u53bb\u753b"]},{"speaker":"Speaker 3 (Female)","points":["other places where they can paint and express themselves \u6709\u5176\u4ed6\u5730\u65b9\u53ef\u4ee5\u753b\u753b\u3001\u8868\u8fbe\u81ea\u5df1"]},{"speaker":"Speaker 1 (Male)","points":["actual paintings of people on the street \u771f\u6b63\u7684\u8857\u5934\u7ed8\u753b","stood there just looking at them and thinking \u7ad9\u5728\u90a3\uff0c\u4e00\u8fb9\u770b\u4e00\u8fb9\u601d\u8003"]},{"speaker":"Speaker 2 (Female)","points":["sell their work online \u5728\u7f51\u4e0a\u5356\u4f5c\u54c1","display it legally in galleries \u5408\u6cd5\u5730\u5728\u753b\u5eca\u5c55\u51fa"]},{"speaker":"Speaker 3 (Female)","points":["don\u2019t like doing everything online \u4e0d\u559c\u6b22\u6240\u6709\u4e8b\u60c5\u90fd\u642c\u5230\u7f51\u4e0a"]},{"speaker":"Speaker 1 (Male)","points":["artists should have some freedom \u827a\u672f\u5bb6\u5e94\u8be5\u6709\u4e00\u5b9a\u7684\u81ea\u7531"]},{"speaker":"Speaker 2 (Female)","points":["there should be rules and designated areas \u5e94\u8be5\u6709\u89c4\u5219\u548c\u4e13\u95e8\u533a\u57df","know an artist who paints legally in public spaces \u8ba4\u8bc6\u4e00\u4e2a\u827a\u672f\u5bb6\u4f1a\u5728\u5408\u6cd5\u7684\u516c\u5171\u533a\u57df\u4f5c\u753b"]}],"keywords":["themselves","everything","designated","vandalism","paintings","galleries","graffiti","thinking","walking","towards","station","factory","covered","amazing","illegal","express","looking","display","legally","artists","freedom","during","police","around","places","actual","street","online","artist","paints","public","spaces","train","night","paint","stood","rules","areas","wall","sell","work","old","isn","don"]},{"qid":"F211016","title":"Project Meeting Place \u9879\u76ee\u4f1a\u8bae\u5730\u70b9","source":"\u8424\u706b\u866b\u5b98\u65b9\u5468\u9884\u6d4b \u00b7 \u6781\u9ad8\u9891","tags":["\u6781\u9ad8\u9891"],"kind":"F","audio":"sgd_audio/F211016.mp3","audio_remote":"https://upload.fireflyau.com/pte/SSGD/r/cf624c4b8a597843e2d29250bfef23c9.mp3","discussion":"Three students are discussing their project meeting place on campus.\n\nI think we should meet in a conference room in the university library. We can conveniently borrow books we need right there while we work. It's a quiet space with plenty of resources, and we won't have to carry heavy books around later. Plus, the library has those small study rooms we can book if we need complete privacy.\n\nI'm not so sure about that idea the library is always so crowded during this time of day. There will be too many people studying and chatting outside the rooms, and it will be very noisy even inside the conference areas. Last time I tried to study there, I could hardly concentrate with all the distractions. Maybe we should consider someplace else that's actually quiet.\n\nI have a compromise-we can go to the library first to borrow all the books we need for our research in the morning. Then, we can catch up online. This way we get a quiet space to discuss in our own home.\n\nI totally agree! In this way, we can search for resources online at any time! Let\u2019s find a coffee shop to sit down and make a perfect task plan! Which coffee shop were you thinking about? There are several near campus, but most tend to be quite busy. Maybe we should look for someplace less popular?\n\nI like the idea, but I have to go back home around 4 PM to receive a package that's being delivered. I don't want to miss it, so it might make me a little late for the meeting. How about we meet at the coffee shop near the city center?\n\nNo, not that one. There are so many people and it\u2019s too crowded. What about that new place called \"Sweet Treats\"? It's a bit farther from campus, but I heard they have nice cakes and coffee. When you arrive, just find the long table on the first floor. We\u2019ll be there waiting for you.\n\nOK! Let\u2019s pick this one! I've passed by Sweet Treats a few times it does look cozy because it usually has fewer people. Plus, who can say no to sweet treats while working, right? Oh, and just remember to call us when you go out of home so we know when to expect you. We can start without you and fill you in when you arrive. If anything urgent comes up, we can always hop on a quick online call to keep you in the loop.\n\nGreat, then it's settled! We'll meet at the library at 3 PM, get our books, then walk over to Sweet Treats to assign tasks and discuss the project outline. Don't forget to call us when you're on your way!","bilingual":"Three students are discussing their project meeting place on campus.\n\u4e09\u540d\u5b66\u751f\u6b63\u5728\u8ba8\u8bba\u4ed6\u4eec\u5728\u6821\u56ed\u91cc\u4e3e\u884c\u9879\u76ee\u4f1a\u8bae\u7684\u5730\u70b9\u3002\n\nSpeaker1(Female)\nI think we should meet in a conference room in the university library.\n\u6211\u8ba4\u4e3a\u6211\u4eec\u5e94\u8be5\u5728\u5927\u5b66\u56fe\u4e66\u9986\u7684\u4f1a\u8bae\u5ba4\u89c1\u9762\u3002\nWe can conveniently borrow books we need right there while we work.\n\u5728\u90a3\u91cc\u6211\u4eec\u53ef\u4ee5\u65b9\u4fbf\u5730\u501f\u5230\u6211\u4eec\u6240\u9700\u7684\u4e66\u7c4d\uff0c\u540c\u65f6\u8fdb\u884c\u5de5\u4f5c\u3002\nIt's a quiet space with plenty of resources, and we won't have to carry heavy books around later.\n\u90a3\u662f\u4e00\u4e2a\u5b89\u9759\u7684\u5730\u65b9\uff0c\u8d44\u6e90\u4e30\u5bcc\uff0c\u4e4b\u540e\u6211\u4eec\u4e5f\u4e0d\u5fc5\u518d\u80cc\u7740\u6c89\u91cd\u7684\u4e66\u5305\u5230\u5904\u8d70\u52a8\u4e86\u3002\nPlus, the library has those small study rooms we can book if we need complete privacy.\n\u800c\u4e14\u56fe\u4e66\u9986\u6709\u6211\u4eec\u53ef\u4ee5\u9884\u8ba2\u7684\u5c0f\u578b\u81ea\u4e60\u5ba4\uff0c\u5982\u679c\u9700\u8981\u5b8c\u5168\u7684\u9690\u79c1\uff0c\u5c31\u53ef\u4ee5\u4f7f\u7528\u8fd9\u4e9b\u623f\u95f4\u3002\n\nSpeaker2(Male)\nI'm not so sure about that idea the library is always so crowded during this time of day.\n\u6211\u5bf9\u90a3\u4e2a\u60f3\u6cd5\u4e0d\u592a\u786e\u5b9a\uff0c\u56e0\u4e3a\u56fe\u4e66\u9986\u5728\u8fd9\u4e2a\u65f6\u5019\u603b\u662f\u975e\u5e38\u62e5\u6324\u3002\nThere will be too many people studying and chatting outside the rooms, and it will be very noisy even inside the conference areas.\n\u623f\u95f4\u5916\u9762\u4f1a\u6709\u592a\u591a\u4eba\u5728\u5b66\u4e60\u548c\u804a\u5929\uff0c\u5ba4\u5185\u4f1a\u8bae\u533a\u57df\u4e5f\u4f1a\u975e\u5e38\u5608\u6742\u3002\nLast time I tried to study there, I could hardly concentrate with all the distractions.\n\u6211\u4e0a\u6b21\u5c1d\u8bd5\u5728\u90a3\u91cc\u5b66\u4e60\u65f6\uff0c\u88ab\u5404\u79cd\u5e72\u6270\u641e\u5f97\u96be\u4ee5\u96c6\u4e2d\u6ce8\u610f\u529b\u3002\nMaybe we should consider someplace else that's actually quiet.\n\u4e5f\u8bb8\u6211\u4eec\u5e94\u8be5\u8003\u8651\u5176\u4ed6\u771f\u6b63\u5b89\u9759\u7684\u5730\u65b9\u3002\n\nSpeaker3(Female)\nI have a compromise-we can go to the library first to borrow all the books we need for our research in the morning.\n\u6211\u6709\u4e2a\u6298\u4e2d\u7684\u65b9\u6848\u2014\u2014\u6211\u4eec\u53ef\u4ee5\u4e0a\u5348\u5148\u53bb\u56fe\u4e66\u9986\u501f\u6211\u4eec\u7814\u7a76\u6240\u9700\u7684\u6240\u6709\u4e66\u7c4d\u3002\nThen, we can catch up online. This way we get a quiet space to discuss in our own home.\n\u7136\u540e\uff0c\u6211\u4eec\u53ef\u4ee5\u5728\u7f51\u4e0a\u7ee7\u7eed\u8ba8\u8bba\u3002\u8fd9\u6837\u6211\u4eec\u5728\u5bb6\u91cc\u5c31\u80fd\u6709\u4e00\u4e2a\u8212\u9002\u7684\u4ea4\u6d41\u7a7a\u95f4\u3002\n\nSpeaker1(Female)\nI totally agree! In this way, we can search for resources online at any time!\n\u6211\u5b8c\u5168\u540c\u610f\uff01\u8fd9\u6837\u6211\u4eec\u5c31\u53ef\u4ee5\u968f\u65f6\u5728\u7ebf\u4e0a\u67e5\u627e\u8d44\u6599\u3002\nLet\u2019s find a coffee shop to sit down and make a perfect task plan!\n\u6211\u4eec\u627e\u4e00\u5bb6\u5496\u5561\u5385\uff0c\u5750\u4e0b\u6765\u5236\u5b9a\u4e00\u4e0b\u4efb\u52a1\u8ba1\u5212\u5427\uff01\nWhich coffee shop were you thinking about?\n\u4f60\u4eec\u60f3\u53bb\u54ea\u5bb6\u5496\u5561\u9986\u5462\uff1f\nThere are several near campus, but most tend to be quite busy.\n\u6821\u56ed\u9644\u8fd1\u6709\u51e0\u5bb6\u5496\u5561\u5e97\uff0c\u4f46\u5927\u591a\u6570\u90fd\u4f1a\u975e\u5e38\u7e41\u5fd9\u3002\nMaybe we should look for someplace less popular?\n\u6216\u8bb8\u6211\u4eec\u5e94\u8be5\u627e\u4e00\u5bb6\u4e0d\u592a\u70ed\u95e8\u7684\u5e97\uff1f\n\nSpeaker2(Male)\nI like the idea, but I have to go back home around 4 PM to receive a package that's being delivered.\n\u6211\u559c\u6b22\u8fd9\u4e2a\u60f3\u6cd5\uff0c\u4f46\u6211\u4e0b\u5348\u56db\u70b9\u5de6\u53f3\u5f97\u56de\u5bb6\u53bb\u63a5\u6536\u4e00\u4e2a\u6b63\u5728\u6d3e\u9001\u7684\u5305\u88f9\u3002\nI don't want to miss it, so it might make me a little late for the meeting.\n\u6211\u4e0d\u60f3\u9519\u8fc7\u5b83\uff0c\u6240\u4ee5\u6211\u4f1a\u6709\u70b9\u8fdf\u5230\u3002\nHow about we meet at the coffee shop near the city center?\n\u6211\u4eec\u5728\u5e02\u4e2d\u5fc3\u7684\u90a3\u5bb6\u5496\u5561\u9986\u89c1\u9762\u53ef\u4ee5\u5417\uff1f\n\nSpeaker1(Female)\nNo, not that one. There are so many people and it\u2019s too crowded.\n\u4e0d\uff0c\u4e0d\u662f\u90a3\u5bb6\u3002\u90a3\u5bb6\u4eba\u592a\u591a\u4e86\u592a\u62e5\u6324\u4e86\u3002\nWhat about that new place called \"Sweet Treats\"?\n\u90a3\u5bb6\u53eb\u201c\u751c\u98df\u201d\u7684\u65b0\u5e97\u600e\u4e48\u6837\uff1f\nIt's a bit farther from campus, but I heard they have nice cakes and coffee.\n\u5b83\u79bb\u6821\u56ed\u6709\u70b9\u8fdc\uff0c\u4f46\u6211\u542c\u8bf4\u4ed6\u4eec\u6709\u5f88\u68d2\u7684\u7cd5\u70b9\u548c\u5496\u5561\u3002\nWhen you arrive, just find the long table on the first floor. We\u2019ll be there waiting for you.\n\u4f60\u5230\u4e86\u540e\u53bb\u4e00\u697c\u7684\u957f\u684c\u627e\u6211\u4eec\uff0c\u6211\u4eec\u5728\u90a3\u91cc\u7b49\u4f60\u3002\n\nSpeaker3(Female)\nOK! Let\u2019s pick this one! I've passed by Sweet Treats a few times it does look cozy because it usually has fewer people.\n\u597d\u7684\uff01\u5c31\u8fd9\u5bb6\u5427\uff01\u6211\u51e0\u6b21\u8def\u8fc7\u201c\u751c\u98df\u201d\u5e97\uff0c\u5b83\u770b\u8d77\u6765\u8fd8\u633a\u6e29\u99a8\u7684\uff0c\u56e0\u4e3a\u8fd9\u91cc\u901a\u5e38\u4eba\u8981\u5c11\u4e00\u4e9b.\nPlus, who can say no to sweet treats while working, right?\n\u800c\u4e14\u5de5\u4f5c\u7684\u65f6\u5019\u80fd\u5403\u5230\u751c\u98df\uff0c\u8c01\u53c8\u80fd\u62d2\u7edd\u5462\uff1f\nOh, and just remember to call us when you go out of home so we know when to expect you.\n\u54e6\u5bf9\u4e86\uff0c\u4f60\u51fa\u95e8\u7684\u65f6\u5019\u8bb0\u5f97\u7ed9\u6211\u4eec\u6253\u7535\u8bdd\uff0c\u8fd9\u6837\u6211\u4eec\u5c31\u80fd\u77e5\u9053\u4ec0\u4e48\u65f6\u5019\u80fd\u89c1\u5230\u4f60\u4e86\u3002\nWe can start without you and fill you in when you arrive.\n\u6211\u4eec\u53ef\u4ee5\u5148\u5f00\u59cb\uff0c\u7b49\u4f60\u5230\u4e86\u518d\u7ed9\u4f60\u4ecb\u7ecd\u60c5\u51b5\u3002\nIf anything urgent comes up, we can always hop on a quick online call to keep you in the loop.\n\u5982\u679c\u6709\u7d27\u6025\u7684\u4e8b\u60c5\u53d1\u751f\uff0c\u6211\u4eec\u968f\u65f6\u53ef\u4ee5\u901a\u8fc7\u5feb\u901f\u7684\u5728\u7ebf\u901a\u8bdd\u6765\u8ba9\u4f60\u4e86\u89e3\u60c5\u51b5\u3002\n\nSpeaker1(Female)\nGreat, then it's settled!\n\u592a\u597d\u4e86\uff0c\u90a3\u5c31\u5b9a\u4e86\uff01\nWe'll meet at the library at 3 PM, get our books,\n\u6211\u4eec\u4e0b\u5348\u4e09\u70b9\u5728\u56fe\u4e66\u9986\u78b0\u9762\uff0c\u5148\u53bb\u62ff\u4e66\uff0c\nthen walk over to Sweet Treats to assign tasks and discuss the project outline.\n\u7136\u540e\u8d70\u5230\u201c\u751c\u98df\u201d\u5e97\u53bb\u5206\u914d\u4efb\u52a1\u5e76\u8ba8\u8bba\u9879\u76ee\u5927\u7eb2\u3002\nDon't forget to call us when you're on your way!\n\u8bb0\u5f97\u4f60\u51fa\u53d1\u7684\u65f6\u5019\u7ed9\u6211\u4eec\u6253\u7535\u8bdd\u54e6\uff01","answer":"The conversation is about three speakers discussing the project meeting place.\nSpeaker 1 talked about meeting in a conference room in the university library, and also mentioned they can conveniently borrow books, and it\u2019s a quiet space with plenty of resources, and it has small study rooms for complete privacy.\nThen, Speaker 2 said there are too many people studying and chatting, so it\u2019s very noisy, and then discussed that he can hardly concentrate with all the distractions.\nAnd then, Speaker 3 argued they can go to the library first to borrow all the books and then catch up online, and also referred to getting a quiet space to discuss, like in their own home.\nSpeaker 1 talked about searching for resources online at any time, and also mentioned that they can find a coffee shop and then sit down and make a plan.\nThen, Speaker 2 said he needs to go back home around 4 PM to receive a package, so he will be a little late for the meeting, and then suggested a coffee shop near the city center.\nAnd then, Speaker 1 suggested the new place called \"Sweet Treats\" because it has nice cakes and coffee, and also referred to the long table on the first floor.\nSpeaker 3 said it looks cozy, and asked speaker 2 to call them when he goes out of the home, and will fill him in when he arrives, and also mentioned that if there is anything urgent, they can hop on a quick online call.\nThen, Speaker 1 said they can meet at the library at 3 PM, get books, and then walk over to assign tasks and discuss the project outline.","points":[{"speaker":"Speaker 1 (Female)","points":["meet in a conference room in the university library \u5728\u5927\u5b66\u56fe\u4e66\u9986\u7684\u4f1a\u8bae\u5ba4\u5f00\u4f1a","conveniently borrow books \u501f\u4e66\u5f88\u65b9\u4fbf","a quiet space with plenty of resources \u5b89\u9759\u4e14\u6709\u5f88\u591a\u8d44\u6e90","small study rooms for complete privacy \u5c0f\u7684\u5b66\u4e60\u5ba4\u53ef\u4ee5\u4fdd\u8bc1\u5b8c\u5168\u7684\u9690\u79c1"]},{"speaker":"Speaker 2 (Male)","points":["too many people studying and chatting \u5f88\u591a\u4eba\u5b66\u4e60\u6216\u8c08\u8bdd","very noisy \u5f88\u5608\u6742","hardly concentrate with all the distractions \u5f88\u96be\u4e13\u6ce8"]},{"speaker":"Speaker 3 (Female)","points":["go to the library first to borrow all the books \u5148\u501f\u4e66","catch up online \u5728\u7f51\u4e0a\u7ee7\u7eed","get a quiet space to discuss \u627e\u4e2a\u5b89\u9759\u7684\u5730\u65b9\u8ba8\u8bba","in our own home \u5728\u6211\u4eec\u81ea\u5df1\u5bb6\u91cc"]},{"speaker":"Speaker 1 (Female)","points":["search for resources online at any time \u968f\u65f6\u5728\u7ebf\u4e0a\u67e5\u627e\u8d44\u6599","find a coffee shop \u627e\u4e00\u5bb6\u5496\u5561\u5385","sit down and make a plan \u5750\u4e0b\u6765\u5b9a\u4e2a\u4efb\u52a1\u8ba1\u5212"]},{"speaker":"Speaker 2 (Male)","points":["go back home around 4 PM to receive a package \u4e0b\u5348\u56db\u70b9\u56de\u5bb6\u62ff\u5305\u88f9","a little late for the meeting \u53c2\u4f1a\u8981\u8fdf\u4f1a\u513f\u5230","coffee shop near the city center \u5e02\u4e2d\u5fc3\u90a3\u5bb6\u5496\u5561\u9986"]},{"speaker":"Speaker 1 (Female)","points":["new place called \"Sweet Treats\" \u53eb\u201c\u751c\u70b9\u201d\u5e97\u7684\u65b0\u5730\u65b9","nice cakes and coffee \u7f8e\u5473\u7684\u7cd5\u70b9\u548c\u5496\u5561","the long table on the first floor \u4e00\u697c\u7684\u957f\u684c"]},{"speaker":"Speaker 3 (Female)","points":["looks cozy \u770b\u8d77\u6765\u5f88\u6e29\u99a8","call us when you go out of home \u51fa\u95e8\u65f6\u6253\u7535\u8bdd\u7ed9\u6211\u4eec","fill you in when you arrive \u7b49\u4f60\u5230\u4e86\u518d\u7ed9\u4f60\u4ecb\u7ecd\u60c5\u51b5","anything urgent \u7d27\u6025\u4e8b\u60c5","hop on a quick online call \u5feb\u901f\u6253\u4e2a\u5728\u7ebf\u7535\u8bdd"]},{"speaker":"Speaker 1 (Female)","points":["meet at the library at 3 PM \u4e0b\u5348\u4e09\u70b9\u5728\u56fe\u4e66\u9986\u89c1\u9762","get books \u62ff\u4e66","walk over to assign tasks \u8d70\u7740\u53bb\u5206\u914d\u4efb\u52a1","discuss the project outline \u5728\u7ebf\u8ba8\u8bba\u9879\u76ee"]}],"keywords":["conveniently","distractions","concentrate","conference","resources","complete","studying","chatting","anything","library","privacy","discuss","receive","package","meeting","project","outline","borrow","plenty","hardly","online","search","coffee","around","little","center","called","treats","arrive","urgent","assign","books","quiet","space","small","study","rooms","noisy","catch","place","sweet","cakes","table","floor","looks","quick","tasks","meet","room","home","find","shop","plan","back","late","near","city","nice","long","cozy","call","fill","walk","too","sit","new","hop"]}];
const TOTAL = DATA.length;

let state = {
  source: 'all',
  tag: 'all',
  practice: true,
  speed: 1,
  idx: 0
};

try {
  const saved = localStorage.getItem('sgd_state_v1');
  if (saved) {
    const p = JSON.parse(saved);
    if (typeof p.source === 'string') state.source = p.source;
    if (typeof p.tag === 'string') state.tag = p.tag;
    if (typeof p.practice === 'boolean') state.practice = p.practice;
    if (typeof p.idx === 'number') state.idx = p.idx;
  }
} catch (e) {}

function filtered() {
  return DATA.filter(function (q) {
    if (state.source !== 'all' && q.kind !== state.source) return false;
    if (state.tag !== 'all' && q.tags.indexOf(state.tag) === -1) return false;
    return true;
  });
}

function saveState() {
  try { localStorage.setItem('sgd_state_v1', JSON.stringify(state)); } catch (e) {}
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 关键词标红(要点关键词,单词级、不区分大小写、整词匹配)
function hl(text, kws) {
  const safe = esc(text);
  if (!kws || !kws.length) return safe;
  const re = new RegExp("(^|[^A-Za-z'])(" + kws.join("|") + ")(?=[^A-Za-z']|$)", "gi");
  return safe.replace(re, '$1<span class="kwr">$2</span>');
}

function renderCard() {

    document.getElementById('remainText').textContent = '';

    return;
  }
  if (state.idx >= list.length) state.idx = 0;

  // 跳转下拉
  let opts = '';
  for (let i = 0; i < list.length; i++) {
    const item = list[i];

  jump.innerHTML = opts;

  // 标签

    }
    pointsHtml =

        '<div class="section-head" onclick="toggleSection(this)">说话人要点表(按人整理) <span class="arrow">▶</span></div>' +

  // 参考答案

  } else if (!firefly) {

  }

  const discussion = q.discussion || '(本题暂无讨论原文)';
  const textLabel = firefly ? '讨论原文' : '参考对话 · 逐字稿(即答案)';
  const audioHtml =
    '<div class="audio-box">' +
      '<audio id="audioEl" controls preload="none" src="' + esc(q.audio) + '" onerror="audioFallback(this)"></audio>' +
      '<button class="speed-btn' + (state.speed === 0.75 ? ' on' : '') + '" onclick="setSpeed(0.75)">0.75x</button>' +
      '<button class="speed-btn' + (state.speed === 1 ? ' on' : '') + '" onclick="setSpeed(1)">1x</button>' +
      '<button class="speed-btn' + (state.speed === 1.25 ? ' on' : '') + '" onclick="setSpeed(1.25)">1.25x</button>' +
      '<span class="audio-hint">本地音频 · 失败自动切换线上源</span>' +
    '</div>';

  host.innerHTML =
    '<div class="card active">' +
      '<div class="card-top">' +
        '<span class="qid-badge ' + (firefly ? '' : 'm') + '">' + esc(q.qid) + '</span>' +
        '<div class="card-title">' + esc(q.title) + '</div>' +
        tagHtml +
      '</div>' +
      '<div class="source-line">来源:' + esc(q.source) + (firefly ? ' · 官方打分:听力 20% + 口语 19%' : '') + '</div>' +
      audioHtml +
      '<div class="split-layout">' +
        '<div class="split-col">' +
          '<div class="split-col-title">📄 原文</div>' +
          '<div class="section open" id="secText">' +
            '<div class="section-head" onclick="toggleSection(this)">' + esc(textLabel) + (q.keywords && q.keywords.length ? '<span class="kw-legend">红色 = 要点关键词</span>' : '') + ' <span class="arrow">▶</span></div>' +
            '<div class="section-body"><div class="pre-wrap">' + hl(discussion, q.keywords) + '</div></div>' +
          '</div>' +
          bilingualHtml +
        '</div>' +
        '<div class="split-col">' +
          '<div class="split-col-title">🎯 参考答案</div>' +
          answerHtml +
          pointsHtml +
        '</div>' +
      '</div>' +
    '</div>';

  document.getElementById('posText').textContent = '第 ' + (state.idx + 1) + ' / ' + list.length + ' 题';
  document.getElementById('remainText').textContent = '本筛选共 ' + list.length + ' 题';
  document.getElementById('prevBtn').disabled = state.idx === 0;
  document.getElementById('nextBtn').disabled = state.idx >= list.length - 1;
  document.getElementById('progressFill').style.width = ((state.idx + 1) / list.length * 100) + '%';

  const audio = document.getElementById('audioEl');
  if (audio) audio.playbackRate = state.speed;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  saveState();
}

function audioFallback(el) {
  const q = filtered()[state.idx];
  if (!q || !q.audio_remote || el.dataset.fb === '1') return;
  el.dataset.fb = '1';
  el.src = q.audio_remote;
  el.load();
}

function setSource(v) {
  state.source = v;
  state.idx = 0;
  const chips = document.querySelectorAll('.chip[data-source]');
  for (let i = 0; i < chips.length; i++) chips[i].classList.toggle('active', chips[i].dataset.source === v);
  renderCard();
}

function setTag(v) {
  state.tag = v;
  state.idx = 0;
  const chips = document.querySelectorAll('.chip[data-tag]');
  for (let i = 0; i < chips.length; i++) chips[i].classList.toggle('active', chips[i].dataset.tag === v);
  renderCard();
}

function go(delta) {
  const list = filtered();
  const next = state.idx + delta;
  if (next < 0 || next >= list.length) return;
  state.idx = next;
  renderCard();
}

function jumpTo(v) {
  state.idx = Number(v) || 0;
  renderCard();
}

function togglePractice() {
  state.practice = !state.practice;
  document.getElementById('practiceSwitch').classList.toggle('on', state.practice);
  renderCard();
}

function revealAnswer() {
  const sec = document.getElementById('secAnswer');
  const box = document.querySelector('.answer-hidden-box');
  if (box) {
    const q = filtered()[state.idx];
    box.outerHTML =
      '<div class="section open" id="secAnswer">' +
        '<div class="section-head" onclick="toggleSection(this)">参考答案 <span class="arrow">▶</span></div>' +
        '<div class="section-body"><div class="pre-wrap">' + esc(q.answer) + '</div></div>' +
      '</div>';
  }
}

function toggleSection(head) {
  head.parentElement.classList.toggle('open');
}

function setSpeed(v) {
  state.speed = v;
  const audio = document.getElementById('audioEl');
  if (audio) audio.playbackRate = v;
  const btns = document.querySelectorAll('.speed-btn');
  for (let i = 0; i < btns.length; i++) {
    const val = parseFloat(btns[i].textContent);
    btns[i].classList.toggle('on', val === v);
  }
}

document.addEventListener('keydown', function (e) {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) return;
  if (e.key === 'ArrowLeft') { go(-1); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { go(1); e.preventDefault(); }
  else if (e.key === ' ' || e.code === 'Space') {
    const audio = document.getElementById('audioEl');
    if (audio) { e.preventDefault(); if (audio.paused) audio.play(); else audio.pause(); }
  }
});

renderCard();
  </script>
</body>
</html>
