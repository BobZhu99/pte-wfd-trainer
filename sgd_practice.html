u9898","source":"\u8424\u706b\u866b\u5b98\u65b9\u5468\u9884\u6d4b \u00b7 \u6781\u9ad8\u9891","tags":["\u6781\u9ad8\u9891"],"kind":"F","audio":"sgd_audio/F211001.mp3","audio_remote":"https://upload.fireflyau.com/pte/SSGD/r/42c2fa71fed2a40baa72f2f1298d6465.mp3","discussion":"Three students are discussing the accommodation options next academic year.\n\nHey guys, I was wondering if you've made any decisions about where you're planning to live next academic year? I know the housing application deadlines are coming up soon, and I'm still trying to weigh my options between staying in university accommodation or finding a private flat.\n\nActually, I just signed a contract yesterday for a studio apartment in the city center, and I couldn't be more relieved! After a full year in the noisy dormitory, I'm really looking forward to having my own quiet space. What I hated most about dorm life was the constant disturbance - people coming and going at all hours, loud music in the evenings, and the worst part was definitely sharing kitchen facilities. I'm quite particular about my food, and it drove me crazy when people would help themselves to things from my shelf in the fridge. This new place is slightly more expensive, but for me, having that privacy and peace is absolutely worth the extra cost.\n\nThat's interesting because my experience has been completely the opposite! I've actually grown to love dormitory living, especially because of the shared kitchen. Cooking has always been my passion, and I've found it's such a wonderful way to connect with people from different cultures. Just last week, my French roommate taught me how to make authentic cr\u00eapes, and in return I showed her some traditional dishes from my country. Those spontaneous cooking sessions often turn into great conversations where we learn so much about each other's backgrounds. For me, that cultural exchange is one of the most valuable parts of university life that I'd miss in private accommodation.\n\nI have to agree with staying in university housing, though for slightly different reasons. The convenience factor is unbeatable - my dorm is literally a three-minute walk from all my lecture halls. When I have 9am classes, I can wake up at 8:45 and still make it on time! But more importantly, I've found the academic support system invaluable. During exam periods last semester, we organized nightly study groups in the common room where we could quiz each other and explain difficult concepts. That collaborative environment really helped boost my grades in ways I don't think would have happened if I was living alone off-campus.","bilingual":"Three students are discussing the accommodation options next academic year.\n\u4e09\u540d\u5b66\u751f\u6b63\u5728\u8ba8\u8bba\u4e0b\u4e00\u5b66\u5e74\u7684\u4f4f\u5bbf\u9009\u62e9\u3002\n\nSpeaker 1 (Female)\nHey guys, I was wondering if you've made any decisions about where you're planning to live next academic year?\n\u55e8\uff0c\u5927\u5bb6\u597d\uff0c\u6211\u60f3\u95ee\u95ee\u4f60\u4eec\u6709\u6ca1\u6709\u51b3\u5b9a\u597d\u4e0b\u5b66\u5e74\u4f4f\u5728\u54ea\u91cc\uff1f\nI know the housing application deadlines are coming up soon, and I'm still trying to weigh my options between staying in university accommodation or finding a private flat.\n\u6211\u77e5\u9053\u4f4f\u5bbf\u7533\u8bf7\u7684\u622a\u6b62\u65e5\u671f\u9a6c\u4e0a\u5c31\u8981\u5230\u4e86\uff0c\u6211\u73b0\u5728\u8fd8\u5728\u6743\u8861\uff0c\u662f\u7ee7\u7eed\u4f4f\u5b66\u6821\u5bbf\u820d\uff0c\u8fd8\u662f\u81ea\u5df1\u51fa\u53bb\u627e\u4e00\u5957\u79c1\u4eba\u516c\u5bd3\u3002\n\nSpeaker 2 (Male)\nActually, I just signed a contract yesterday for a studio apartment in the city center, and I couldn't be more relieved!\n\u5176\u5b9e\u6211\u6628\u5929\u521a\u521a\u7b7e\u4e86\u5e02\u4e2d\u5fc3\u4e00\u5957\u5355\u95f4\u516c\u5bd3\u7684\u5408\u540c\uff0c\u771f\u7684\u4e00\u4e0b\u5b50\u8f7b\u677e\u4e86\u5f88\u591a\uff01\nAfter a full year in the noisy dormitory, I'm really looking forward to having my own quiet space.\n\u5728\u5435\u95f9\u7684\u5bbf\u820d\u4f4f\u4e86\u4e00\u6574\u5e74\u4e4b\u540e\uff0c\u6211\u7279\u522b\u671f\u5f85\u62e5\u6709\u5c5e\u4e8e\u81ea\u5df1\u7684\u5b89\u9759\u7a7a\u95f4\u3002\nWhat I hated most about dorm life was the constant disturbance - people coming and going at all hours, loud music in the evenings, and the worst part was definitely sharing kitchen facilities.\n\u6211\u6700\u53d7\u4e0d\u4e86\u5bbf\u820d\u751f\u6d3b\u7684\u4e00\u70b9\u5c31\u662f\u5404\u79cd\u4e0d\u65ad\u7684\u5e72\u6270\u2014\u2014\u6709\u4eba\u968f\u65f6\u8fdb\u8fdb\u51fa\u51fa\uff0c\u665a\u4e0a\u8fd8\u6709\u4eba\u653e\u5f88\u5927\u58f0\u7684\u97f3\u4e50\uff0c\u800c\u6700\u7cdf\u7cd5\u7684\u7edd\u5bf9\u662f\u5171\u7528\u53a8\u623f\u3002\nI'm quite particular about my food, and it drove me crazy when people would help themselves to things from my shelf in the fridge.\n\u6211\u5bf9\u5403\u7684\u6bd4\u8f83\u8bb2\u7a76\uff0c\u5f53\u522b\u4eba\u968f\u624b\u4ece\u6211\u653e\u5728\u51b0\u7bb1\u91cc\u7684\u90a3\u4e00\u5c42\u62ff\u4e1c\u897f\u65f6\uff0c\u771f\u7684\u4f1a\u8ba9\u6211\u6293\u72c2\u3002\nThis new place is slightly more expensive, but for me, having that privacy and peace is absolutely worth the extra cost.\n\u867d\u7136\u65b0\u4f4f\u5904\u7a0d\u5fae\u8d35\u4e00\u70b9\uff0c\u4f46\u5bf9\u6211\u6765\u8bf4\uff0c\u80fd\u6709\u9690\u79c1\u548c\u5b89\u9759\uff0c\u8fd9\u7b14\u989d\u5916\u7684\u82b1\u8d39\u5b8c\u5168\u503c\u5f97\u3002\n\nSpeaker 1 (Female)\nThat's interesting because my experience has been completely the opposite!\n\u8fd9\u8fd8\u633a\u6709\u610f\u601d\u7684\uff0c\u56e0\u4e3a\u6211\u7684\u7ecf\u5386\u5b8c\u5168\u76f8\u53cd\uff01\nI've actually grown to love dormitory living, especially because of the shared kitchen.\n\u6211\u53cd\u800c\u6162\u6162\u7231\u4e0a\u4e86\u5bbf\u820d\u751f\u6d3b\uff0c\u5c24\u5176\u662f\u56e0\u4e3a\u53ef\u4ee5\u5171\u7528\u53a8\u623f\u3002\nCooking has always been my passion, and I've found it's such a wonderful way to connect with people from different cultures.\n\u505a\u996d\u4e00\u76f4\u662f\u6211\u7684\u5174\u8da3\u7231\u597d\uff0c\u800c\u4e14\u6211\u53d1\u73b0\u8fd9\u662f\u548c\u6765\u81ea\u4e0d\u540c\u6587\u5316\u80cc\u666f\u7684\u4eba\u5efa\u7acb\u8054\u7cfb\u7684\u4e00\u79cd\u7279\u522b\u597d\u7684\u65b9\u5f0f\u3002\nJust last week, my French roommate taught me how to make authentic cr\u00eapes, and in return I showed her some traditional dishes from my country.\n\u5c31\u5728\u4e0a\u5468\uff0c\u6211\u7684\u6cd5\u56fd\u5ba4\u53cb\u6559\u6211\u505a\u6b63\u5b97\u7684\u53ef\u4e3d\u997c\uff0c\u800c\u6211\u4e5f\u56de\u6559\u4e86\u5979\u51e0\u9053\u6211\u4eec\u56fd\u5bb6\u7684\u4f20\u7edf\u83dc\u3002\nThose spontaneous cooking sessions often turn into great conversations where we learn so much about each other's backgrounds.\n\u8fd9\u4e9b\u4e34\u65f6\u8d77\u610f\u7684\u505a\u996d\u65f6\u523b\uff0c\u5e38\u5e38\u4f1a\u53d8\u6210\u5f88\u68d2\u7684\u4ea4\u6d41\uff0c\u8ba9\u6211\u4eec\u5f7c\u6b64\u4e86\u89e3\u5bf9\u65b9\u7684\u6210\u957f\u80cc\u666f\u3002\nFor me, that cultural exchange is one of the most valuable parts of university life that I'd miss in private accommodation.\n\u5bf9\u6211\u6765\u8bf4\uff0c\u8fd9\u79cd\u6587\u5316\u4ea4\u6d41\u662f\u5927\u5b66\u751f\u6d3b\u4e2d\u975e\u5e38\u5b9d\u8d35\u7684\u4e00\u90e8\u5206\uff0c\u800c\u4f4f\u5728\u6821\u5916\u7684\u79c1\u4eba\u516c\u5bd3\u91cc\u662f\u5f88\u96be\u4f53\u9a8c\u5230\u7684\u3002\n\nSpeaker 3 (Male)\nI have to agree with staying in university housing, though for slightly different reasons.\n\u6211\u4e5f\u66f4\u503e\u5411\u4e8e\u4f4f\u5728\u5b66\u6821\u5bbf\u820d\uff0c\u4e0d\u8fc7\u539f\u56e0\u7a0d\u5fae\u4e0d\u592a\u4e00\u6837\u3002\nThe convenience factor is unbeatable - my dorm is literally a three-minute walk from all my lecture halls.\n\u4fbf\u5229\u6027\u771f\u7684\u65e0\u53ef\u66ff\u4ee3\u2014\u2014\u6211\u7684\u5bbf\u820d\u79bb\u6240\u6709\u4e0a\u8bfe\u7684\u6559\u5b66\u697c\u8d70\u8def\u53ea\u8981\u4e09\u5206\u949f\u3002\nWhen I have 9am classes, I can wake up at 8:45 and still make it on time! But more importantly, I've found the academic support system invaluable.\n\u6709\u65e9\u4e0a\u4e5d\u70b9\u7684\u8bfe\u65f6\uff0c\u6211\u516b\u70b9\u56db\u5341\u4e94\u8d77\u5e8a\u90fd\u6765\u5f97\u53ca\uff01\u4f46\u66f4\u91cd\u8981\u7684\u662f\uff0c\u6211\u89c9\u5f97\u5b66\u6821\u91cc\u7684\u5b66\u4e60\u652f\u6301\u73af\u5883\u975e\u5e38\u6709\u4ef7\u503c\u3002\nDuring exam periods last semester, we organized nightly study groups in the common room where we could quiz each other and explain difficult concepts.\n\u4e0a\u5b66\u671f\u8003\u8bd5\u671f\u95f4\uff0c\u6211\u4eec\u4f1a\u5728\u516c\u5171\u4f11\u606f\u533a\u6bcf\u665a\u7ec4\u7ec7\u5b66\u4e60\u5c0f\u7ec4\uff0c\u4e92\u76f8\u63d0\u95ee\u3001\u8bb2\u89e3\u96be\u70b9\u3002\nThat collaborative environment really helped boost my grades in ways I don't think would have happened if I was living alone off-campus.\n\u8fd9\u79cd\u5408\u4f5c\u5f0f\u7684\u5b66\u4e60\u6c1b\u56f4\uff0c\u786e\u5b9e\u5728\u63d0\u5347\u6210\u7ee9\u65b9\u9762\u5e2e\u4e86\u6211\u5f88\u5927\u7684\u5fd9\uff0c\u800c\u5982\u679c\u6211\u4e00\u4e2a\u4eba\u4f4f\u5728\u6821\u5916\uff0c\u662f\u5f88\u96be\u6709\u8fd9\u6837\u7684\u6548\u679c\u7684\u3002","answer":"The conversation is about three speakers discussing the accommodation options for the next academic year.\nSpeaker 1 talked about where the other two speakers plan to live next academic year.\nThen, Speaker 2 said he signed a contract for an apartment and loved the quiet peaceful environment, and then discussed that he needed space for study and would get crazy when people shared the kitchen.\nAnd then, Speaker 1 argued she loves dormitory living and sharing a kitchen and loves cooking, and also referred to the fact that she can connect with people from different cultures.\nSpeaker 3 mentioned he likes to stay in university housing, which is near the campus, and also mentioned he can join organized study groups during exam periods.","points":[{"speaker":"Speaker 1 (Female)","points":["where you're planning to live next academic year \u4f60\u4eec\u60f3\u597d\u660e\u5e74\u4f4f\u54ea\u91cc\u4e86\u5417"]},{"speaker":"Speaker 2 (Male)","points":["signed a contract for an apartment \u521a\u7b7e\u4e86\u4e00\u4e2a\u516c\u5bd3","quiet peaceful environment \u6211\u559c\u6b22\u5b89\u9759\u7965\u548c\u7684\u73af\u5883","space for study \u9700\u8981\u53ef\u4ee5\u5b66\u4e60\u7684\u7a7a\u95f4","crazy when people share kitchen \u5f53\u4eba\u4eec\u5171\u4eab\u53a8\u623f\u65f6\uff0c\u573a\u9762\u4f1a\u53d8\u5f97\u5f88\u75af\u72c2"]},{"speaker":"Speaker 1 (Female)","points":["love dormitory living and sharing kitchen \u559c\u6b22\u5b66\u751f\u5bbf\u820d\uff0c\u5c24\u5176\u662f\u5171\u4eab\u53a8\u623f","love cooking \u56e0\u4e3a\u6211\u5f88\u7231\u505a\u996d","connect with people from different cultures \u8ba4\u8bc6\u6765\u81ea\u4e0d\u540c\u6587\u5316\u7684\u4eba"]},{"speaker":"Speaker 3 (Male)","points":["stay in university housing \u6211\u4e5f\u559c\u6b22\u4f4f\u5b66\u6821\u5bbf\u820d","near the campus \u79bb\u5f97\u8fd1","organized study groups during exam periods \u4e34\u8fd1\u8003\u8bd5\uff0c\u53ef\u4ee5\u548c\u5bbf\u820d\u540c\u5b66\u8ba8\u8bba\u548c\u590d\u4e60"]}],"keywords":["environment","apartment","dormitory","organized","planning","academic","contract","peaceful","cultures","kitchen","sharing","cooking","connect","housing","periods","you're","signed","living","groups","during","quiet","space","study","crazy","share","live","next","year","love","stay","near","exam"]},{"qid":"F211020","title":"Reading Before Class \u8bfe\u524d\u9605\u8bfb","source":"\u8424\u706b\u866b\u5b98\u65b9\u5468\u9884\u6d4b \u00b7 \u6781\u9ad8\u9891","tags":["\u6781\u9ad8\u9891"],"kind":"F","audio":"sgd_audio/F211020.mp3","audio_remote":"https://upload.fireflyau.com/pte/SSGD/r/9ad9b6f0955b57987180e407a3b11850.mp3","discussion":"Three students are discussing how to finish reading before class.\n\nUgh, I don't know about you guys, but I think today's lecture was way too hard and I could barely keep up with what the professor was saying.\n\nYeah, I get what you mean. But honestly, I think it gets easier if you go through the reading list first. The professor mentioned those books for a reason. If you read them before class, the lecture will be much easier to follow.\n\nHmm, maybe. But the reading list is so long! I don't even know where to find all these books and articles!\n\nWell, actually, it's pretty easy to find those books on the library website. They usually have all the course readings listed there, organized by week, and you can just search by title. Oh, and most of them have PDF previews, so you can flip through the contents to see which chapters the professor highlighted.\n\nOh, really? I didn't know that. I\u2019ve been wasting time scrolling through random website pages. Most of them don't match what the professor talked about. I should have checked the library first instead of struggling with those.\n\nIt\u2019s totally fine\u2014half the class didn\u2019t realize the library had all this stuff at first. And most importantly, if you get stuck, the librarian is super helpful. Last week, I couldn't find one of the recommended articles, and she showed me exactly how to access it online, using the library\u2018s archive database.\n\nOh that's useful! Thanks for sharing. And with all the reading materials available now, I'm more convinced that reading before class is important. If you read ahead, you're not going to fall behind during the lecture. And trust me, once you've read them, the lecture won't feel half as hard.\n\nYes, now that I know the library\u2019s that easy to use and the reading list actually lines up with the lectures. I'll go to check the library website tomorrow, and maybe talk to the librarian if I get lost.\n\nGood plan. Once you get used to it, finding the readings is pretty quick. I used to spend hours stressing over it, but now I can pull up what I need in 10 minutes. Also you can bookmark the course page so you don\u2018t have to hunt for it every time.","bilingual":"Three students are discussing how to finish reading before class.\n\u4e09\u540d\u5b66\u751f\u6b63\u5728\u8ba8\u8bba\u5982\u4f55\u5728\u4e0a\u8bfe\u524d\u5b8c\u6210\u9605\u8bfb\u4efb\u52a1\u3002\n\nSpeaker1 Male\nUgh, I don't know about you guys, but I think today's lecture was way too hard\n\u5509\uff0c\u6211\u4e0d\u77e5\u9053\u4f60\u4eec\u600e\u4e48\u6837\uff0c\u4f46\u6211\u89c9\u5f97\u4eca\u5929\u7684\u8bb2\u5ea7\u5b9e\u5728\u592a\u96be\u4e86\uff0c\nand I could barely keep up with what the professor was saying.\n\u6211\u51e0\u4e4e\u8ddf\u4e0d\u4e0a\u6559\u6388\u5728\u8bb2\u4ec0\u4e48\u3002\n\nSpeaker2 Female\nYeah, I get what you mean. But honestly, I think it gets easier if you go through the reading list first.\n\u662f\u554a\uff0c\u6211\u61c2\u4f60\u7684\u610f\u601d\uff0c\u4e0d\u8fc7\u8bf4\u5b9e\u8bdd\uff0c\u6211\u89c9\u5f97\u5982\u679c\u4f60\u5148\u628a\u9605\u8bfb\u6e05\u5355\u770b\u4e00\u904d\uff0c\u60c5\u51b5\u4f1a\u597d\u5f88\u591a\u3002\nThe professor mentioned those books for a reason.\n\u6559\u6388\u63a8\u8350\u90a3\u4e9b\u4e66\u662f\u6709\u539f\u56e0\u7684\uff0c\nIf you read them before class, the lecture will be much easier to follow.\n\u5982\u679c\u5728\u4e0a\u8bfe\u524d\u8bfb\u8fc7\uff0c\u8bfe\u5802\u5185\u5bb9\u5c31\u4f1a\u66f4\u5bb9\u6613\u7406\u89e3\u3002\n\nSpeaker1 Male\nHmm, maybe. But the reading list is so long!\n\u55ef\uff0c\u4e5f\u8bb8\u5427\uff0c\u4f46\u9605\u8bfb\u6e05\u5355\u5b9e\u5728\u592a\u957f\u4e86\uff0c\nI don't even know where to find all these books and articles!\n\u6211\u751a\u81f3\u4e0d\u77e5\u9053\u8be5\u53bb\u54ea\u91cc\u627e\u8fd9\u4e9b\u4e66\u548c\u6587\u7ae0\u3002\n\nSpeaker3 Male\nWell, actually, it's pretty easy to find those books on the library website.\n\u5176\u5b9e\uff0c\u5728\u56fe\u4e66\u9986\u7f51\u7ad9\u4e0a\u627e\u8fd9\u4e9b\u8d44\u6599\u975e\u5e38\u5bb9\u6613\uff0c\nThey usually have all the course readings listed there, organized by week, and you can just search by title.\n\u8bfe\u7a0b\u6240\u9700\u7684\u9605\u8bfb\u6750\u6599\u901a\u5e38\u90fd\u4f1a\u5217\u5728\u90a3\u91cc\uff0c\u5e76\u4e14\u6309\u5468\u6574\u7406\u597d\uff0c\u4f60\u53ea\u9700\u8981\u6309\u4e66\u540d\u641c\u7d22\u5c31\u884c\uff0c\nOh, and most of them have PDF previews, so you can flip through the contents to see which chapters the professor highlighted.\n\u800c\u4e14\u5927\u591a\u6570\u8fd8\u6709 PDF \u9884\u89c8\uff0c\u53ef\u4ee5\u5148\u770b\u770b\u76ee\u5f55\uff0c\u4e86\u89e3\u6559\u6388\u91cd\u70b9\u5f3a\u8c03\u4e86\u54ea\u4e9b\u7ae0\u8282\u3002\n\nSpeaker1 Male\nOh, really? I didn't know that.\n\u771f\u7684\u5417\uff1f\u6211\u4e4b\u524d\u5b8c\u5168\u4e0d\u77e5\u9053\uff0c\nI\u2019ve been wasting time scrolling through random website pages.\n\u6211\u4e00\u76f4\u5728\u4e00\u4e9b\u6742\u4e71\u7684\u7f51\u7ad9\u4e0a\u4e71\u7ffb\uff0c\u6d6a\u8d39\u4e86\u5f88\u591a\u65f6\u95f4\uff0c\nMost of them don't match what the professor talked about.\n\u800c\u4e14\u5185\u5bb9\u548c\u6559\u6388\u8bb2\u7684\u6839\u672c\u5bf9\u4e0d\u4e0a\uff0c\nI should have checked the library first instead of struggling with those.\n\u6211\u65e9\u8be5\u5148\u53bb\u67e5\u56fe\u4e66\u9986\u7684\u3002\n\nSpeaker3 Male\nIt\u2019s totally fine\u2014half the class didn\u2019t realize the library had all this stuff at first.\n\u6ca1\u5173\u7cfb\uff0c\u5176\u5b9e\u4e00\u5f00\u59cb\u6709\u4e00\u534a\u7684\u540c\u5b66\u90fd\u4e0d\u77e5\u9053\u56fe\u4e66\u9986\u6709\u8fd9\u4e48\u591a\u8d44\u6e90\uff0c\nAnd most importantly, if you get stuck, the librarian is super helpful.\n\u800c\u4e14\u6700\u91cd\u8981\u7684\u662f\uff0c\u5982\u679c\u4f60\u9047\u5230\u56f0\u96be\uff0c\u56fe\u4e66\u7ba1\u7406\u5458\u771f\u7684\u975e\u5e38\u6709\u5e2e\u52a9\u3002\nLast week, I couldn't find one of the recommended articles,\n\u4e0a\u5468\u6211\u627e\u4e0d\u5230\u4e00\u7bc7\u63a8\u8350\u6587\u7ae0\uff0c\nand she showed me exactly how to access it online, using the library\u2018s archive database.\n\u5979\u5c31\u4e00\u6b65\u6b65\u6559\u6211\u5982\u4f55\u901a\u8fc7\u56fe\u4e66\u9986\u7684\u6570\u636e\u5e93\u5728\u7ebf\u83b7\u53d6\u3002\n\nSpeaker2 Female\nOh that's useful! Thanks for sharing.\n\u90a3\u592a\u6709\u7528\u4e86\uff0c\u8c22\u8c22\u4f60\u5206\u4eab\u3002\nAnd with all the reading materials available now, I'm more convinced that reading before class is important.\n\u73b0\u5728\u9605\u8bfb\u6750\u6599\u8fd9\u4e48\u65b9\u4fbf\uff0c\u6211\u66f4\u786e\u4fe1\u8bfe\u524d\u9605\u8bfb\u771f\u7684\u5f88\u91cd\u8981\uff0c\nIf you read ahead, you're not going to fall behind during the lecture.\n\u5982\u679c\u63d0\u524d\u8bfb\u8fc7\uff0c\u4e0a\u8bfe\u65f6\u5c31\u4e0d\u4f1a\u6389\u961f\uff0c\nAnd trust me, once you've read them, the lecture won't feel half as hard.\n\u76f8\u4fe1\u6211\uff0c\u8bfb\u8fc7\u4e4b\u540e\u8bfe\u5802\u5c31\u4e0d\u4f1a\u89c9\u5f97\u90a3\u4e48\u96be\u4e86\u3002\n\nSpeaker1 Male\nYes, now that I know the library\u2019s that easy to use and the reading list actually lines up with the lectures.\n\u662f\u7684\uff0c\u73b0\u5728\u6211\u77e5\u9053\u56fe\u4e66\u9986\u8fd9\u4e48\u597d\u7528\uff0c\u800c\u4e14\u9605\u8bfb\u6e05\u5355\u548c\u8bfe\u5802\u5185\u5bb9\u662f\u5b8c\u5168\u5bf9\u5e94\u7684\uff0c\nI'll go to check the library website tomorrow, and maybe talk to the librarian if I get lost.\n\u6211\u660e\u5929\u5c31\u53bb\u770b\u770b\u56fe\u4e66\u9986\u7f51\u7ad9\uff0c\u5982\u679c\u627e\u4e0d\u5230\u518d\u53bb\u95ee\u56fe\u4e66\u7ba1\u7406\u5458\u3002\n\nSpeaker3 Male\nGood plan. Once you get used to it, finding the readings is pretty quick.\n\u8fd9\u662f\u4e2a\u597d\u8ba1\u5212\uff0c\u7b49\u4f60\u4e60\u60ef\u4e4b\u540e\uff0c\u627e\u9605\u8bfb\u6750\u6599\u5176\u5b9e\u5f88\u5feb\u3002\nI used to spend hours stressing over it, but now I can pull up what I need in 10 minutes.\n\u6211\u4ee5\u524d\u4e5f\u5e38\u5e38\u4e3a\u6b64\u7126\u8651\u597d\u51e0\u4e2a\u5c0f\u65f6\uff0c\u4f46\u73b0\u5728\u5341\u5206\u949f\u5c31\u80fd\u641e\u5b9a\uff0c\nAlso you can bookmark the course page so you don\u2018t have to hunt for it every time.\n\u800c\u4e14\u4f60\u8fd8\u53ef\u4ee5\u628a\u8bfe\u7a0b\u9875\u9762\u6536\u85cf\u8d77\u6765\uff0c\u8fd9\u6837\u4ee5\u540e\u5c31\u4e0d\u7528\u6bcf\u6b21\u90fd\u91cd\u65b0\u627e\u4e86\u3002","answer":"The conversation is about three speakers discussing reading before class.\nSpeaker 1 mentioned today's lecture was hard, and also mentioned he can barely keep up with what the professor was saying.\nThen, Speaker 2 said it will get easier if you go through the reading list first.\nAnd then, Speaker 1 argued reading list is so long, and he doesn\u2019t know where to find it.\nSpeaker 3 said it\u2019s easy to find on the library website, and they are organized by week, and also mentioned they can search by title and use PDF previews to see which chapters the professor highlighted.\nThen, Speaker 1 said he was wasting time scrolling through random website pages, and then found that these didn't match what the professor talked about, and believed he should have checked the library first.\nAnd then, Speaker 3 argued that the librarian is helpful and helped him find the recommended articles, and also referred to online access and using the library\u2019s archive database.\nSpeaker 2 believed reading before class is important so they won\u2019t fall behind during the lecture or feel hard.\nThen, Speaker 1 said it\u2019s easy to use the library and the reading list lines up with the lectures, and then said he will talk to the librarian if he gets lost.\nAnd then, Speaker 3 argued that finding the readings is quick, and also suggested bookmarking the course page.","points":[{"speaker":"Speaker 1 (Male)","points":["today's lecture was hard \u4eca\u5929\u7684\u8bfe\u5f88\u96be","barely keep up with what the professor was saying \u8ddf\u4e0d\u4e0a\u6559\u6388\u8bf4\u7684\u8bdd"]},{"speaker":"Speaker 2 (Female)","points":["get easier if go through the reading list first \u5982\u679c\u63d0\u524d\u9605\u8bfb\u4f1a\u7b80\u5355\u4e9b"]},{"speaker":"Speaker 1 (Male)","points":["reading list is so long \u9605\u8bfb\u4e66\u5355\u592a\u957f\u4e86","don't know where to find \u4e0d\u77e5\u9053\u53bb\u54ea\u91cc\u627e"]},{"speaker":"Speaker 3 (Male)","points":["easy to find on the library website \u5728\u56fe\u4e66\u9986\u7f51\u7ad9\u4e0a\u80fd\u627e\u5230","organized by week \u4ee5\u5468\u5206\u7c7b","search by title \u901a\u8fc7\u9898\u76ee\u9605\u8bfb","PDF previews PDF \u9884\u89c8","the chapters the professor highlighted \u6559\u6388\u5f3a\u8c03\u4e86\u54ea\u7ae0"]},{"speaker":"Speaker 1 (Male)","points":["wasting time scrolling through random website pages \u5728\u968f\u673a\u641c\u7d20\u7f51\u9875\u4e0a\u6d6a\u8d39\u65f6\u95f4","don't match what the professor talked about \u8ddf\u6559\u6388\u8bb2\u7684\u4e0d\u76f8\u7b26","checked the library first \u5148\u770b\u56fe\u4e66\u9986"]},{"speaker":"Speaker 3 (Male)","points":["librarian is helpful \u56fe\u4e66\u7ba1\u7406\u5458\u5f88\u6709\u5e2e\u52a9","find the recommended articles \u627e\u63a8\u8350\u6587\u7ae0","access it online \u5728\u7ebf\u641c\u7d22","using the library\u2019s archive database \u662f\u7528\u56fe\u4e66\u9986\u5f52\u6863\u6570\u636e\u5e93"]},{"speaker":"Speaker 2 (Female)","points":["reading before class is important \u8bfe\u524d\u9605\u8bfb\u5f88\u91cd\u8981","fall behind during the lecture \u8bfe\u4e0a\u4e0d\u4f1a\u6389\u961f","won't feel hard \u4e0d\u4f1a\u611f\u5230\u96be"]},{"speaker":"Speaker 1 (Male)","points":["easy to use library \u56fe\u4e66\u9986\u5bb9\u6613\u4f7f\u7528","the reading list lines up with the lectures \u4e66\u5355\u548c\u8bfe\u7a0b\u4e00\u81f4","talk to the librarian if I get lost \u627e\u4e0d\u5230\u4e86\u5c31\u95ee\u56fe\u4e66\u7ba1\u7406\u5458"]},{"speaker":"Speaker 3 (Male)","points":["finding the readings is quick \u4e66\u5355\u627e\u8d77\u6765\u5f88\u5feb","bookmark the course page \u628a\u8bfe\u7a0b\u9875\u52a0\u5165\u4e66\u7b7e"]}],"keywords":["highlighted","recommended","organized","scrolling","librarian","important","previews","chapters","articles","database","readings","bookmark","today's","through","reading","library","website","wasting","checked","helpful","archive","finding","barely","easier","search","random","access","online","before","behind","during","don't","title","pages","match","using","won't","lines","quick","hard","keep","list","long","find","easy","week","fall","feel","lost","page","pdf","use"]},{"qid":"F211048","title":"Different Types of Classes\u4e0d\u540c\u7c7b\u578b\u7684\u8bfe\u5802","source":"\u8424\u706b\u866b\u5b98\u65b9\u5468\u9884\u6d4b \u00b7 \u6781\u9ad8\u9891","tags":["\u6781\u9ad8\u9891"],"kind":"F","audio":"sgd_audio/F211048.mp3","audio_remote":"https://upload.fireflyau.com/pte/SSGD/r/3acf7999ab356e06c0317591716f48f2.mp3","discussion":"Three students are discussing different types of classes at university.\n\nThere are no lectures in high school, so coming to university was quite a big change for me. Most of the classes at university are lectures, and sometimes I find them difficult to follow. Some teachers speak very fast, and a few of them have strong accents, which makes it even harder to understand everything they say.\n\nPersonally, I like lectures. One advantage is that teachers usually upload their PowerPoint slides online, so if you miss a lecture or don't catch everything during class, you can always check the slides later. However, I think tutorials have their own advantages as well. The best thing about tutorials is that you can ask questions and have discussions, whereas in a large lecture it is often difficult to ask questions during the class.\n\nI don't really like lectures either. They are simply too long. Sometimes a lecture lasts for an hour, and sometimes even ninety minutes. It can be very difficult to stay focused on one person speaking for such a long period of time. That's why I prefer tutorials. Most of the tutors I've met are very patient, and I've had really positive experiences in those classes.\n\nI agree with that. Tutorials are usually more interactive, and it's much easier to get help when you need it. Even if you don't want to ask questions during the class, you can always stay behind and ask the tutor afterwards. They are usually happy to explain things again or give extra guidance.","bilingual":"Three students are discussing different types of classes at university.\n\u4e09\u540d\u5b66\u751f\u6b63\u5728\u8ba8\u8bba\u5927\u5b66\u91cc\u7684\u4e0d\u540c\u7684\u4e0a\u8bfe\u5f62\u5f0f\u3002\n\nSpeaker 1 (Female)\nThere are no lectures in high school, so coming to university was quite a big change for me. Most of the classes at university are lectures, and sometimes I find them difficult to follow. Some teachers speak very fast, and a few of them have strong accents, which makes it even harder to understand everything they say.\n\u53d1\u8a00\u4eba1\uff08\u5973\uff09\n\u9ad8\u4e2d\u662f\u6ca1\u6709\u8bb2\u5ea7\u8bfe\u7684\uff0c\u6240\u4ee5\u6765\u5230\u5927\u5b66\u5bf9\u6211\u6765\u8bf4\u662f\u4e00\u4e2a\u5f88\u5927\u7684\u53d8\u5316\u3002\u5927\u5b66\u91cc\u5927\u591a\u6570\u8bfe\u7a0b\u90fd\u662f\u8bb2\u5ea7\u8bfe\uff0c\u800c\u6211\u6709\u65f6\u5019\u89c9\u5f97\u5f88\u96be\u8ddf\u4e0a\u3002\u6709\u4e9b\u8001\u5e08\u8bf4\u8bdd\u7279\u522b\u5feb\uff0c\u800c\u4e14\u6709\u4e9b\u8001\u5e08\u53e3\u97f3\u6bd4\u8f83\u91cd\uff0c\u8fd9\u8ba9\u7406\u89e3\u4ed6\u4eec\u8bb2\u7684\u5185\u5bb9\u53d8\u5f97\u66f4\u52a0\u56f0\u96be\u3002\n\nSpeaker 2 (Male)\nPersonally, I like lectures. One advantage is that teachers usually upload their PowerPoint slides online, so if you miss a lecture or don't catch everything during class, you can always check the slides later. However, I think tutorials have their own advantages as well. The best thing about tutorials is that you can ask questions and have discussions, whereas in a large lecture it is often difficult to ask questions during the class.\n\u53d1\u8a00\u4eba2\uff08\u7537\uff09\n\u5c31\u6211\u4e2a\u4eba\u800c\u8a00\uff0c\u6211\u559c\u6b22\u8bb2\u5ea7\u8bfe\u3002\u5b83\u7684\u4e00\u4e2a\u4f18\u70b9\u662f\u8001\u5e08\u901a\u5e38\u4f1a\u628aPPT\u4e0a\u4f20\u5230\u7f51\u4e0a\uff0c\u6240\u4ee5\u5373\u4f7f\u9519\u8fc7\u4e86\u8bfe\u7a0b\uff0c\u6216\u8005\u4e0a\u8bfe\u65f6\u6ca1\u6709\u5b8c\u5168\u542c\u61c2\uff0c\u4e4b\u540e\u4e5f\u53ef\u4ee5\u67e5\u770b\u8bfe\u4ef6\u3002\u4e0d\u8fc7\u6211\u89c9\u5f97\u8f85\u5bfc\u8bfe\u4e5f\u6709\u81ea\u5df1\u7684\u4f18\u52bf\u3002\u8f85\u5bfc\u8bfe\u6700\u5927\u7684\u597d\u5904\u5c31\u662f\u53ef\u4ee5\u63d0\u95ee\u548c\u8ba8\u8bba\uff0c\u800c\u5728\u4eba\u6570\u5f88\u591a\u7684\u8bb2\u5ea7\u8bfe\u4e0a\uff0c\u5f80\u5f80\u5f88\u96be\u5728\u8bfe\u5802\u4e2d\u63d0\u95ee\u3002\n\nSpeaker 3 (Female)\nI don't really like lectures either. They are simply too long. Sometimes a lecture lasts for an hour, and sometimes even ninety minutes. It can be very difficult to stay focused on one person speaking for such a long period of time. That's why I prefer tutorials. Most of the tutors I've met are very patient, and I've had really positive experiences in those classes.\n\u53d1\u8a00\u4eba3\uff08\u5973\uff09\n\u6211\u4e5f\u4e0d\u592a\u559c\u6b22\u8bb2\u5ea7\u8bfe\u3002\u5b83\u4eec\u5b9e\u5728\u592a\u957f\u4e86\u3002\u6709\u65f6\u5019\u4e00\u8282\u8bfe\u8981\u4e0a\u4e00\u4e2a\u5c0f\u65f6\uff0c\u751a\u81f3\u4e5d\u5341\u5206\u949f\u3002\u8981\u957f\u65f6\u95f4\u4e13\u6ce8\u5730\u542c\u4e00\u4e2a\u4eba\u8bb2\u8bdd\uff0c\u5176\u5b9e\u662f\u5f88\u56f0\u96be\u7684\u3002\u6240\u4ee5\u6211\u66f4\u559c\u6b22\u8f85\u5bfc\u8bfe\u3002\u6211\u9047\u5230\u7684\u5927\u591a\u6570\u8f85\u5bfc\u8001\u5e08\u90fd\u975e\u5e38\u6709\u8010\u5fc3\uff0c\u800c\u4e14\u6211\u5728\u8fd9\u4e9b\u8bfe\u7a0b\u4e2d\u7684\u4f53\u9a8c\u4e00\u76f4\u90fd\u5f88\u597d\u3002\n\nSpeaker 1 (Female)\nI agree with that. Tutorials are usually more interactive, and it's much easier to get help when you need it. Even if you don't want to ask questions during the class, you can always stay behind and ask the tutor afterwards. They are usually happy to explain things again or give extra guidance.\n\u53d1\u8a00\u4eba1\uff08\u5973\uff09\n\u6211\u540c\u610f\u8fd9\u4e00\u70b9\u3002\u8f85\u5bfc\u8bfe\u901a\u5e38\u4e92\u52a8\u6027\u66f4\u5f3a\uff0c\u800c\u4e14\u5f53\u4f60\u9700\u8981\u5e2e\u52a9\u7684\u65f6\u5019\u4e5f\u66f4\u5bb9\u6613\u83b7\u5f97\u652f\u6301\u3002\u5373\u4f7f\u4f60\u4e0d\u60f3\u5728\u8bfe\u5802\u4e0a\u63d0\u95ee\uff0c\u4f60\u4e5f\u53ef\u4ee5\u8bfe\u540e\u7559\u4e0b\u6765\u5411\u8f85\u5bfc\u8001\u5e08\u8bf7\u6559\u3002\u4ed6\u4eec\u901a\u5e38\u90fd\u5f88\u4e50\u610f\u518d\u6b21\u89e3\u91ca\u5185\u5bb9\uff0c\u6216\u8005\u63d0\u4f9b\u989d\u5916\u7684\u6307\u5bfc\u3002","answer":"The conversation is about three speakers discussing different types of classes.\nSpeaker 1 mentioned there are no lectures in high school, but most of the classes at university are lectures, and also mentioned some teachers speak very fast and some have strong accents.\nThen, Speaker 2 said the he likes lectures as teachers will upload their PowerPoint slides online, and then discussed that the best thing about tutorials is that you can ask questions in tutorials.\nAnd then, Speaker 3 argued that lectures are too long, so it\u2019s difficult to stay focused on one person speaking, and also said she prefers tutorials and the tutors are very patient.\nSpeaker 1 said you can always stay behind and ask the tutor afterwards in tutorials.","points":[{"speaker":"Speaker 1 (Female)","points":["no lectures in high school \u9ad8\u4e2d\u6ca1\u6709\u8bb2\u5ea7\u8bfe","most of the classes at university are lectures \u5927\u5b66\u91cc\u5927\u591a\u6570\u8bfe\u7a0b\u90fd\u662f\u8bb2\u5ea7\u8bfe","some teachers speak very fast and some have strong accents \u6709\u4e9b\u8001\u5e08\u8bf4\u8bdd\u7279\u522b\u5feb\uff0c\u6709\u4e9b\u53e3\u97f3\u91cd"]},{"speaker":"Speaker 2 (Male)","points":["I like lectures \u6211\u559c\u6b22\u8bb2\u5ea7\u8bfe","upload their PowerPoint slides online \u4e0a\u4f20PPT\u8bfe\u4ef6\u5230\u7f51\u4e0a","ask questions in tutorials \u8f85\u5bfc\u8bfe\u91cc\u53ef\u4ee5\u95ee\u95ee\u9898"]},{"speaker":"Speaker 3 (Female)","points":["lectures are too long \u8bb2\u5ea7\u8bfe\u592a\u957f\u4e86","difficult to stay focused on one person speaking \u5f88\u96be\u4e00\u76f4\u4e13\u6ce8\u5730\u542c\u4e00\u4e2a\u4eba\u8bb2\u8bdd","prefer tutorials \u559c\u6b22\u8f85\u5bfc\u8bfe","the tutors are very patient \u8f85\u5bfc\u8001\u5e08\u5f88\u6709\u8010\u5fc3"]},{"speaker":"Speaker 1 (Female)","points":["stay behind and ask the tutor afterwards \u8bfe\u4e0b\u95ee\u8f85\u5bfc\u8001\u5e08\u95ee\u9898"]}],"keywords":["powerpoint","afterwards","questions","tutorials","difficult","teachers","speaking","accents","focused","patient","strong","upload","slides","online","prefer","tutors","behind","speak","high","fast","long","stay","too"]},{"qid":"F211012","title":"New Lecturer \u65b0\u8001\u5e08","source":"\u8424\u706b\u866b\u5b98\u65b9\u5468\u9884\u6d4b \u00b7 \u6781\u9ad8\u9891","tags":["\u6781\u9ad8\u9891"],"kind":"F","audio":"sgd_audio/F211012.mp3","audio_remote":"https://upload.fireflyau.com/pte/SSGD/r/9a3b5215977f9349c2b9e18405c8642a.mp3","discussion":"Three students are talking about the new lecturer.\n\nSo, what do you guys think about the new lecturer? We\u2019ve had around four classes with him already, and honestly, I really enjoy his teaching style.\n\nYeah, I feel the same way.\n\nTo me, he comes across as really genuine and sincere. When students challenge him or bring up questions he hasn\u2019t thought of, he doesn\u2019t get upset at all\u2014instead, he actually praises the student.\n\nExactly. And his academic background is outstanding. Whenever he responds to questions, he always gives a clear answer, and when students push back or challenge him, he replies in such a patient and professional way.\n\nI agree\u2014he\u2019s definitely the highlight of the year for me. But I have to admit, sometimes I feel a bit intimidated in his classes. I\u2019m the type who likes to take questions away and research them later. Asking on the spot makes me worry that I\u2019ll lose face. Do you think I should try to be more confident?\n\nHonestly, his class is the perfect place to do that. You can both succeed and fail without anyone judging you. We should all try to keep a growth mindset\u2014that\u2019s the only way to really benefit.\n\nTrue. In fact, in his classes I feel like I\u2019m learning not only academically, but also gaining a lot in terms of personal growth and attitude.","bilingual":"Three students are talking about the new lecturer.\n\u4e09\u540d\u5b66\u751f\u6b63\u5728\u8ba8\u8bba\u65b0\u6765\u7684\u8bb2\u5e08\u3002\n\nSpeaker 1 (Female)\nSo, what do you guys think about the new lecturer?\n\u90a3\u4f60\u4eec\u89c9\u5f97\u8fd9\u4f4d\u65b0\u8bb2\u5e08\u600e\u4e48\u6837\uff1f\nWe\u2019ve had around four classes with him already, and honestly, I really enjoy his teaching style.\n\u6211\u4eec\u5df2\u7ecf\u4e0a\u4e86\u4ed6\u5927\u6982\u56db\u8282\u8bfe\u4e86\uff0c\u8bf4\u5b9e\u8bdd\uff0c\u6211\u771f\u7684\u5f88\u559c\u6b22\u4ed6\u7684\u6559\u5b66\u98ce\u683c\u3002\n\nSpeaker 2 (Male)\nYeah, I feel the same way.\n\u662f\u7684\uff0c\u6211\u4e5f\u6709\u540c\u6837\u7684\u611f\u89c9\u3002\n\nSpeaker 1 (Female)\nTo me, he comes across as really genuine and sincere.\n\u5728\u6211\u770b\u6765\uff0c\u4ed6\u7ed9\u4eba\u7684\u611f\u89c9\u975e\u5e38\u771f\u8bda\u3001\u5766\u7387\u3002\nWhen students challenge him or bring up questions he hasn\u2019t thought of, he doesn\u2019t get upset at all\u2014instead, he actually praises the student.\n\u5f53\u5b66\u751f\u8d28\u7591\u4ed6\uff0c\u6216\u8005\u63d0\u51fa\u4e00\u4e9b\u4ed6\u4e4b\u524d\u6ca1\u60f3\u5230\u7684\u95ee\u9898\u65f6\uff0c\u4ed6\u5b8c\u5168\u4e0d\u4f1a\u751f\u6c14\uff0c\u53cd\u800c\u8fd8\u4f1a\u8868\u626c\u5b66\u751f\u3002\n\nSpeaker 2 (Male)\nExactly. And his academic background is outstanding.\n\u6ca1\u9519\u3002\u800c\u4e14\u4ed6\u7684\u5b66\u672f\u80cc\u666f\u975e\u5e38\u51fa\u8272\u3002\nWhenever he responds to questions, he always gives a clear answer,\n\u6bcf\u6b21\u56de\u7b54\u95ee\u9898\u65f6\uff0c\u4ed6\u7684\u89e3\u91ca\u90fd\u5f88\u6e05\u6670\uff0c\nand when students push back or challenge him, he replies in such a patient and professional way.\n\u5373\u4f7f\u5b66\u751f\u7ee7\u7eed\u8ffd\u95ee\u6216\u63d0\u51fa\u4e0d\u540c\u770b\u6cd5\uff0c\u4ed6\u4e5f\u603b\u662f\u975e\u5e38\u8010\u5fc3\u3001\u4e13\u4e1a\u5730\u56de\u5e94\u3002\n\nSpeaker 3 (Female)\nI agree\u2014he\u2019s definitely the highlight of the year for me.\n\u6211\u540c\u610f\u2014\u2014\u5bf9\u6211\u6765\u8bf4\uff0c\u4ed6\u7edd\u5bf9\u662f\u4eca\u5e74\u6700\u5927\u7684\u4eae\u70b9\u3002\nBut I have to admit, sometimes I feel a bit intimidated in his classes.\n\u4e0d\u8fc7\u6211\u5f97\u627f\u8ba4\uff0c\u6709\u65f6\u5019\u5728\u4ed6\u7684\u8bfe\u5802\u4e0a\u6211\u8fd8\u662f\u4f1a\u6709\u70b9\u7d27\u5f20\u3002\nI\u2019m the type who likes to take questions away and research them later.\n\u6211\u6bd4\u8f83\u4e60\u60ef\u628a\u95ee\u9898\u5e26\u56de\u53bb\uff0c\u81ea\u5df1\u518d\u6162\u6162\u7814\u7a76\u3002\nAsking on the spot makes me worry that I\u2019ll lose face.\n\u5f53\u573a\u63d0\u95ee\u4f1a\u8ba9\u6211\u62c5\u5fc3\u81ea\u5df1\u4f1a\u4e0d\u4f1a\u51fa\u4e11\u3002\nDo you think I should try to be more confident?\n\u4f60\u4eec\u89c9\u5f97\u6211\u5e94\u8be5\u8bd5\u7740\u66f4\u81ea\u4fe1\u4e00\u70b9\u5417\uff1f\n\nSpeaker 1 (Female)\nHonestly, his class is the perfect place to do that.\n\u8bf4\u5b9e\u8bdd\uff0c\u4ed6\u7684\u8bfe\u5802\u6b63\u662f\u6700\u9002\u5408\u8fd9\u6837\u5c1d\u8bd5\u7684\u5730\u65b9\u3002\nYou can both succeed and fail without anyone judging you.\n\u5728\u90a3\u91cc\uff0c\u65e0\u8bba\u6210\u529f\u8fd8\u662f\u5931\u8d25\uff0c\u90fd\u4e0d\u4f1a\u6709\u4eba\u8bc4\u5224\u4f60\u3002\nWe should all try to keep a growth mindset\u2014that\u2019s the only way to really benefit.\n\u6211\u4eec\u90fd\u5e94\u8be5\u4fdd\u6301\u6210\u957f\u578b\u601d\u7ef4\uff0c\u8fd9\u6837\u624d\u80fd\u771f\u6b63\u4ece\u8bfe\u5802\u4e2d\u53d7\u76ca\u3002\n\nSpeaker 3 (Female)\nTrue. In fact, in his classes I feel like I\u2019m learning not only academically,\n\u786e\u5b9e\u5982\u6b64\u3002\u4e8b\u5b9e\u4e0a\uff0c\u5728\u4ed6\u7684\u8bfe\u5802\u4e0a\uff0c\u6211\u611f\u89c9\u81ea\u5df1\u4e0d\u4ec5\u5728\u5b66\u672f\u4e0a\u6709\u6240\u6536\u83b7\uff0c\nbut also gaining a lot in terms of personal growth and attitude.\n\u5728\u4e2a\u4eba\u6210\u957f\u548c\u5fc3\u6001\u65b9\u9762\u4e5f\u5b66\u5230\u4e86\u5f88\u591a\u3002","answer":"The conversation is about three speakers discussing the new lecturer.\nSpeaker 1 asked about the new lecturer, and also mentioned they have attended four classes and enjoy his teaching style.\nThen, Speaker 2 said he feels the same way.\nAnd then, Speaker 1 argued the new lecturer is genuine, and also said that when students challenge him or bring up questions, he praises the student.\nSpeaker 2 talked about his outstanding academic background, and also mentioned that he gives clear answers and answers in a patient and professional way.\nThen, Speaker 3 said she feels a bit intimidated in his classes because she likes to take questions away and research them later, and then discussed that she worried about losing face when asking on the spot.\nAnd then, Speaker 1 argued it is the perfect place to do that without anyone judging you, and also said they should keep a growth mindset.\nSpeaker 3 said they can learn not only academically, but also gain a lot.","points":[{"speaker":"Speaker 1 (Female)","points":["new lecturer \u4f60\u4eec\u89c9\u5f97\u6700\u8fd1\u90a3\u4e2a\u65b0\u8bb2\u5e08\u600e\u4e48\u6837\uff1f","four classes\u5df2\u7ecf\u4e0a\u4e86\u4ed6\u5dee\u4e0d\u591a4\u8282\u8bfe","enjoy his teaching style \u633a\u559c\u6b22\u4ed6\u7684\u4e0a\u8bfe\u9632\u98ce\u5404"]},{"speaker":"Speaker 2 (Male)","points":["feel the same way \u6211\u4e5f\u89c9\u5f97"]},{"speaker":"Speaker 1 (Female)","points":["genuine \u6211\u89c9\u5f97\u4ed6\u5f88\u771f\u8bda","students challenge him or bring up questions \u6709\u5b66\u751f\u6311\u6218\u4ed6\u3001\u63d0\u5230\u4ed6\u6ca1\u6709\u60f3\u5230\u7684\u95ee\u9898","praises the student \u4ed6\u4f1a\u8868\u626c\u5b66\u751f"]},{"speaker":"Speaker 2 (Male)","points":["outstanding academic background \u4ed6\u7684\u5b66\u672f\u80fd\u529b\u7279\u522b\u597d","gives a clear answer \u603b\u4f1a\u7528\u6e05\u6670\u5730\u56de\u7b54\u95ee\u9898","answer in a patient and professional way \u4ed6\u56de\u7b54\u5f97\u8010\u5fc3\u4e13\u4e1a"]},{"speaker":"Speaker 3 (Female)","points":["feel a bit intimidated in his classes \u6709\u65f6\u5019\u4e0a\u4ed6\u7684\u8bfe\uff0c\u6211\u4f1a\u6709\u70b9\u88ab\u5413\u5230","take questions away and research them later \u6211\u662f\u90a3\u79cd\u6709\u4e86\u95ee\u9898\u60f3\u8981\u4e4b\u540e\u518d\u67e5\u8d44\u6599\u7684\u4eba","ask on the spot - lose face \u5728\u8bfe\u4e0a\u76f4\u63a5\u95ee\u95ee\u9898\uff0c\u6211\u603b\u6015\u4e22\u8138"]},{"speaker":"Speaker 1 (Female)","points":["the perfect place to do that \u5728\u4ed6\u7684\u8bfe\u4e0a\u6700\u9002\u5408\u505a\u8fd9\u4e2a","without anyone judging you \u800c\u4e0d\u4f1a\u6709\u4eba\u8bc4\u5224\u4f60","keep a growth mindset \u6211\u4eec\u90fd\u5e94\u8be5\u6709\u4e00\u4e2a\u8ffd\u6c42\u6210\u957f\u7684\u601d\u7ef4"]},{"speaker":"Speaker 3 (Female)","points":["learn not only academically \u9664\u4e86\u5b66\u672f\u65b9\u9762\u7684\u5185\u5bb9","gain a lot \u5728\u5176\u4ed6\u65b9\u9762\u4e5f\u6709\u633a\u5927\u6536\u83b7"]}],"keywords":["professional","academically","outstanding","intimidated","background","challenge","questions","lecturer","teaching","academic","research","genuine","praises","patient","perfect","without","judging","mindset","anyone","growth","enjoy","style","bring","gives","clear","later","place","learn","four","feel","away","spot","lose","face","keep","gain","new"]},{"qid":"F211002","title":"Finding a Job After Graduation \u6bd5\u4e1a\u540e\u627e\u5de5\u4f5c","source":"\u8424\u706b\u866b\u5b98\u65b9\u5468\u9884\u6d4b \u00b7 \u6781\u9ad8\u9891","tags":["\u6781\u9ad8\u9891"],"kind":"F","audio":"sgd_audio/F211002.mp3","audio_remote":"https://upload.fireflyau.com/pte/SSGD/r/994121617e58ca651d1bb8e560dc3a15.mp3","discussion":"Three students are talking about finding a job after graduation.\n\nHey guys, have you thought about what you want to do after graduation? I\u2019ve been researching job opportunities, and I\u2019m leaning toward joining a big company. The structured training programs they offer seem really valuable for professional development, not to mention the clear promotion paths. I think starting in a well-established organization could really set the foundation for a successful career.\n\nThat\u2019s interesting! I\u2019ve actually been volunteering at a small charity organization, and I\u2019ve really enjoyed the experience. For me, success isn\u2019t about climbing the corporate ladder or earning a high salary. I find the work meaningful, and the environment is so supportive. I might even consider staying in the non-profit sector after graduation.\n\nWow, you both already have such clear plans! I\u2019m still figuring things out. To be honest, I\u2019m thinking about staying here to pursue a postgraduate degree. I feel like I have time to explore my options, and further study might help me narrow down what I really want to do.\n\nThat\u2019s fair, but it\u2019s still good to start planning early. Maybe you could try out different jobs or internships while you\u2019re studying? That way, you can get a sense of what you enjoy or what you\u2019re good at before committing to a specific path.\n\nI agree! Keeping an open mind and gaining diverse experiences can be really helpful. What you do now doesn\u2019t have to define your future career\u2014it\u2019s more about exploring and learning about yourself. Plus, you might discover unexpected passions along the way.\n\nYou\u2019ve both given me a lot to think about. I think I\u2019ll start doing some research tonight and maybe look into part-time work or internships. Thanks for the advice!","bilingual":"Three students are talking about finding a job after graduation.\n\u4e09\u540d\u5b66\u751f\u6b63\u5728\u8ba8\u8bba\u6bd5\u4e1a\u540e\u627e\u5de5\u4f5c\u7684\u8ba1\u5212\u3002\n\nSpeaker 1 (Male)\nHey guys, have you thought about what you want to do after graduation?\n\u563f\uff0c\u5927\u5bb6\u6709\u6ca1\u6709\u60f3\u8fc7\u6bd5\u4e1a\u4e4b\u540e\u8981\u505a\u4ec0\u4e48\uff1f\nI\u2019ve been researching job opportunities, and I\u2019m leaning toward joining a big company.\n\u6211\u6700\u8fd1\u4e00\u76f4\u5728\u7814\u7a76\u5c31\u4e1a\u673a\u4f1a\uff0c\u611f\u89c9\u81ea\u5df1\u66f4\u503e\u5411\u4e8e\u53bb\u4e00\u5bb6\u5927\u578b\u516c\u53f8\u3002\nThe structured training programs they offer seem really valuable for professional development, not to mention the clear promotion paths.\n\u4ed6\u4eec\u63d0\u4f9b\u7684\u7cfb\u7edf\u5316\u57f9\u8bad\u5bf9\u804c\u4e1a\u53d1\u5c55\u6765\u8bf4\u771f\u7684\u5f88\u6709\u4ef7\u503c\uff0c\u800c\u4e14\u664b\u5347\u8def\u5f84\u4e5f\u5f88\u6e05\u6670\u3002\nI think starting in a well-established organization could really set the foundation for a successful career.\n\u6211\u89c9\u5f97\u5728\u4e00\u5bb6\u6210\u719f\u3001\u7a33\u5b9a\u7684\u673a\u6784\u8d77\u6b65\uff0c\u80fd\u4e3a\u4eca\u540e\u7684\u6210\u529f\u804c\u4e1a\u751f\u6daf\u6253\u4e0b\u5f88\u597d\u7684\u57fa\u7840\u3002\n\nSpeaker 2 (Female)\nThat\u2019s interesting! I\u2019ve actually been volunteering at a small charity organization, and I\u2019ve really enjoyed the experience.\n\u8fd9\u633a\u6709\u610f\u601d\u7684\uff01\u5176\u5b9e\u6211\u4e00\u76f4\u5728\u4e00\u5bb6\u5c0f\u578b\u6148\u5584\u673a\u6784\u505a\u5fd7\u613f\u8005\uff0c\u800c\u4e14\u771f\u7684\u5f88\u4eab\u53d7\u8fd9\u6bb5\u7ecf\u5386\u3002\nFor me, success isn\u2019t about climbing the corporate ladder or earning a high salary.\n\u5bf9\u6211\u6765\u8bf4\uff0c\u6210\u529f\u5e76\u4e0d\u7b49\u540c\u4e8e\u5728\u516c\u53f8\u91cc\u4e0d\u65ad\u664b\u5347\uff0c\u6216\u8005\u62ff\u5230\u5f88\u9ad8\u7684\u85aa\u6c34\u3002\nI find the work meaningful, and the environment is so supportive.\n\u6211\u89c9\u5f97\u8fd9\u4efd\u5de5\u4f5c\u5f88\u6709\u610f\u4e49\uff0c\u800c\u4e14\u5de5\u4f5c\u73af\u5883\u4e5f\u975e\u5e38\u652f\u6301\u5f7c\u6b64\u3002\nI might even consider staying in the non-profit sector after graduation.\n\u6211\u751a\u81f3\u5728\u8003\u8651\u6bd5\u4e1a\u540e\u7ee7\u7eed\u7559\u5728\u975e\u8425\u5229\u9886\u57df\u53d1\u5c55\u3002\n\nSpeaker 3 (Male)\nWow, you both already have such clear plans!\n\u54c7\uff0c\u4f60\u4eec\u4e24\u4e2a\u7684\u8ba1\u5212\u90fd\u5df2\u7ecf\u8fd9\u4e48\u6e05\u695a\u4e86\uff01\nI\u2019m still figuring things out. To be honest, I\u2019m thinking about staying here to pursue a postgraduate degree.\n\u6211\u8fd8\u5728\u6478\u7d22\u4e2d\u3002\u8bf4\u5b9e\u8bdd\uff0c\u6211\u5728\u8003\u8651\u7559\u5728\u8fd9\u91cc\u7ee7\u7eed\u8bfb\u7814\u7a76\u751f\u3002\nI feel like I have time to explore my options, and further study might help me narrow down what I really want to do.\n\u6211\u89c9\u5f97\u81ea\u5df1\u8fd8\u6709\u65f6\u95f4\u53bb\u63a2\u7d22\u4e0d\u540c\u7684\u53ef\u80fd\u6027\uff0c\u800c\u7ee7\u7eed\u6df1\u9020\u6216\u8bb8\u80fd\u5e2e\u6211\u66f4\u660e\u786e\u771f\u6b63\u60f3\u505a\u7684\u4e8b\u60c5\u3002\n\nSpeaker 1 (Male)\nThat\u2019s fair, but it\u2019s still good to start planning early.\n\u8fd9\u4e5f\u5f88\u5408\u7406\uff0c\u4e0d\u8fc7\u65e9\u70b9\u5f00\u59cb\u89c4\u5212\u8fd8\u662f\u6709\u597d\u5904\u7684\u3002\nMaybe you could try out different jobs or internships while you\u2019re studying?\n\u4e5f\u8bb8\u4f60\u53ef\u4ee5\u5728\u5b66\u4e60\u671f\u95f4\u5c1d\u8bd5\u4e0d\u540c\u7684\u5de5\u4f5c\u6216\u5b9e\u4e60\uff1f\nThat way, you can get a sense of what you enjoy or what you\u2019re good at before committing to a specific path.\n\u8fd9\u6837\u5728\u771f\u6b63\u786e\u5b9a\u67d0\u4e00\u6761\u804c\u4e1a\u9053\u8def\u4e4b\u524d\uff0c\u4f60\u5c31\u80fd\u4e86\u89e3\u81ea\u5df1\u559c\u6b22\u4ec0\u4e48\u3001\u64c5\u957f\u4ec0\u4e48\u3002\n\nSpeaker 2 (Female)\nI agree! Keeping an open mind and gaining diverse experiences can be really helpful.\n\u6211\u540c\u610f\uff01\u4fdd\u6301\u5f00\u653e\u7684\u5fc3\u6001\uff0c\u591a\u79ef\u7d2f\u4e0d\u540c\u7684\u7ecf\u5386\u771f\u7684\u5f88\u6709\u5e2e\u52a9\u3002\nWhat you do now doesn\u2019t have to define your future career\u2014it\u2019s more about exploring and learning about yourself.\n\u4f60\u73b0\u5728\u505a\u7684\u4e8b\u60c5\u5e76\u4e0d\u4e00\u5b9a\u4f1a\u51b3\u5b9a\u4f60\u672a\u6765\u7684\u804c\u4e1a\u65b9\u5411\uff0c\u66f4\u91cd\u8981\u7684\u662f\u63a2\u7d22\u81ea\u5df1\u3001\u4e86\u89e3\u81ea\u5df1\u3002\nPlus, you might discover unexpected passions along the way.\n\u800c\u4e14\u5728\u8fd9\u4e2a\u8fc7\u7a0b\u4e2d\uff0c\u4f60\u53ef\u80fd\u4f1a\u53d1\u73b0\u4e00\u4e9b\u610f\u60f3\u4e0d\u5230\u7684\u5174\u8da3\u3002\n\nSpeaker 3 (Male)\nYou\u2019ve both given me a lot to think about.\n\u4f60\u4eec\u4e24\u4e2a\u771f\u7684\u8ba9\u6211\u60f3\u4e86\u5f88\u591a\u3002\nI think I\u2019ll start doing some research tonight and maybe look into part-time work or internships. Thanks for the advice!\n\u6211\u89c9\u5f97\u4eca\u665a\u5c31\u5f00\u59cb\u505a\u4e9b\u8c03\u67e5\uff0c\u770b\u770b\u6709\u6ca1\u6709\u5408\u9002\u7684\u517c\u804c\u6216\u8005\u5b9e\u4e60\u673a\u4f1a\u3002\u8c22\u8c22\u4f60\u4eec\u7684\u5efa\u8bae\uff01","answer":"The conversation is about three speakers discussing finding a job after graduation.\nSpeaker 1 talked about what to do after graduation and suggested going to a big company, and also mentioned that big companies can provide training and clear promotion paths.\nThen, Speaker 2 said volunteering at a small charity organization\u00a0is an option, and then discussed that she is not into that kind of success or high pay.\nAnd then, Speaker 3 argued he wanted to pursue a postgraduate degree, so he could have time to explore his options.\nSpeaker 1 said it is good to start planning early, and also mentioned they can try out different jobs or internships.\nThen, Speaker 2 said they can gain diverse experiences with an open mind, and then discussed that they don\u2019t have to define their future career.\nAnd then, Speaker 3 argued he would start doing some research tonight.","points":[{"speaker":"style=\"height: 60px;\"> Speaker 1 (Male)","points":["what to do after graduation \u4f60\u4eec\u60f3\u8fc7\u6bd5\u4e1a\u540e\u627e\u5de5\u4f5c\u7684\u4e8b\u5417\uff1f","big company \u53bb\u5927\u516c\u53f8","provide training \u56e0\u4e3a\u53ef\u4ee5\u63d0\u4f9b\u57f9\u8bad","clear promotion paths \u8fd8\u6709\u660e\u786e\u7684\u664b\u5347\u673a\u4f1a"]},{"speaker":"style=\"height: 30px;\"> Speaker 2 (Female)","points":["volunteering at a small charity organization \u6211\u6b63\u5728\u4e00\u4e2a\u5c0f\u578b\u6148\u5584\u673a\u6784\u505a\u5fd7\u613f\u8005","not into that kind of success or high pay \u6211\u4e0d\u592a\u8ffd\u6c42\u90a3\u79cd\u6210\u529f\u6216\u8005\u5f88\u9ad8\u7684\u85aa\u6c34"]},{"speaker":"style=\"height: 45px;\"> Speaker 3 (Male)","points":["pursue a postgraduate degree \u5148\u8bfb\u4e2a\u7814","have time to explore my options \u6709\u65f6\u95f4\u601d\u8003"]},{"speaker":"style=\"height: 60px;\"> Speaker 1 (Male)","points":["good to start planning early \u5e94\u8be5\u5148\u8ba1\u5212\u8d77\u6765\u4e86","try out different jobs or internships \u5c1d\u8bd5\u4e00\u4e9b\u4e0d\u540c\u7684\u5de5\u4f5c"]},{"speaker":"style=\"height: 30px;\"> Speaker 2 (Female)","points":["gain diverse experiences with an open mind \u6709\u4e2a\u5f00\u653e\u5fc3\u6001\u83b7\u53d6\u5404\u79cd\u7ecf\u9a8c","doesn\u2019t have to define your future career \u73b0\u5728\u505a\u7684\u672a\u5fc5\u662f\u672a\u6765\u771f\u6b63\u8981\u505a\u7684"]},{"speaker":"style=\"height: 30px;\"> Speaker 3 (Male)","points":["start doing some research tonight \u4eca\u5929\u56de\u53bb\u5c31\u5f00\u59cb\u505a\u4e00\u4e0b\u8c03\u7814"]}],"keywords":["volunteering","organization","postgraduate","internships","experiences","graduation","promotion","training","planning","research","company","provide","charity","success","explore","options","diverse","tonight","pursue","degree","define","future","career","after","clear","paths","small","start","early","doesn","high","good","jobs","gain","open","mind","big","pay","try"]},{"qid":"F211027","title":"Large Group Lectures \u5927\u73ed\u8bfe","source":"\u8424\u706b\u866b\u5b98\u65b9\u5468\u9884\u6d4b \u00b7 \u6781\u9ad8\u9891","tags":["\u6781\u9ad8\u9891"],"kind":"F","audio":"sgd_audio/F211027.mp3","audio_remote":"https://upload.fireflyau.com/pte/SSGD/r/2f08fe0bf4002f0cfaee272dd1b3db68.mp3","discussion":"Three students are having a group discussion about large group lectures.\n\nLily, you didn\u2019t attend the large group lecture this morning, right? The professor was really unhappy about that. You were supposed to sign the attendance sheet\u2014it\u2019s an important part of our course assessment. Later, the teacher will email you and ask you to clarify this matter.\n\nOh, I know. But honestly, I just can\u2019t stand those large group lectures. They are so boring! The professor just reads notes the whole time, and I can do that at home by myself. I can read the course notes, watch the recorded video of the lecture, and even review the key points more efficiently without sitting in the crowded classroom. To be honest, I prefer group discussions and seminars much more. They are way more interesting and interactive. We can share our ideas, ask questions, and learn from each other, which is much more helpful than just listening to someone read notes.\n\nI get what you mean\u2014large lectures can be tedious sometimes. But even so, you still need to attend them. When we all go to the lecture, we learn the same content at the same time. After that, we can discuss the same questions with our course mates, clarify our doubts together, and make sure we all understand the key knowledge points correctly. It\u2019s hard to do that if we all study separately at home.\n\nExactly! Besides, in this digital age, we already have very little face-to-face interaction with people. Most of our communication is online\u2014chatting through messages or having online meetings. The large group lecture is a good chance for us to meet our course mates and professor face to face, which helps us build better relationships with them.\n\nHmm, I never thought about the physical reaction part before. But I still think the lectures could be more engaging. Maybe if the professor added more discussions instead of just reading notes, more students would be willing to attend.\n\nI totally get you. I prefer seminars to lectures as well. But from the school\u2019s perspective, it\u2019s much cheaper to have one professor teach 100 students in a large group lecture than to have the same professor teach only 10 students in a small class. That\u2019s probably why the school arranges so many large group lectures\u2014it\u2019s a cost-effective way to deliver the course content to all students.","bilingual":"Three students are having a group discussion about large group lectures.\n\u4e09\u540d\u5b66\u751f\u6b63\u5728\u5c31\u5927\u578b\u56e2\u4f53\u8bb2\u5ea7\u5c55\u5f00\u5c0f\u7ec4\u8ba8\u8bba\n\nSpeaker 1 (Male)\nLily, you didn\u2019t attend the large group lecture this morning, right?\n\u8389\u8389\uff0c\u4f60\u4eca\u5929\u65e9\u4e0a\u6ca1\u53bb\u4e0a\u5927\u8bfe\uff0c\u5bf9\u5427\uff1f\nThe professor was really unhappy about that.\n\u6559\u6388\u5bf9\u6b64\u5f88\u4e0d\u9ad8\u5174\u3002\nYou were supposed to sign the attendance sheet\u2014it\u2019s an important part of our course assessment.\n\u4f60\u672c\u5e94\u8be5\u7b7e\u5230\u7684\u2014\u2014\u7b7e\u5230\u662f\u6211\u4eec\u8bfe\u7a0b\u8003\u6838\u7684\u91cd\u8981\u90e8\u5206\u3002\nLater, the teacher will email you and ask you to clarify this matter.\n\u4e4b\u540e\uff0c\u8001\u5e08\u4f1a\u901a\u8fc7\u7535\u5b50\u90ae\u4ef6\u8054\u7cfb\u60a8\uff0c\u5e76\u8bf7\u4f60\u6f84\u6e05\u6b64\u4e8b\u3002\n\nSpeaker 2 (Female)\nOh, I know. But honestly, I just can\u2019t stand those large group lectures. They are so boring!\n\u54e6\uff0c\u6211\u77e5\u9053\u3002\u4f46\u8bf4\u5b9e\u8bdd\uff0c\u6211\u5b9e\u5728\u53d7\u4e0d\u4e86\u8fd9\u79cd\u5927\u8bfe\uff0c\u592a\u65e0\u804a\u4e86\uff01\nThe professor just reads notes the whole time, and I can do that at home by myself.\n\u6559\u6388\u5168\u7a0b\u90fd\u5728\u8bfb\u8bb2\u4e49\uff0c\u8fd9\u4e9b\u6211\u81ea\u5df1\u5728\u5bb6\u4e5f\u80fd\u505a\u3002\nI can read the course notes, watch the recorded video of the lecture, and even review the key points more efficiently without sitting in the crowded classroom.\n\u6211\u53ef\u4ee5\u770b\u8bfe\u7a0b\u7b14\u8bb0\u3001\u542c\u8bfe\u7a0b\u5f55\u64ad\uff0c\u751a\u81f3\u4e0d\u7528\u5750\u5728\u62e5\u6324\u7684\u6559\u5ba4\u91cc\uff0c\u590d\u4e60\u91cd\u70b9\u6548\u7387\u8fd8\u66f4\u9ad8\u3002\nTo be honest, I prefer group discussions and seminars much more. They are way more interesting and interactive.\n\u8001\u5b9e\u8bf4\uff0c\u6211\u66f4\u559c\u6b22\u5c0f\u7ec4\u8ba8\u8bba\u548c\u7814\u8ba8\u8bfe\uff0c\u6709\u8da3\u591a\u4e86\uff0c\u4e92\u52a8\u6027\u4e5f\u66f4\u5f3a\u3002\nWe can share our ideas, ask questions, and learn from each other, which is much more helpful than just listening to someone read notes.\n\u6211\u4eec\u53ef\u4ee5\u5206\u4eab\u60f3\u6cd5\u3001\u63d0\u95ee\u3001\u4e92\u76f8\u5b66\u4e60\uff0c\u8fd9\u6bd4\u5149\u542c\u522b\u4eba\u5ff5\u7b14\u8bb0\u6709\u7528\u5f97\u591a\u3002\n\nSpeaker 1 (Male)\nI get what you mean\u2014large lectures can be tedious sometimes.\n\u6211\u61c2\u4f60\u7684\u610f\u601d\u2014\u2014\u5927\u8bfe\u6709\u65f6\u5019\u786e\u5b9e\u5f88\u67af\u71e5\u3002\nBut even so, you still need to attend them.\n\u4f46\u5373\u4fbf\u5982\u6b64\uff0c\u4f60\u8fd8\u662f\u5f97\u53bb\u4e0a\u3002\nWhen we all go to the lecture, we learn the same content at the same time.\n\u5927\u5bb6\u4e00\u8d77\u53bb\u542c\u8bfe\uff0c\u624d\u80fd\u5728\u540c\u4e00\u65f6\u95f4\u5b66\u5230\u76f8\u540c\u7684\u5185\u5bb9\u3002\nAfter that, we can discuss the same questions with our course mates, clarify our doubts together, and make sure we all understand the key knowledge points correctly.\n\u4e4b\u540e\u6211\u4eec\u624d\u80fd\u548c\u540c\u5b66\u8ba8\u8bba\u540c\u6837\u7684\u95ee\u9898\uff0c\u4e00\u8d77\u7406\u6e05\u7591\u70b9\uff0c\u786e\u4fdd\u6bcf\u4e2a\u4eba\u90fd\u6b63\u786e\u7406\u89e3\u91cd\u70b9\u77e5\u8bc6\u3002\nIt\u2019s hard to do that if we all study separately at home.\n\u5982\u679c\u90fd\u5404\u81ea\u5728\u5bb6\u5b66\u4e60\uff0c\u5c31\u5f88\u96be\u505a\u5230\u8fd9\u4e00\u70b9\u4e86\u3002\n\nSpeaker 3 (Male)\nExactly! Besides, in this digital age, we already have very little face-to-face interaction with people.\n\u592a\u5bf9\u4e86\uff01\u800c\u4e14\u5728\u8fd9\u4e2a\u6570\u5b57\u65f6\u4ee3\uff0c\u6211\u4eec\u4eba\u4e0e\u4eba\u4e4b\u95f4\u7684\u9762\u5bf9\u9762\u4e92\u52a8\u5df2\u7ecf\u5c11\u5f97\u53ef\u601c\u4e86\u3002\nMost of our communication is online\u2014chatting through messages or having online meetings.\n\u6211\u4eec\u5927\u90e8\u5206\u4ea4\u6d41\u90fd\u662f\u5728\u7ebf\u4e0a\u2014\u2014\u53d1\u6d88\u606f\u804a\u5929\u3001\u5f00\u7ebf\u4e0a\u4f1a\u8bae\u3002\nThe large group lecture is a good chance for us to meet our course mates and professor face to face, which helps us build better relationships with them.\n\u5927\u8bfe\u6b63\u597d\u7ed9\u4e86\u6211\u4eec\u548c\u540c\u5b66\u3001\u6559\u6388\u9762\u5bf9\u9762\u4ea4\u6d41\u7684\u597d\u673a\u4f1a\uff0c\u6709\u52a9\u4e8e\u548c\u4ed6\u4eec\u5efa\u7acb\u66f4\u597d\u7684\u5173\u7cfb\u3002\n\nSpeaker 2 (Female)\nHmm, I never thought about the physical reaction part before.\n\u55ef\uff0c\u6211\u4ee5\u524d\u4ece\u6765\u6ca1\u60f3\u8fc7\u9762\u5bf9\u9762\u4e92\u52a8\u8fd9\u65b9\u9762\u3002\nBut I still think the lectures could be more engaging.\n\u4f46\u6211\u8fd8\u662f\u89c9\u5f97\u8bfe\u5802\u53ef\u4ee5\u66f4\u6709\u8da3\u3001\u66f4\u6709\u5438\u5f15\u529b\u4e00\u4e9b\u3002\nMaybe if the professor added more discussions instead of just reading notes, more students would be willing to attend.\n\u5982\u679c\u6559\u6388\u80fd\u591a\u5b89\u6392\u4e00\u4e9b\u8ba8\u8bba\uff0c\u800c\u4e0d\u53ea\u662f\u5ff5\u8bb2\u4e49\uff0c\u6216\u8bb8\u4f1a\u6709\u66f4\u591a\u5b66\u751f\u613f\u610f\u6765\u4e0a\u8bfe\u3002\n\nSpeaker 3 (Male)\nI totally get you. I prefer seminars to lectures as well.\n\u6211\u5b8c\u5168\u61c2\u4f60\u3002\u6211\u4e5f\u66f4\u559c\u6b22\u7814\u8ba8\u4f1a\uff0c\u800c\u4e0d\u662f\u5927\u8bfe\u3002\nBut from the school\u2019s perspective, it\u2019s much cheaper to have one professor teach 100 students in a large group lecture than to have the same professor teach only 10 students in a small class.\n\u4f46\u4ece\u5b66\u6821\u7684\u89d2\u5ea6\u6765\u770b\uff0c\u8ba9\u4e00\u4f4d\u6559\u6388\u7ed9100\u4e2a\u5b66\u751f\u4e0a\u5927\u8bfe\uff0c\u80af\u5b9a\u6bd4\u8ba9\u540c\u4e00\u4f4d\u6559\u6388\u53ea\u7ed910\u4e2a\u5b66\u751f\u4e0a\u5c0f\u73ed\u8bfe\u6210\u672c\u4f4e\u5f97\u591a\u3002\nThat\u2019s probably why the school arranges so many large group lectures\u2014it\u2019s a cost-effective way to deliver the course content to all students.\n\u5b66\u6821\u4e4b\u6240\u4ee5\u5b89\u6392\u8fd9\u4e48\u591a\u5927\u8bfe\uff0c\u539f\u56e0\u53ef\u80fd\u5c31\u5728\u8fd9\u91cc\u2014\u2014\u8fd9\u662f\u4e00\u79cd\u9ad8\u6027\u4ef7\u6bd4\u7684\u65b9\u5f0f\uff0c\u53ef\u4ee5\u628a\u8bfe\u7a0b\u5185\u5bb9\u7edf\u4e00\u6559\u7ed9\u6240\u6709\u5b66\u751f\u3002","answer":"The conversation is about three speakers discussing large group lectures.\nSpeaker 1 mentioned Lily didn\u2019t attend the large group lecture and the professor was really unhappy, and also mentioned she should sign the attendance sheet.\nThen, Speaker 2 said the lecture is boring, and the professor just reads notes the whole time, and then discussed that she can do that at home by myself, watch the recorded video and review the key points efficiently, and she said she prefers group discussions and seminars, which are interesting and interactive.\nAnd then, Speaker 1 argued they still need to attend large lectures, and also believed they can learn the same content and discuss the same questions with their course mates.\nSpeaker 3 believed there is little face-to-face interaction in this digital age, so the lecture is a good chance to meet our course mates and professor face to face, and also mentioned that they can build better relationships.\nThen, Speaker 2 said that if the professor added more discussions, more students would be willing to attend.\nAnd then, Speaker 3 argued he prefers seminars to lectures, and also said from the school\u2019s perspective, it\u2019s much cheaper, and group lectures are cost-effective.","points":[{"speaker":"Speaker 1 (Male)","points":["didn\u2019t attend the large group lecture \u4eca\u5929\u65e9\u4e0a\u6ca1\u53bb\u4e0a\u5927\u8bfe","the professor was really unhappy \u6559\u6388\u5bf9\u6b64\u5f88\u4e0d\u9ad8\u5174","sign the attendance sheet \u5e94\u5f53\u7b7e\u5230"]},{"speaker":"Speaker 2 (Lily Female)","points":["boring and just reads notes the whole time \u592a\u65e0\u804a\u4e86\u5e76\u4e14\u5168\u7a0b\u90fd\u5728\u8bfb\u8bb2\u4e49","do that at home by myself \u81ea\u5df1\u5728\u5bb6\u4e5f\u80fd\u505a","watch the recorded video and review the key points efficiently \u542c\u5f55\u64ad\u5e76\u6709\u6548\u590d\u4e60\u91cd\u70b9","prefer group discussions and seminars \u66f4\u559c\u6b22\u5c0f\u7ec4\u8ba8\u8bba\u548c\u7814\u8ba8\u8bfe"]},{"speaker":"Speaker 1 (Male)","points":["still need to attend large lectures \u8fd8\u662f\u5f97\u53bb\u4e0a\u5927\u8bfe","learn the same content \u5b66\u5230\u76f8\u540c\u7684\u5185\u5bb9","discuss the same questions with our course mates \u548c\u540c\u5b66\u8ba8\u8bba\u540c\u6837\u7684\u95ee\u9898"]},{"speaker":"Speaker 3 (Male)","points":["little face-to-face interaction in this digital age \u5728\u6570\u5b57\u65f6\u4ee3\uff0c\u4eba\u4e0e\u4eba\u5f88\u5c11\u6709\u9762\u5bf9\u9762\u7684\u4e92\u52a8","build better relationships \u5efa\u7acb\u66f4\u597d\u7684\u5173\u7cfb"]},{"speaker":"Speaker 2 (Lily Female)","points":["professor added more discussions \u6559\u6388\u591a\u5b89\u6392\u4e00\u4e9b\u8ba8\u8bba","more students would be willing to attend \u66f4\u591a\u5b66\u751f\u613f\u610f\u6765\u4e0a\u8bfe"]},{"speaker":"Speaker 3 (Male)","points":["prefer seminars to lectures \u66f4\u559c\u6b22\u7814\u8ba8\u4f1a\u800c\u4e0d\u662f\u5927\u8bfe","from the school\u2019s perspective, it\u2019s much cheaper \u4ece\u5b66\u6821\u7684\u89d2\u5ea6\u6765\u770b\uff0c\u8fd9\u6837\u6210\u672c\u4f4e\u5f97\u591a","group lectures are cost-effective \u5927\u8bfe\u7684\u6027\u4ef7\u6bd4\u9ad8"]}],"keywords":["relationships","efficiently","discussions","interaction","perspective","attendance","questions","effective","recorded","seminars","unhappy","content","discuss","digital","willing","cheaper","attend","boring","myself","review","points","prefer","little","better","large","sheet","reads","notes","whole","watch","video","learn","mates","build","added","didn","sign","home","face","cost","key","age"]},{"qid":"F211018","title":"Prepare for Final Exams \u51c6\u5907\u671f\u672b\u8003\u8bd5","source":"\u8424\u706b\u866b\u5b98\u65b9\u5468\u9884\u6d4b \u00b7 \u6781\u9ad8\u9891","tags":["\u6781\u9ad8\u9891"],"kind":"F","audio":"sgd_audio/F211018.mp3","audio_remote":"https://upload.fireflyau.com/pte/SSGD/r/ede09fb0b1eda8f9c9bac0799b1e20c7.mp3","discussion":"Three students are discussing preparing for final exams at university.\n\nOh man, I'm already feeling the pressure for finals. It feels like there's just so much to cover and, like, so little time. I'm trying to figure out the best way to deal with everything, especially for that quantitative methods exam. I really need to ace that one.\n\nI know exactly what you mean, Will. I've started making detailed study schedules, blocking out specific times for each subject. For quantitative methods, I've found that doing past papers with a timer on really helps make the concepts stick. It's tough, but it helps you see your weak spots quickly.\n\nThat's a good strategy, Lily, but sometimes I find past papers just stress me out more if I'm not confident with the material first. I've been focusing more on active recall and spaced repetition, especially for my history courses. It's basically like quizzing yourself all the time, and then going back to topics after longer and longer periods. It feels like it helps more with remembering things.\n\nActive recall is definitely effective for theoretical subjects. I should try using that more for my literature class. But for math, nothing beats just grinding through problems. Also, don't forget to, like, schedule in breaks. It's so easy to burn out if you're just studying non-stop. I try to do 50 minutes on, 10 minutes off.\n\nYeah, breaks are super important. I've also been thinking about starting a study group for the economics module. Sometimes explaining concepts to someone else helps me understand them better, and they can catch things I've missed. Plus, it breaks up the boringness of studying alone, which can get really isolating.\n\nStudy groups can be, like, tricky, though. I've been in groups where we spent more time chatting than actually studying, or someone just wants answers handed to them. You have to be really strict with yourselves about it. I prefer studying alone and then just checking in with friends for specific questions.\n\nThat's true, you need the right people and, like, a clear plan. We'd definitely need to set some rules, like focusing on specific chapters or problem sets. I think the key is to use it for reviewing difficult topics or quizzing each other, not for initial learning. It's also about keeping each other on track.\n\nBeyond all the study techniques, I think it's just as important to look after yourself. I know it sounds a bit old-fashioned to say, but getting enough sleep and eating properly makes a huge difference in how much information you can actually remember. Pulling all-nighters just isn't good for the long term; you end up forgetting everything the next day anyway.\n\nTotally agree, Lily. I made that mistake in my first year and really regretted it. Now, I make sure to shut down my laptop an hour before bed and do something relaxing, like reading. It helps clear my head. It's all about finding that balance between studying really hard and not burning out completely.","bilingual":"Three students are discussing preparing for final exams at university.\n\u4e09\u540d\u5b66\u751f\u6b63\u5728\u8ba8\u8bba\u5927\u5b66\u671f\u672b\u8003\u8bd5\u7684\u5907\u8003\u60c5\u51b5\u3002\n\nSpeaker1(Will)\nOh man, I'm already feeling the pressure for finals.\n\u5929\u54ea\uff0c\u6211\u5df2\u7ecf\u5f00\u59cb\u611f\u53d7\u5230\u671f\u672b\u8003\u8bd5\u7684\u538b\u529b\u4e86\u3002\nIt feels like there's just so much to cover and, like, so little time.\n\u611f\u89c9\u8981\u590d\u4e60\u7684\u5185\u5bb9\u5b9e\u5728\u592a\u591a\uff0c\u53ef\u65f6\u95f4\u5374\u8fd9\u4e48\u5c11\u3002\nI'm trying to figure out the best way to deal with everything, especially for that quantitative methods exam. I really need to ace that one.\n\u6211\u4e00\u76f4\u5728\u60f3\u8be5\u600e\u4e48\u5e94\u4ed8\u8fd9\u4e00\u5207\uff0c\u5c24\u5176\u662f\u90a3\u95e8\u5b9a\u91cf\u65b9\u6cd5\u8003\u8bd5\uff0c\u6211\u771f\u7684\u5fc5\u987b\u8003\u597d\u3002\n\nSpeaker2(Lily)\nI know exactly what you mean, Will.\n\u6211\u5b8c\u5168\u61c2\u4f60\u7684\u611f\u53d7\uff0cWill\u3002\nI've started making detailed study schedules, blocking out specific times for each subject.\n\u6211\u5df2\u7ecf\u5f00\u59cb\u5236\u5b9a\u8be6\u7ec6\u7684\u5b66\u4e60\u8ba1\u5212\uff0c\u628a\u6bcf\u95e8\u8bfe\u7684\u5b66\u4e60\u65f6\u95f4\u90fd\u5b89\u6392\u5f97\u5f88\u5177\u4f53\u3002\nFor quantitative methods, I've found that doing past papers with a timer on really helps make the concepts stick.\n\u81f3\u4e8e\u5b9a\u91cf\u65b9\u6cd5\uff0c\u6211\u53d1\u73b0\u9650\u65f6\u505a\u5386\u5e74\u771f\u9898\u771f\u7684\u5f88\u6709\u7528\uff0c\u80fd\u8ba9\u6982\u5ff5\u8bb0\u5f97\u66f4\u7262\u3002\nIt's tough, but it helps you see your weak spots quickly.\n\u867d\u7136\u633a\u7d2f\u7684\uff0c\u4f46\u80fd\u5f88\u5feb\u770b\u51fa\u81ea\u5df1\u7684\u8584\u5f31\u70b9\u3002\n\nSpeaker3(Male)\nThat's a good strategy, Lily, but sometimes I find past papers just stress me out more if I'm not confident with the material first.\n\u8fd9\u4e2a\u65b9\u6cd5\u4e0d\u9519\uff0cLily\uff0c\u4e0d\u8fc7\u6709\u65f6\u5019\u5982\u679c\u6211\u5bf9\u77e5\u8bc6\u70b9\u8fd8\u4e0d\u591f\u719f\uff0c\u505a\u771f\u9898\u53cd\u800c\u4f1a\u8ba9\u6211\u66f4\u7126\u8651\u3002\nI've been focusing more on active recall and spaced repetition, especially for my history courses.\n\u6211\u6700\u8fd1\u66f4\u591a\u662f\u5728\u7528\u4e3b\u52a8\u56de\u5fc6\u548c\u95f4\u9694\u590d\u4e60\uff0c\u5c24\u5176\u662f\u5386\u53f2\u8bfe\u3002\nIt's basically like quizzing yourself all the time, and then going back to topics after longer and longer periods.\n\u57fa\u672c\u4e0a\u5c31\u662f\u4e0d\u65ad\u7ed9\u81ea\u5df1\u51fa\u9898\u6d4b\u8bd5\uff0c\u7136\u540e\u9694\u7740\u8d8a\u6765\u8d8a\u957f\u7684\u65f6\u95f4\u518d\u56de\u987e\u8fd9\u4e9b\u5185\u5bb9\u3002\nIt feels like it helps more with remembering things.\n\u6211\u611f\u89c9\u8fd9\u6837\u5bf9\u8bb0\u5fc6\u5e2e\u52a9\u66f4\u5927\u3002\n\nSpeaker2(Lily)\nActive recall is definitely effective for theoretical subjects.\n\u4e3b\u52a8\u56de\u5fc6\u786e\u5b9e\u5f88\u9002\u5408\u7406\u8bba\u6027\u6bd4\u8f83\u5f3a\u7684\u79d1\u76ee\u3002\nI should try using that more for my literature class.\n\u6211\u4e5f\u8be5\u5728\u6587\u5b66\u8bfe\u4e0a\u591a\u8bd5\u8bd5\u3002\nBut for math, nothing beats just grinding through problems.\n\u4e0d\u8fc7\u6570\u5b66\u7684\u8bdd\uff0c\u8fd8\u662f\u5f97\u9760\u5927\u91cf\u5237\u9898\u3002\nAlso, don't forget to, like, schedule in breaks.\n\u53e6\u5916\uff0c\u522b\u5fd8\u4e86\u5b89\u6392\u4f11\u606f\u65f6\u95f4\u3002\nIt's so easy to burn out if you're just studying non-stop.\n\u4e00\u76f4\u4e0d\u95f4\u65ad\u5730\u5b66\u4e60\u5f88\u5bb9\u6613\u628a\u81ea\u5df1\u641e\u57ae\u3002\nI try to do 50 minutes on, 10 minutes off.\n\u6211\u4e00\u822c\u662f\u5b6650\u5206\u949f\uff0c\u4f11\u606f10\u5206\u949f\u3002\n\nSpeaker1(Will)\nYeah, breaks are super important.\n\u662f\u554a\uff0c\u4f11\u606f\u771f\u7684\u5f88\u91cd\u8981\u3002\nI've also been thinking about starting a study group for the economics module.\n\u6211\u8fd8\u5728\u8003\u8651\u4e3a\u7ecf\u6d4e\u5b66\u8fd9\u95e8\u8bfe\u7ec4\u4e00\u4e2a\u5b66\u4e60\u5c0f\u7ec4\u3002\nSometimes explaining concepts to someone else helps me understand them better, and they can catch things I've missed.\n\u6709\u65f6\u5019\u628a\u6982\u5ff5\u8bb2\u7ed9\u522b\u4eba\u542c\uff0c\u53cd\u800c\u80fd\u8ba9\u6211\u7406\u89e3\u5f97\u66f4\u900f\u5f7b\uff0c\u800c\u4e14\u522b\u4eba\u4e5f\u80fd\u53d1\u73b0\u6211\u5ffd\u7565\u7684\u5730\u65b9\u3002\nPlus, it breaks up the boringness of studying alone, which can get really isolating.\n\u518d\u8bf4\uff0c\u4e00\u76f4\u4e00\u4e2a\u4eba\u5b66\u4e60\u771f\u7684\u5f88\u65e0\u804a\uff0c\u4e5f\u633a\u8ba9\u4eba\u611f\u5230\u5b64\u7acb\u7684\u3002\n\nSpeaker3(Male)\nStudy groups can be, like, tricky, though.\n\u4e0d\u8fc7\u5b66\u4e60\u5c0f\u7ec4\u4e5f\u633a\u68d8\u624b\u7684\u3002\nI've been in groups where we spent more time chatting than actually studying, or someone just wants answers handed to them.\n\u6211\u53c2\u52a0\u8fc7\u90a3\u79cd\u5c0f\u7ec4\uff0c\u7ed3\u679c\u5927\u5bb6\u804a\u5929\u7684\u65f6\u95f4\u6bd4\u5b66\u4e60\u8fd8\u591a\uff0c\u6216\u8005\u6709\u4eba\u53ea\u60f3\u76f4\u63a5\u8981\u7b54\u6848\u3002\nYou have to be really strict with yourselves about it.\n\u6240\u4ee5\u5fc5\u987b\u5bf9\u81ea\u5df1\u8981\u6c42\u5f97\u5f88\u4e25\u683c\u3002\nI prefer studying alone and then just checking in with friends for specific questions.\n\u6211\u66f4\u559c\u6b22\u5148\u81ea\u5df1\u5b66\uff0c\u7136\u540e\u9047\u5230\u5177\u4f53\u95ee\u9898\u518d\u548c\u670b\u53cb\u8ba8\u8bba\u3002\n\nSpeaker1(Will)\nThat's true, you need the right people and, like, a clear plan. We'd definitely need to set some rules, like focusing on specific chapters or problem sets.\n\u8fd9\u5012\u662f\u771f\u7684\uff0c\u5173\u952e\u662f\u8981\u627e\u5bf9\u4eba\uff0c\u800c\u4e14\u5f97\u6709\u660e\u786e\u7684\u8ba1\u5212\u3002\u6bd4\u5982\u53ea\u9488\u5bf9\u67d0\u51e0\u7ae0\u6216\u8005\u67d0\u4e9b\u9898\u76ee\u6765\u590d\u4e60\u3002\nI think the key is to use it for reviewing difficult topics or quizzing each other, not for initial learning.\n\u6211\u89c9\u5f97\u5b66\u4e60\u5c0f\u7ec4\u66f4\u9002\u5408\u7528\u6765\u590d\u76d8\u96be\u70b9\u6216\u8005\u4e92\u76f8\u63d0\u95ee\uff0c\u800c\u4e0d\u662f\u7528\u6765\u505a\u6700\u521d\u7684\u5b66\u4e60\u3002\nIt's also about keeping each other on track.\n\u540c\u65f6\u4e5f\u80fd\u4e92\u76f8\u76d1\u7763\uff0c\u4e0d\u81f3\u4e8e\u8dd1\u504f\u3002\n\nSpeaker2(Lily)\nBeyond all the study techniques, I think it's just as important to look after yourself.\n\u9664\u4e86\u5404\u79cd\u5b66\u4e60\u65b9\u6cd5\u4e4b\u5916\uff0c\u6211\u89c9\u5f97\u7167\u987e\u597d\u81ea\u5df1\u540c\u6837\u91cd\u8981\u3002\nI know it sounds a bit old-fashioned to say, but getting enough sleep and eating properly makes a huge difference in how much information you can actually remember.\n\u6211\u77e5\u9053\u8fd9\u6837\u8bf4\u542c\u8d77\u6765\u6709\u70b9\u8001\u5957\uff0c\u4f46\u5145\u8db3\u7684\u7761\u7720\u548c\u89c4\u5f8b\u7684\u996e\u98df\uff0c\u771f\u7684\u4f1a\u6781\u5927\u5f71\u54cd\u4f60\u80fd\u8bb0\u4f4f\u591a\u5c11\u4e1c\u897f\u3002\nPulling all-nighters just isn't good for the long term; you end up forgetting everything the next day anyway.\n\u71ac\u591c\u901a\u5bb5\u4ece\u957f\u8fdc\u6765\u770b\u5e76\u4e0d\u597d\uff0c\u7b2c\u4e8c\u5929\u53cd\u800c\u4ec0\u4e48\u90fd\u8bb0\u4e0d\u4f4f\u3002\n\nSpeaker3(Male)\nTotally agree, Lily. I made that mistake in my first year and really regretted it.\n\u5b8c\u5168\u540c\u610f\uff0cLily\u3002\u6211\u5927\u4e00\u7684\u65f6\u5019\u5c31\u72af\u8fc7\u8fd9\u4e2a\u9519\u8bef\uff0c\u540e\u6765\u7279\u522b\u540e\u6094\u3002\nNow, I make sure to shut down my laptop an hour before bed and do something relaxing, like reading. It helps clear my head.\n\u73b0\u5728\u6211\u90fd\u4f1a\u5728\u7761\u524d\u4e00\u5c0f\u65f6\u5173\u6389\u7535\u8111\uff0c\u505a\u70b9\u653e\u677e\u7684\u4e8b\u60c5\uff0c\u6bd4\u5982\u770b\u770b\u4e66\uff0c\u8fd9\u6837\u80fd\u8ba9\u5927\u8111\u6e05\u7a7a\u4e00\u4e0b\u3002\nIt's all about finding that balance between studying really hard and not burning out completely.\n\u5173\u952e\u5c31\u662f\u5728\u52aa\u529b\u5b66\u4e60\u548c\u907f\u514d\u5f7b\u5e95\u8017\u5c3d\u7cbe\u529b\u4e4b\u95f4\u627e\u5230\u5e73\u8861\u3002","answer":"The conversation is about three speakers discussing the preparation for the final exams.\nSpeaker 1 talked about feeling the pressure for finals, and also mentioned she\u2019s trying to feel the pressure for finals, especially the quantitative methods exam.\nThen, Speaker 2 said she started making detailed study schedules and doing past papers with a timer, and then discussed that this would make the concepts stick.\nAnd then, Speaker 3 suggested active recall and spaced repetition, and also said this helps more with remembering things.\nSpeaker 2 talked about using active recall for literature class, and also mentioned that for math, grinding through problems is useful, and suggested scheduling in breaks.\nThen, Speaker 1 suggested starting a study group for the economics module so they can understand better and break up the boredom.\nAnd then, Speaker 3 argued this will make them spend more time chatting, and also said someone wants answers handed to them, so he prefers to study alone and check in with friends.\nSpeaker 1 talked about the right people and a clear plan, and also mentioned it\u2019s important to set some rules, focus on specific chapters or problems, and review difficult topics or quiz each other rather than initial learning.\nThen, Speaker 2 said, besides the study techniques, it\u2019s important to get enough sleep and eat properly.\nAnd then, Speaker 3 argued he made mistakes in his first year, and also suggested shutting down his laptop an hour before bed, doing something relaxing and clearing his head, so he can find balance between studying hard and not burning out.","points":[{"speaker":"style=\"height: 50.5898px;\"> Speaker 1 (Will)","points":["feeling the pressure for finals \u611f\u5230\u671f\u672b\u7684\u538b\u529b","figure out the best way to deal \u627e\u51fa\u6700\u597d\u7684\u89e3\u51b3\u529e\u6cd5","quantitative methods exam \u5b9a\u91cf\u6cd5\u8003\u8bd5"]},{"speaker":"style=\"height: 50.5898px;\"> Speaker 2 (Lily)","points":["making detailed study schedules \u505a\u7ec6\u81f4\u7684\u5b66\u4e60\u8ba1\u5212","doing past papers with a timer \u8ba1\u65f6\u7ec3\u4e60\u8fc7\u53bb\u7684\u8bd5\u5377","make the concepts stick \u7262\u7262\u8bb0\u4f4f\u6982\u5ff5"]},{"speaker":"style=\"height: 33.7266px;\"> Speaker 3 (Male)","points":["active recall and spaced repetition \u4e3b\u52a8\u56de\u5fc6\u548c\u95f4\u6b47\u91cd\u590d","helps more with remembering things \u5bf9\u8bb0\u5fc6\u66f4\u52a0\u6709\u5e2e\u52a9"]},{"speaker":"style=\"height: 50.5898px;\"> Speaker 2 (Lily)","points":["using active recall for literature class \u6587\u5b66\u8bfe\u4e0a\u8981\u591a\u7528\u4e3b\u52a8\u56de\u5fc6","for math, grinding through problems \u5bf9\u6570\u5b66\uff0c\u8981\u901a\u8fc7\u95ee\u9898\u6253\u78e8","schedule in breaks \u5b89\u6392\u4f11\u606f\u65f6\u95f4"]},{"speaker":"style=\"height: 50.5898px;\"> Speaker 1 (Will)","points":["starting a study group for the economics module \u572
