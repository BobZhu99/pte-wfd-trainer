ts":["trial sessions \u4f53\u9a8c\u6d3b\u52a8","see what suits you best before committing \u5728\u51b3\u5b9a\u4e4b\u524d\u770b\u770b\u4ec0\u4e48\u6700\u9002\u5408\u4f60"]},{"speaker":"Speaker 1","points":["start by exploring a few options  \u4ece\u591a\u5c1d\u8bd5\u51e0\u4e2a\u9009\u62e9\u5f00\u59cb","then decide \u7136\u540e\u518d\u505a\u51b3\u5b9a"]}],"keywords":["responsibilities","competitions","suggestions","tournaments","established","everything","committing","interests","something","genuinely","preparing","arguments","exploring","semester","everyone","training","sessions","internal","external","organize","existing","creating","joining","depends","scratch","regular","instead","options","choose","joined","debate","events","manage","easier","before","decide","enjoy","start","roles","takes","build","trial","suits","club","next","help","team","join","best","see","few"]},{"qid":"F211004","title":"Department's 10th Anniversary Party \u5e86\u795d\u90e8\u95e8\u5341\u5468\u5e74","source":"\u8424\u706b\u866b\u5b98\u65b9\u5468\u9884\u6d4b \u00b7 \u6781\u9ad8\u9891","tags":["\u6781\u9ad8\u9891"],"kind":"F","audio":"sgd_audio/F211004.mp3","audio_remote":"https://upload.fireflyau.com/pte/SSGD/r/a14e6f67899d0b6c8c458979c498f571.mp3","discussion":"Three teachers are discussing how to celebrate the Department's 10th Anniversary party.\n\nFor our department's 10th anniversary, I think we should book that Greek restaurant downtown. It has excellent reviews, and the atmosphere would be perfect for a special celebration. We deserve something memorable after a decade of hard work!\n\nI understand the appeal, but that restaurant is quite expensive, and it's far from campus. Many colleagues might find it inconvenient to travel there after work. Why don't we host it on campus instead? It would be more budget-friendly and accessible for everyone.\n\nNot the Mathematics Building restaurant, though\u2014the space is too cramped, and the decor is so dull. It wouldn\u2019t feel like a proper celebration there.\n\nWhat about the Business Building\u2019s private event room? It\u2019s spacious, recently renovated, and we can arrange catering. It\u2019s a good compromise\u2014still on campus but more upscale than our department\u2019s facilities.\n\nThat\u2019s a practical suggestion. Now, how many people should we invite? Initially, I thought just faculty members, but with only 15 of us, it might feel too small.\n\nWe could include some of our first graduating students! They were part of our department\u2019s early years, and it would be meaningful to have them join.\n\nAgreed. A mix of current faculty and selected alumni would make it more special. Let\u2019s finalize the Business Building as the venue and start compiling the guest list.","bilingual":"Three teachers are discussing how to celebrate the Department's 10th Anniversary party.\n\u4e09\u4f4d\u8001\u5e08\u6b63\u5728\u8ba8\u8bba\u5982\u4f55\u5e86\u795d\u9662\u7cfb\u6210\u7acb\u5341\u5468\u5e74\u7684\u5e86\u795d\u6d3b\u52a8\u3002\n\nSpeaker 1 (Female)\nFor our department's 10th anniversary, I think we should book that Greek restaurant downtown.\n\u4e3a\u4e86\u5e86\u795d\u6211\u4eec\u9662\u7cfb\u6210\u7acb\u5341\u5468\u5e74\uff0c\u6211\u89c9\u5f97\u53ef\u4ee5\u9884\u8ba2\u5e02\u4e2d\u5fc3\u90a3\u5bb6\u5e0c\u814a\u9910\u5385\u3002\nIt has excellent reviews, and the atmosphere would be perfect for a special celebration.\n\u5b83\u7684\u8bc4\u4ef7\u975e\u5e38\u597d\uff0c\u6c1b\u56f4\u4e5f\u5f88\u9002\u5408\u8fd9\u79cd\u7279\u522b\u7684\u5e86\u795d\u6d3b\u52a8\u3002\nWe deserve something memorable after a decade of hard work!\n\u8f9b\u82e6\u4e86\u6574\u6574\u5341\u5e74\uff0c\u6211\u4eec\u503c\u5f97\u4e00\u6b21\u96be\u5fd8\u7684\u5e86\u795d\uff01\n\nSpeaker 2 (Male)\nI understand the appeal, but that restaurant is quite expensive, and it's far from campus.\n\u6211\u80fd\u7406\u89e3\u5b83\u7684\u5438\u5f15\u529b\uff0c\u4f46\u90a3\u5bb6\u9910\u5385\u4ef7\u683c\u4e0d\u4fbf\u5b9c\uff0c\u800c\u4e14\u79bb\u5b66\u6821\u4e5f\u6bd4\u8f83\u8fdc\u3002\nMany colleagues might find it inconvenient to travel there after work.\n\u5f88\u591a\u540c\u4e8b\u4e0b\u73ed\u540e\u8fc7\u53bb\u53ef\u80fd\u4e0d\u592a\u65b9\u4fbf\u3002\nWhy don't we host it on campus instead?\n\u4e0d\u5982\u6211\u4eec\u5c31\u5728\u6821\u5185\u4e3e\u529e\u5427\uff1f\nIt would be more budget-friendly and accessible for everyone.\n\u8fd9\u6837\u65e2\u7701\u9884\u7b97\uff0c\u4e5f\u66f4\u65b9\u4fbf\u5927\u5bb6\u53c2\u52a0\u3002\n\nSpeaker 1 (Female)\nNot the Mathematics Building restaurant, though\u2014the space is too cramped, and the decor is so dull.\n\u4f46\u4e0d\u8981\u9009\u6570\u5b66\u697c\u7684\u90a3\u5bb6\u9910\u5385\u2014\u2014\u7a7a\u95f4\u592a\u5c0f\uff0c\u88c5\u9970\u4e5f\u5f88\u5355\u8c03\u3002\nIt wouldn\u2019t feel like a proper celebration there.\n\u5728\u90a3\u91cc\u529e\u7684\u8bdd\u4e00\u70b9\u90fd\u4e0d\u50cf\u6b63\u5f0f\u7684\u5e86\u795d\u6d3b\u52a8\u3002\n\nSpeaker 3 (Male)\nWhat about the Business Building\u2019s private event room?\n\u90a3\u5546\u5b66\u9662\u7684\u79c1\u4eba\u6d3b\u52a8\u5ba4\u600e\u4e48\u6837\uff1f\nIt\u2019s spacious, recently renovated, and we can arrange catering.\n\u7a7a\u95f4\u5f88\u5927\uff0c\u6700\u8fd1\u521a\u7ffb\u65b0\u8fc7\uff0c\u800c\u4e14\u53ef\u4ee5\u5b89\u6392\u9910\u996e\u670d\u52a1\u3002\nIt\u2019s a good compromise\u2014still on campus but more upscale than our department\u2019s facilities.\n\u8fd9\u662f\u4e2a\u4e0d\u9519\u7684\u6298\u4e2d\u65b9\u6848\u2014\u2014\u65e2\u5728\u6821\u5185\uff0c\u53c8\u6bd4\u6211\u4eec\u9662\u7cfb\u81ea\u5df1\u7684\u573a\u5730\u66f4\u6709\u6863\u6b21\u3002\n\nSpeaker 2 (Male)\nThat\u2019s a practical suggestion.\n\u8fd9\u662f\u4e2a\u5f88\u5b9e\u9645\u7684\u5efa\u8bae\u3002\nNow, how many people should we invite?\n\u90a3\u73b0\u5728\u6211\u4eec\u8be5\u9080\u8bf7\u591a\u5c11\u4eba\u5462\uff1f\nInitially, I thought just faculty members, but with only 15 of us, it might feel too small.\n\u6211\u4e00\u5f00\u59cb\u53ea\u60f3\u9080\u8bf7\u6559\u5e08\uff0c\u4f46\u6211\u4eec\u53ea\u670915\u4e2a\u4eba\uff0c\u611f\u89c9\u89c4\u6a21\u6709\u70b9\u592a\u5c0f\u4e86\u3002\n\nSpeaker 1 (Female)\nWe could include some of our first graduating students!\n\u6211\u4eec\u53ef\u4ee5\u9080\u8bf7\u4e00\u4e9b\u6700\u65e9\u6bd5\u4e1a\u7684\u5b66\u751f\uff01\nThey were part of our department\u2019s early years, and it would be meaningful to have them join.\n\u4ed6\u4eec\u89c1\u8bc1\u4e86\u9662\u7cfb\u53d1\u5c55\u7684\u65e9\u671f\u9636\u6bb5\uff0c\u80fd\u8bf7\u4ed6\u4eec\u4e00\u8d77\u6765\u4f1a\u5f88\u6709\u610f\u4e49\u3002\n\nSpeaker 3 (Male)\nAgreed. A mix of current faculty and selected alumni would make it more special.\n\u540c\u610f\u3002\u7531\u73b0\u4efb\u6559\u5e08\u548c\u90e8\u5206\u6821\u53cb\u5171\u540c\u53c2\u52a0\uff0c\u4f1a\u8ba9\u6d3b\u52a8\u66f4\u52a0\u7279\u522b\u3002\nLet\u2019s finalize the Business Building as the venue and start compiling the guest list.\n\u90a3\u5c31\u786e\u5b9a\u5546\u5b66\u9662\u4f5c\u4e3a\u4e3e\u529e\u5730\u70b9\u5427\uff0c\u7136\u540e\u5f00\u59cb\u6574\u7406\u9080\u8bf7\u540d\u5355\u3002","answer":"The conversation is about three speakers discussing how to celebrate the Department's 10th Anniversary party.\nSpeaker 1 suggested booking a Greek restaurant for this special celebration.\nThen, Speaker 2 said it is quite expensive and\u00a0far from campus, and then discussed that they should host on campus, which is budget-friendly and accessible.\nAnd then, Speaker 1 argued not to choose the Mathematics Building restaurant because it won\u2019t make the event a proper celebration.\nSpeaker 3 argued that they can consider the Business Building\u2019s private event room and also mentioned it can arrange catering.\nThen, Speaker 2 said it\u2019s a practical suggestion, and then discussed how many people they should invite and suggested just faculty members.\nAnd then, Speaker 1 argued they should include first graduating students, and also said it would be meaningful.\nSpeaker 3 talked about combining faculty and alumni, and also mentioned that they should compile the guest list.","points":[{"speaker":"style=\"height: 33.7266px;\"> Speaker 1 (Female)","points":["book a Greek restaurant \u8ba2\u5e0c\u814a\u9910\u5385","a special celebration \u7279\u522b\u7684\u5e86\u795d\u6d3b\u52a8"]},{"speaker":"style=\"height: 50.5898px;\"> Speaker 2 (Male)","points":["quite expensive and far from campus \u592a\u8d35\uff0c\u8fd8\u79bb\u5b66\u6821\u592a\u8fdc","host on campus \u5728\u5b66\u6821\u529e","budget-friendly and accessible \u9884\u7b97\u5408\u7406\uff0c\u4e14\u8ddd\u79bb\u5408\u9002"]},{"speaker":"style=\"height: 33.7266px;\"> Speaker 1 (Female)","points":["not the Mathematics Building restaurant \u4e0d\u8981\u9009\u6570\u5b66\u697c\u7684\u90a3\u5bb6\u9910\u5385","a proper celebration \u4e0d\u50cf\u6b63\u5f0f\u7684\u5e86\u795d\u6d3b\u52a8"]},{"speaker":"style=\"height: 33.7266px;\"> Speaker 3 (Male)","points":["Business Building\u2019s private event room \u5546\u5b66\u9662\u7684\u79c1\u4eba\u6d3b\u52a8\u5ba4","arrange catering \u5b89\u6392\u9910\u996e\u670d\u52a1"]},{"speaker":"style=\"height: 50.5898px;\"> Speaker 2 (Male)","points":["a practical suggestion \u5f88\u5b9e\u9645\u7684\u5efa\u8bae","how much people invite \u8be5\u9080\u8bf7\u591a\u5c11\u4eba","just faculty members \u53ea\u6709\u5b66\u9662\u6210\u5458"]},{"speaker":"style=\"height: 33.7266px;\"> Speaker 1 (Female)","points":["include first graduating students \u9080\u8bf7\u7b2c\u4e00\u6279\u6bd5\u4e1a\u7684\u5b66\u751f","meaningful \u6709\u610f\u4e49"]},{"speaker":"style=\"height: 33.7266px;\"> Speaker 3 (Male)","points":["combine faculty and alumni \u540c\u65f6\u9080\u8bf7\u6559\u5e08\u548c\u6821\u53cb","compile the guest list \u6574\u7406\u9080\u8bf7\u540d\u5355"]}],"keywords":["celebration","mathematics","restaurant","accessible","suggestion","graduating","meaningful","expensive","practical","friendly","building","business","catering","special","private","arrange","faculty","members","include","combine","compile","budget","proper","invite","alumni","greek","quite","event","guest","book","host","room","list","far"]},{"qid":"F211050","title":"Revising the First Essay \u4fee\u6539\u7b2c\u4e00\u7bc7\u8bba\u6587","source":"\u8424\u706b\u866b\u5b98\u65b9\u5468\u9884\u6d4b \u00b7 \u6781\u9ad8\u9891","tags":["\u6781\u9ad8\u9891"],"kind":"F","audio":"sgd_audio/F211050.mp3","audio_remote":"https://upload.fireflyau.com/pte/SSGD/r/8258e92b7b80c9d8d31b1815cfa698ca.mp3","discussion":"A tutor and two students are discussing how to revise their first essay.\n\nI\u2019m a bit nervous about my first essay. The main problem is the word count limit. I\u2019m worried that my essay may be too long.\n\nIt\u2019s fine. You don\u2019t need to worry too much about the word count this time. After all, this is your first time writing this kind of essay. But you should avoid giving too many details. Try to focus on the key points. Also, don\u2019t repeat the same words too often in many paragraphs. Too much repetition can make your writing sound weak.\n\nActually, I repeat words deliberately because they are very important. I thought that, in that case, it could represent our main points more clearly.\n\nI understand why you did that, but that\u2019s not the best way to show your main points. Instead of repeating the same words, you can use clear topic sentences and stronger explanations. That will make your argument easier to follow.\n\nSo we should write the key points more clearly. And we should reduce repeating words.\n\nExactly. Just check your essay again and confirm that your main ideas are clear. Then you can submit it.\n\nThank you. That makes me feel more confident about revising it.\n\nYou\u2019re welcome. Don\u2019t worry too much, and good luck with your submission.","bilingual":"A tutor and two students are discussing how to revise their first essay.\n\u4e00\u4f4d\u5bfc\u5e08\u548c\u4e24\u540d\u5b66\u751f\u6b63\u5728\u8ba8\u8bba\u5982\u4f55\u4fee\u6539\u7b2c\u4e00\u7bc7\u8bba\u6587\u3002\n\nStudent 1 (Male)\nI\u2019m a bit nervous about my first essay.\n\u6211\u5bf9\u6211\u7684\u7b2c\u4e00\u7bc7\u8bba\u6587\u6709\u70b9\u7d27\u5f20\u3002\nThe main problem is the word count limit.\n\u4e3b\u8981\u95ee\u9898\u662f\u5b57\u6570\u9650\u5236\u3002\nI\u2019m worried that my essay may be too long.\n\u6211\u62c5\u5fc3\u6211\u7684\u6587\u7ae0\u53ef\u80fd\u592a\u957f\u4e86\u3002\n\nTutor (Female)\nIt\u2019s fine.\n\u6ca1\u5173\u7cfb\u3002\nYou don\u2019t need to worry too much about the word count this time.\n\u8fd9\u6b21\u4f60\u4e0d\u7528\u592a\u62c5\u5fc3\u5b57\u6570\u3002\nAfter all, this is your first time writing this kind of essay.\n\u6bd5\u7adf\u8fd9\u662f\u4f60\u4eec\u7b2c\u4e00\u6b21\u5199\u8fd9\u79cd\u7c7b\u578b\u7684\u8bba\u6587\u3002\nBut you should avoid giving too many details.\n\u4f46\u662f\u4f60\u5e94\u8be5\u907f\u514d\u63d0\u4f9b\u592a\u591a\u7ec6\u8282\u3002\nTry to focus on the key points.\n\u5c3d\u91cf\u5173\u6ce8\u91cd\u70b9\u3002\nAlso, don\u2019t repeat the same words too often in many paragraphs.\n\u53e6\u5916\uff0c\u4e0d\u8981\u5728\u5f88\u591a\u6bb5\u843d\u91cc\u9891\u7e41\u91cd\u590d\u540c\u6837\u7684\u8bcd\u3002\nToo much repetition can make your writing sound weak.\n\u592a\u591a\u91cd\u590d\u4f1a\u8ba9\u4f60\u7684\u5199\u4f5c\u542c\u8d77\u6765\u4e0d\u591f\u6709\u529b\u3002\n\nStudent 2 (Female)\nActually, I repeat words deliberately because they are very important.\n\u5176\u5b9e\u6211\u662f\u6545\u610f\u91cd\u590d\u8fd9\u4e9b\u8bcd\u7684\uff0c\u56e0\u4e3a\u5b83\u4eec\u5f88\u91cd\u8981\u3002\nI thought that, in that case, it could represent our main points more clearly.\n\u6211\u539f\u672c\u4ee5\u4e3a\u8fd9\u6837\u53ef\u4ee5\u66f4\u6e05\u695a\u5730\u4f53\u73b0\u6211\u4eec\u7684\u91cd\u70b9\u3002\n\nTutor (Female)\nI understand why you did that, but that\u2019s not the best way to show your main points.\n\u6211\u7406\u89e3\u4f60\u4e3a\u4ec0\u4e48\u8fd9\u4e48\u505a\uff0c\u4f46\u8fd9\u5e76\u4e0d\u662f\u4f53\u73b0\u91cd\u70b9\u7684\u6700\u597d\u65b9\u5f0f\u3002\nInstead of repeating the same words, you can use clear topic sentences and stronger explanations.\n\u4e0e\u5176\u91cd\u590d\u540c\u6837\u7684\u8bcd\uff0c\u4e0d\u5982\u4f7f\u7528\u6e05\u6670\u7684\u4e3b\u9898\u53e5\u548c\u66f4\u6709\u529b\u7684\u89e3\u91ca\u3002\nThat will make your argument easier to follow.\n\u8fd9\u6837\u4f1a\u8ba9\u4f60\u7684\u8bba\u8bc1\u66f4\u5bb9\u6613\u7406\u89e3\u3002\n\nStudent 1 (Male)\nSo we should write the key points more clearly.\n\u6240\u4ee5\u6211\u4eec\u5e94\u8be5\u628a\u91cd\u70b9\u5199\u5f97\u66f4\u6e05\u695a\u3002\nAnd we should reduce repeating words.\n\u800c\u4e14\u6211\u4eec\u5e94\u8be5\u51cf\u5c11\u91cd\u590d\u7528\u8bcd\u3002\n\nTutor (Female)\nExactly.\n\u6ca1\u9519\u3002\nJust check your essay again and confirm that your main ideas are clear.\n\u4f60\u4eec\u53ea\u9700\u8981\u518d\u68c0\u67e5\u4e00\u904d\u6587\u7ae0\uff0c\u786e\u8ba4\u4e3b\u8981\u89c2\u70b9\u662f\u6e05\u695a\u7684\u3002\nThen you can submit it.\n\u7136\u540e\u5c31\u53ef\u4ee5\u63d0\u4ea4\u4e86\u3002\n\nStudent 2 (Female)\nThank you.\n\u8c22\u8c22\u60a8\u3002\nThat makes me feel more confident about revising it.\n\u8fd9\u8ba9\u6211\u5bf9\u4fee\u6539\u6587\u7ae0\u66f4\u6709\u4fe1\u5fc3\u4e86\u3002\n\nTutor (Female)\nYou\u2019re welcome.\n\u4e0d\u5ba2\u6c14\u3002\nDon\u2019t worry too much, and good luck with your submission.\n\u4e0d\u7528\u592a\u62c5\u5fc3\uff0c\u795d\u4f60\u4eec\u63d0\u4ea4\u987a\u5229\u3002","answer":"The conversation is about two students and one tutor discussing how revise their first essay.\nStudent 1 mentioned he is nervous about his first essay due to the word count limit.\nThen, the tutor said that they don\u2019t need to worry too much, and then discussed that they should avoid giving too many details and focus on the key points, especially they shouldn\u2019t repeat the same words.\nAnd then, Student 2 argued that she repeat words deliberately because they are very important, and thought in that way they can represent their main points more clearly.\nThe tutor mentioned that they should use clear topic sentences and stronger explanations.\nThen, Student 1 said that they should write the key points more clearly and reduce repeating words.\nAnd then, the tutor suggested that they should confirm that their main ideas are clear, and also mentioned if they have done so, they can submit their essays.\nStudent 2 mentioned that he feels more confident.\nFinally, the tutor wish them good luck.","points":[{"speaker":"Student 1 (Male)","points":["nervous about my first essay \u6709\u70b9\u7d27\u5f20\u6211\u7684\u7b2c\u4e00\u7bc7\u8bba\u6587","the word count limit \u95ee\u9898\u662f\u5b57\u6570\u9650\u5236"]},{"speaker":"Tutor (Female)","points":["don\u2019t need to worry too much \u4e0d\u7528\u592a\u62c5\u5fc3\u5b57\u6570","avoid giving too many details \u907f\u514d\u63d0\u4f9b\u592a\u591a\u7ec6\u8282","focus on the key points \u5173\u6ce8\u91cd\u70b9","don\u2019t repeat the same words \u4e0d\u8981\u4e00\u76f4\u91cd\u590d"]},{"speaker":"Student 2 (Male)","points":["repeat words deliberately because they are very important \u56e0\u4e3a\u91cd\u8981\uff0c\u6240\u4ee5\u6545\u610f\u91cd\u590d","represent our main points more clearly \u66f4\u6e05\u695a\u5730\u4f53\u73b0\u91cd\u70b9"]},{"speaker":"Tutor (Female)","points":["use clear topic sentences and stronger explanations \u4f7f\u7528\u6e05\u6670\u7684\u4e3b\u9898\u53e5\u548c\u66f4\u6709\u529b\u7684\u89e3\u91ca"]},{"speaker":"Student 1 (Male)","points":["should write the key points more clearly \u5199\u91cd\u70b9","should reduce repeating words \u51cf\u5c11\u91cd\u590d"]},{"speaker":"Tutor (Female)","points":["confirm that your main ideas are clear \u786e\u8ba4\u89c2\u70b9\u662f\u6e05\u695a\u7684","submit it \u63d0\u4ea4"]},{"speaker":"Student 2 (Male)","points":["feel more confident \u66f4\u6709\u4fe1\u5fc3"]},{"speaker":"Tutor (Female)","points":["good luck \u795d\u4f60\u4eec\u597d\u8fd0"]}],"keywords":["deliberately","explanations","important","represent","sentences","repeating","confident","stronger","nervous","details","clearly","confirm","giving","points","repeat","reduce","submit","essay","count","limit","worry","avoid","focus","words","clear","topic","write","ideas","word","main","feel","good","luck","don","too","key","use"]},{"qid":"F211010","title":"Using Mobile Phones in Lectures \u8bfe\u5802\u4e0a\u7528\u624b\u673a","source":"\u8424\u706b\u866b\u5b98\u65b9\u5468\u9884\u6d4b \u00b7 \u6781\u9ad8\u9891","tags":["\u6781\u9ad8\u9891"],"kind":"F","audio":"sgd_audio/F211010.mp3","audio_remote":"https://upload.fireflyau.com/pte/SSGD/r/bbb4d682bfb5273df61028eaa771d4cd.mp3","discussion":"Three tutors are discussing the use of mobile phones in lectures.\n\nOkay team, let's talk about something that's been bothering me. What do you think of students using mobile phones in lectures? Honestly, it drives me crazy.\n\nWell, actually, I feel okay with students using a mobile phone in my class. Firstly, some students use their phone to record the lecture, which can be really helpful for reviewing later. Secondly, we have many international students whose English isn't perfect; they often need to quickly check words or translations during the lecture to keep up.\n\nI know, I get what you're saying, but in my experience, they always seem to get distracted and start chatting with friends on their phones instead of paying attention. You never really know what they're actually doing on there.\n\nI see both sides, but I think it's not necessary to put a full ban on mobile phones in lectures. Sometimes, I will even ask my students to use their phones for in-class activities, like polls or quick research, to make the lesson more interactive.\n\nThat's a good point. Maybe we could have a meeting\u2014a lunch meeting on Tuesday, perhaps\u2014to discuss this further and share best practices?\n\nYes, I agree. This is a broader issue. We should also bring this idea to the next department conference and try to think of a clear, fair policy with the whole department.","bilingual":"Three tutors are discussing the use of mobile phones in lectures.\n\u4e09\u4f4d\u5bfc\u5e08\u6b63\u5728\u8ba8\u8bba\u5b66\u751f\u5728\u8bfe\u5802\u4e0a\u4f7f\u7528\u624b\u673a\u7684\u95ee\u9898\u3002\n\nSpeaker 1\nOkay team, let's talk about something that's been bothering me.\n\u597d\u4e86\uff0c\u5927\u5bb6\u6765\u804a\u4e00\u4e2a\u4e00\u76f4\u8ba9\u6211\u5f88\u56f0\u6270\u7684\u95ee\u9898\u5427\u3002\nWhat do you think of students using mobile phones in lectures?\n\u4f60\u4eec\u600e\u4e48\u770b\u5b66\u751f\u5728\u8bfe\u5802\u4e0a\u7528\u624b\u673a\u8fd9\u4ef6\u4e8b\uff1f\nHonestly, it drives me crazy.\n\u8bf4\u5b9e\u8bdd\uff0c\u8fd9\u771f\u7684\u8ba9\u6211\u5f88\u6293\u72c2\u3002\n\nSpeaker 2\nWell, actually, I feel okay with students using a mobile phone in my class.\n\u5176\u5b9e\u6211\u5bf9\u5b66\u751f\u5728\u6211\u8bfe\u4e0a\u7528\u624b\u673a\u8fd8\u7b97\u80fd\u63a5\u53d7\u3002\nFirstly, some students use their phone to record the lecture, which can be really helpful for reviewing later.\n\u9996\u5148\uff0c\u6709\u4e9b\u5b66\u751f\u4f1a\u7528\u624b\u673a\u5f55\u8bfe\uff0c\u4e4b\u540e\u590d\u4e60\u65f6\u975e\u5e38\u6709\u5e2e\u52a9\u3002\nSecondly, we have many international students whose English isn't perfect;\n\u5176\u6b21\uff0c\u6211\u4eec\u6709\u5f88\u591a\u56fd\u9645\u5b66\u751f\uff0c\u4ed6\u4eec\u7684\u82f1\u8bed\u5e76\u4e0d\u5b8c\u5168\u719f\u7ec3\uff0c\nthey often need to quickly check words or translations during the lecture to keep up.\n\u5e38\u5e38\u9700\u8981\u5728\u8bfe\u5802\u4e0a\u5feb\u901f\u67e5\u8bcd\u6216\u7ffb\u8bd1\uff0c\u624d\u80fd\u8ddf\u4e0a\u8fdb\u5ea6\u3002\n\nSpeaker 1\nI know, I get what you're saying, but in my experience,\n\u6211\u77e5\u9053\uff0c\u6211\u7406\u89e3\u4f60\u7684\u610f\u601d\uff0c\u4f46\u6839\u636e\u6211\u7684\u7ecf\u9a8c\uff0c\nthey always seem to get distracted and start chatting with friends on their phones instead of paying attention.\n\u4ed6\u4eec\u5f80\u5f80\u5f88\u5bb9\u6613\u5206\u5fc3\uff0c\u7528\u624b\u673a\u548c\u670b\u53cb\u804a\u5929\uff0c\u800c\u4e0d\u662f\u8ba4\u771f\u542c\u8bfe\u3002\nYou never really know what they're actually doing on there.\n\u4f60\u6839\u672c\u4e0d\u77e5\u9053\u4ed6\u4eec\u624b\u673a\u4e0a\u5230\u5e95\u5728\u5e72\u4ec0\u4e48\u3002\n\nSpeaker 3\nI see both sides, but I think it's not necessary to put a full ban on mobile phones in lectures.\n\u6211\u89c9\u5f97\u4f60\u4eec\u4e24\u8fb9\u7684\u89c2\u70b9\u90fd\u6709\u9053\u7406\uff0c\u4f46\u6211\u8ba4\u4e3a\u6ca1\u5fc5\u8981\u5728\u8bfe\u5802\u4e0a\u5168\u9762\u7981\u6b62\u624b\u673a\u3002\nSometimes, I will even ask my students to use their phones for in-class activities, like polls or quick research, to make the lesson more interactive.\n\u6709\u65f6\u5019\u6211\u751a\u81f3\u4f1a\u8ba9\u5b66\u751f\u7528\u624b\u673a\u53c2\u4e0e\u8bfe\u5802\u6d3b\u52a8\uff0c\u6bd4\u5982\u6295\u7968\u6216\u5feb\u901f\u67e5\u8d44\u6599\uff0c\u8fd9\u6837\u80fd\u8ba9\u8bfe\u5802\u66f4\u6709\u4e92\u52a8\u6027\u3002\n\nSpeaker 2\nThat's a good point.\n\u8fd9\u662f\u4e2a\u4e0d\u9519\u7684\u60f3\u6cd5\u3002\nMaybe we could have a meeting\u2014a lunch meeting on Tuesday, perhaps\u2014to discuss this further and share best practices?\n\u4e5f\u8bb8\u6211\u4eec\u53ef\u4ee5\u5f00\u4e2a\u4f1a\uff0c\u6bd4\u5982\u5468\u4e8c\u7684\u5348\u9910\u4f1a\u8bae\uff0c\u8fdb\u4e00\u6b65\u8ba8\u8bba\u8fd9\u4e2a\u95ee\u9898\uff0c\u5206\u4eab\u5404\u81ea\u6bd4\u8f83\u6709\u6548\u7684\u505a\u6cd5\uff1f\n\nSpeaker 1\nYes, I agree.\n\u662f\u7684\uff0c\u6211\u540c\u610f\u3002\nThis is a broader issue.\n\u8fd9\u662f\u4e00\u4e2a\u66f4\u5e7f\u6cdb\u7684\u95ee\u9898\u3002\nWe should also bring this idea to the next department conference and try to think of a clear, fair policy with the whole department.\n\u6211\u4eec\u4e5f\u5e94\u8be5\u628a\u8fd9\u4e2a\u8bae\u9898\u5e26\u5230\u4e0b\u4e00\u6b21\u9662\u7cfb\u4f1a\u8bae\u4e0a\uff0c\u548c\u6574\u4e2a\u9662\u7cfb\u4e00\u8d77\u5236\u5b9a\u4e00\u4e2a\u6e05\u6670\u3001\u516c\u5e73\u7684\u653f\u7b56\u3002","answer":"The conversation is about three speakers discussing using mobile phones in lectures.\nSpeaker 1 talked about students using mobile phones in lectures, and also mentioned that this drives the speaker crazy.\nThen, Speaker 2 said some students use mobile phones to record the lecture, and then discussed that foreign students want to check the words.\nAnd then, Speaker 1 argued that the speaker will get distracted, and also referred to the fact that students started chatting with others, and teachers will never know what they are doing.\nSpeaker 3 talked about it is not necessary to put a ban, and also mentioned they can ask my students to do interactions with their mobile phones.\nThen, Speaker 2 said they can have a lunch meeting on Tuesday to discuss.\nAnd then, Speaker 1 argued they can bring this idea to the department conference and try to think of a policy.","points":[{"speaker":"Speaker 1","points":["students using mobile phone in lectures? \u4f60\u89c9\u5f97\u5b66\u751f\u8bfe\u4e0a\u7528\u624b\u673a\u597d\u5417\uff1f","drives me crazy \u8981\u628a\u6211\u903c\u75af\u4e86"]},{"speaker":"Speaker 2","points":["use mobile phone to record the lecture \u6709\u7684\u5b66\u751f\u7528\u624b\u673a\u5f55\u8bfe","foreign students want to check the words \u82f1\u8bed\u4e0d\u597d\u7684\u5916\u56fd\u5b66\u751f\u60f3\u8981\u7528\u624b\u673a\u67e5\u8bcd"]},{"speaker":"Speaker 1","points":["get distracted \u4f46\u6211\u603b\u662f\u88ab\u5206\u5fc3","started chatting with others \u5b66\u751f\u4f1a\u5f00\u59cb\u548c\u522b\u7684\u4eba\u804a\u5929","you never know what they are doing \u4f60\u6c38\u8fdc\u4e0d\u77e5\u9053\u5b66\u751f\u5728\u5e72\u561b"]},{"speaker":"Speaker 3","points":["not necessary to put a ban \u6ca1\u5fc5\u8981\u5728\u8bfe\u4e0a\u7981\u7528\u624b\u673a","ask my students to do interactions with their mobile phones \u6709\u65f6\u4e5f\u8ba9\u5b66\u751f\u7528\u624b\u673a\u4e92\u52a8"]},{"speaker":"Speaker 2","points":["have a lunch meeting on Tuesday to discuss \u6211\u4eec\u53ef\u4ee5\u5468\u4e8c\u5348\u9910\u65f6\u95f4\u8ba8\u8bba\u4e00\u4e0b\u8fd9\u4e2a\u95ee\u9898"]},{"speaker":"Speaker 1","points":["bring this idea to the department conference \u6211\u4eec\u53ef\u4ee5\u5728\u5b66\u9662\u4f1a\u8bae\u4e0a\u63d0\u51fa\u8fd9\u4e2a\u95ee\u9898","try to think of a policy \u5c1d\u8bd5\u60f3\u51fa\u4e00\u4e2a\u5b66\u9662\u653f\u7b56\u6765"]}],"keywords":["interactions","distracted","department","conference","necessary","chatting","foreign","started","meeting","tuesday","discuss","mobile","drives","record","phones","policy","using","phone","crazy","check","words","lunch","bring","idea","use","put","ban","try"]},{"qid":"F211021","title":"Free Online Courses \u514d\u8d39\u5728\u7ebf\u8bfe\u7a0b","source":"\u8424\u706b\u866b\u5b98\u65b9\u5468\u9884\u6d4b \u00b7 \u6781\u9ad8\u9891","tags":["\u6781\u9ad8\u9891"],"kind":"F","audio":"sgd_audio/F211021.mp3","audio_remote":"https://upload.fireflyau.com/pte/SSGD/r/72c3890e959a0ce04bd207668fdc099c.mp3","discussion":"Three teachers are discussing free online courses.\n\nActually, I've been looking into the growth of free online courses lately and found that there are now many free online courses. It's impressive how many well-known universities offer free online courses nowadays.\n\nYes! I think it is too good to be true. What about you? Do you think the free online courses offer benefits to students?\n\nExactly! I think it's a very good idea, especially when you consider accessibility. Many people simply cannot attend traditional school because of their financial situation, so these courses can be a real benefit to those learners. But you know what, I've noticed a real gap between offering and uptake. Many students just do not take part.\n\nThat\u2019s true. Because many students do not have time to take these free online courses. I suggest universities could reschedule these courses to other times to attract more outsiders to join.\n\nAnd you know what, I can hardly believe so few people who enroll see it through to the end.\n\nYes, that happens a lot. Actually, those who have the desire to study are often the most likely to complete the courses. Some people are discouraged by the tedious coursework, as they discover that a large amount of work is required. Another reason for the low completion is that these courses are free, so students don\u2019t face any financial punishment.","bilingual":"Three teachers are discussing free online courses.\n\u4e09\u4f4d\u6559\u5e08\u6b63\u5728\u8ba8\u8bba\u514d\u8d39\u7684\u5728\u7ebf\u8bfe\u7a0b\u3002\n\nSpeaker 1 Female\nActually, I've been looking into the growth of free online courses lately and found that there are now many free online courses.\n\u5176\u5b9e\uff0c\u6211\u6700\u8fd1\u4e00\u76f4\u5728\u5173\u6ce8\u514d\u8d39\u5728\u7ebf\u8bfe\u7a0b\u7684\u53d1\u5c55\uff0c\u53d1\u73b0\u73b0\u5728\u8fd9\u7c7b\u8bfe\u7a0b\u7684\u6570\u91cf\u771f\u7684\u5f88\u591a\u3002\nIt's impressive how many well-known universities offer free online courses nowadays.\n\u5982\u4eca\u6709\u8fd9\u4e48\u591a\u77e5\u540d\u5927\u5b66\u90fd\u5728\u63d0\u4f9b\u514d\u8d39\u5728\u7ebf\u8bfe\u7a0b\uff0c\u786e\u5b9e\u8ba9\u4eba\u5370\u8c61\u6df1\u523b\u3002\n\nSpeaker 2 Male\nYes! I think it is too good to be true. What about you?\n\u662f\u554a\uff01\u6211\u4e5f\u89c9\u5f97\u8fd9\u597d\u5f97\u6709\u70b9\u4e0d\u771f\u5b9e\u3002\u4f60\u600e\u4e48\u770b\uff1f\nDo you think the free online courses offer benefits to students?\n\u4f60\u89c9\u5f97\u8fd9\u4e9b\u514d\u8d39\u5728\u7ebf\u8bfe\u7a0b\u771f\u7684\u80fd\u8ba9\u5b66\u751f\u53d7\u76ca\u5417\uff1f\n\nSpeaker 1 Female\nExactly! I think it's a very good idea, especially when you consider accessibility.\n\u6ca1\u9519\uff01\u6211\u89c9\u5f97\u8fd9\u662f\u4e00\u4e2a\u975e\u5e38\u597d\u7684\u60f3\u6cd5\uff0c\u5c24\u5176\u662f\u4ece\u53ef\u53ca\u6027\u6765\u770b\u3002\nMany people simply cannot attend traditional school because of their financial situation, so these courses can be a real benefit to those learners.\n\u5f88\u591a\u4eba\u56e0\u4e3a\u7ecf\u6d4e\u6761\u4ef6\u6709\u9650\uff0c\u6839\u672c\u65e0\u6cd5\u8fdb\u5165\u4f20\u7edf\u5b66\u6821\u5b66\u4e60\uff0c\u800c\u8fd9\u4e9b\u8bfe\u7a0b\u5c31\u80fd\u771f\u6b63\u5e2e\u52a9\u5230\u4ed6\u4eec\u3002\nBut you know what, I've noticed a real gap between offering and uptake.\n\u4e0d\u8fc7\u4e0e\u6b64\u540c\u65f6\uff0c\u6211\u4e5f\u6ce8\u610f\u5230\u8bfe\u7a0b\u4f9b\u7ed9\u548c\u5b9e\u9645\u53c2\u4e0e\u4e4b\u95f4\u5b58\u5728\u5f88\u5927\u7684\u5dee\u8ddd\uff0c\nMany students just do not take part.\n\u5f88\u591a\u5b66\u751f\u5e76\u6ca1\u6709\u771f\u6b63\u53c2\u4e0e\u8fdb\u6765\u3002\n\nSpeaker 3 Female\nThat\u2019s true. Because many students do not have time to take these free online courses.\n\u786e\u5b9e\u5982\u6b64\u3002\u5f88\u591a\u5b66\u751f\u6839\u672c\u62bd\u4e0d\u51fa\u65f6\u95f4\u6765\u4e0a\u8fd9\u4e9b\u514d\u8d39\u5728\u7ebf\u8bfe\u7a0b\u3002\nI suggest universities could reschedule these courses to other times to attract more outsiders to join.\n\u6211\u89c9\u5f97\u5927\u5b66\u53ef\u4ee5\u8003\u8651\u8c03\u6574\u8bfe\u7a0b\u65f6\u95f4\uff0c\u8fd9\u6837\u6216\u8bb8\u80fd\u5438\u5f15\u66f4\u591a\u6821\u5916\u4eba\u58eb\u53c2\u4e0e\u3002\n\nSpeaker 1 Female\nAnd you know what, I can hardly believe so few people who enroll see it through to the end.\n\u800c\u4e14\u4f60\u77e5\u9053\u5417\uff0c\u6211\u51e0\u4e4e\u4e0d\u6562\u76f8\u4fe1\uff0c\u771f\u6b63\u80fd\u575a\u6301\u5b8c\u6210\u8bfe\u7a0b\u7684\u62a5\u540d\u8005\u7adf\u7136\u8fd9\u4e48\u5c11\u3002\n\nSpeaker 3 Female\nYes, that happens a lot. Actually, those who have the desire to study are often the most likely to complete the courses.\n\u662f\u7684\uff0c\u8fd9\u79cd\u60c5\u51b5\u975e\u5e38\u5e38\u89c1\u3002\u5b9e\u9645\u4e0a\uff0c\u771f\u6b63\u6709\u5b66\u4e60\u52a8\u529b\u7684\u4eba\u624d\u6700\u6709\u53ef\u80fd\u628a\u8bfe\u7a0b\u575a\u6301\u5b66\u5b8c\u3002\nSome people are discouraged by the tedious coursework, as they discover that a large amount of work is required.\n\u6709\u4e9b\u4eba\u5728\u610f\u8bc6\u5230\u8bfe\u7a0b\u4f5c\u4e1a\u7e41\u91cd\u3001\u9700\u8981\u6295\u5165\u5927\u91cf\u65f6\u95f4\u548c\u7cbe\u529b\u540e\uff0c\u5c31\u4f1a\u88ab\u529d\u9000\u3002\nAnother reason for the low completion is that these courses are free, so students don\u2019t face any financial punishment.\n\u53e6\u5916\u4e00\u4e2a\u5bfc\u81f4\u5b8c\u6210\u7387\u4f4e\u7684\u539f\u56e0\u662f\uff0c\u8fd9\u4e9b\u8bfe\u7a0b\u662f\u514d\u8d39\u7684\uff0c\u5b66\u751f\u5373\u4f7f\u4e2d\u9014\u653e\u5f03\uff0c\u4e5f\u4e0d\u4f1a\u627f\u62c5\u4efb\u4f55\u7ecf\u6d4e\u4e0a\u7684\u635f\u5931\u3002","answer":"The conversation is about three speakers discussing free online courses.\nSpeaker 1 talked about the growth of free online courses, and it\u2019s impressive, and also mentioned that well-known universities offer free online courses.\nThen, Speaker 2 asked if free online courses offer benefits to students.\nAnd then, Speaker 1 believed so, considering accessibility, and also said some people cannot attend traditional school due to financial situation, and referred to a real gap between offering and uptake.\nSpeaker 3 mentioned that many students do not have time, and also mentioned that universities should reschedule to other times to attract more outsiders to join.\nThen, Speaker 1 said few people who enroll see it through to the end.\nAnd then, Speaker 3 argued that if people have the desire to study, they most likely can complete the courses, and also referred to the fact that a large amount of work is required, and also said low completion may be because the courses are free, so they don\u2019t face financial punishment.","points":[{"speaker":"Speaker 1 (Female)","points":["the growth of free online courses \u514d\u8d39\u5728\u7ebf\u8bfe\u7a0b\u7684\u53d1\u5c55","impressive \u5370\u8c61\u6df1\u523b","well-known universities offer free online courses \u540d\u6821\u63d0\u4f9b\u514d\u8d39\u5728\u7ebf\u8bfe\u7a0b"]},{"speaker":"Speaker 2 (Male)","points":["offer benefits to students \u7ed9\u5b66\u751f\u5e26\u6765\u5229\u76ca"]},{"speaker":"Speaker 1 (Female)","points":["consider accessibility \u8003\u8651\u6613\u4f7f\u7528\u6027","attend traditional school \u53c2\u52a0\u4f20\u7edf\u6821","financial situation \u8d22\u52a1\u72b6\u51b5","a real gap between offering and uptake \u5728\u63d0\u4f9b\u548c\u53c2\u4e0e\u4e4b\u95f4\u6709\u5f88\u5927\u5dee\u8ddd"]},{"speaker":"Speaker 3 (Female)","points":["many students do not have time \u5f88\u591a\u5b66\u751f\u6ca1\u65f6\u95f4","universities reschedule to other times \u5927\u5b66\u91cd\u65b0\u5b89\u6392\u5230\u5176\u4ed6\u65f6\u95f4","attract more outsiders to join \u5438\u5f15\u66f4\u591a\u6821\u5916\u5b66\u751f\u52a0\u5165"]},{"speaker":"Speaker 1 (Female)","points":["few people who enroll see it through to the end \u5f88\u5c11\u6709\u62a5\u540d\u7684\u4eba\u575a\u6301\u5230\u6700\u540e"]},{"speaker":"Speaker 3 (Female)","points":["have the desire to study \u6709\u5b66\u4e60\u7684\u6b32\u671b","most likely to complete the courses \u6709\u53ef\u80fd\u5b8c\u6210\u8bfe\u7a0b","a large amount of work is required \u5f88\u591a\u8bfe\u4e1a\u9700\u8981\u5b8c\u6210","low completion \u4f4e\u5b8c\u6210\u5ea6","courses are free \u8bfe\u7a0b\u662f\u514d\u8d39\u7684","face financial punishment \u9762\u4e34\u8d22\u52a1\u60e9\u7f5a"]}],"keywords":["accessibility","universities","traditional","impressive","reschedule","completion","punishment","financial","situation","outsiders","benefits","consider","offering","complete","required","courses","between","attract","through","growth","online","attend","uptake","enroll","desire","likely","amount","known","offer","study","large","free","real","join","work","face","gap","few","see","end","low"]},{"qid":"F211022","title":"How to Plan an Essay \u5982\u4f55\u5199\u597d\u8bba\u6587","source":"\u8424\u706b\u866b\u5b98\u65b9\u5468\u9884\u6d4b \u00b7 \u6781\u9ad8\u9891","tags":["\u6781\u9ad8\u9891"],"kind":"F","audio":"sgd_audio/F211022.mp3","audio_remote":"https://upload.fireflyau.com/pte/SSGD/r/be1d7c564f7a7fd2d9d21eebe91207f1.mp3","discussion":"Three students are discussing how to plan an essay.\n\nGuys, I\u2019m really struggling with this essay. It\u2019s so much more difficult than I expected, and I don\u2019t even know where to begin. I usually start by drafting the conclusion, but that would be a disaster if I\u2019ve misinterpreted the question right from the beginning.\n\nHey, don\u2019t worry too much about it. The first thing you should do is make sure you understand the question. Read it carefully and figure out exactly what it\u2019s asking. Then, plan your essay with a clear idea of what you\u2019re supposed to discuss.\n\nOh, so you all do the reading first and then the planning? I do the exact opposite! I start by outlining my essay\u2019s structure first, and then go back to carefully read the question and relevant materials. I find that this way, I have a clearer idea of what kind of information I need to look for and use.\n\nWell, I think the order really doesn\u2019t matter at all. Both reading and planning are really important\u2014but honestly, what\u2019s even more valuable is getting someone else to read your work. What you really need is their feedback: fresh eyes can spot things you\u2019ve missed, and their suggestions often help you see your essay in a whole new light.\n\nWell, I have to say that\u2019s a good point. But it\u2019s not easy to find someone else to read your essay. If you ask a classmate, you have to worry about whether they might copy your work, either consciously or unconsciously, ending up with similar ideas or content. Plus, you also need to consider whether they even have the time. I mean, our lecturers and tutors are always busy with their own classes and projects. And if you seek feedback from fellow students, I\u2019m not sure they can give you truly meaningful or constructive comments.\n\nWell, I think it\u2019s a good idea to have someone read your essay and give feedback before you submit it. Don\u2019t overthink finding the \u201cperfect\u201d person\u2014after all, I\u2019m sure I can find at least one person who\u2019s willing and able to help. And once I get their suggestions, I can always decide whether or not to take them after thinking things through carefully. Honestly, that sounds like a solid plan. I\u2019m already feeling better about this essay!","bilingual":"Three students are discussing how to plan an essay.\n\u4e09\u540d\u5b66\u751f\u6b63\u5728\u8ba8\u8bba\u5982\u4f55\u5199\u8bba\u6587\u3002\n\nSpeaker 1 (Female)\nGuys, I\u2019m really struggling with this essay.\n\u5927\u5bb6\u597d\uff0c\u6211\u5199\u8fd9\u7bc7\u8bba\u6587\u771f\u7684\u7279\u522b\u5403\u529b\u3002\nIt\u2019s so much more difficult than I expected, and I don\u2019t even know where to begin.\n\u5b83\u6bd4\u6211\u9884\u60f3\u7684\u8981\u96be\u5f97\u591a\uff0c\u6211\u751a\u81f3\u90fd\u4e0d\u77e5\u9053\u8be5\u4ece\u54ea\u513f\u4e0b\u624b\u3002\nI usually start by drafting the conclusion, but that would be a disaster if I\u2019ve misinterpreted the question right from the beginning.\n\u6211\u901a\u5e38\u4f1a\u5148\u8d77\u8349\u7ed3\u8bba\u90e8\u5206\uff0c\u4f46\u5982\u679c\u4e00\u5f00\u59cb\u6211\u5c31\u8bef\u89e3\u4e86\u9898\u76ee\uff0c\u90a3\u53ef\u5c31\u5168\u4e71\u5957\u4e86\u3002\n\nSpeaker 2 (Male)\nHey, don\u2019t worry too much about it.\n\u563f\uff0c\u522b\u592a\u62c5\u5fc3\u4e86\u3002\nThe first thing you should do is make sure you understand the question.\n\u4f60\u9996\u5148\u8981\u786e\u4fdd\u81ea\u5df1\u7406\u89e3\u9898\u76ee\u3002\nRead it carefully and figure out exactly what it\u2019s asking.\n\u4ed4\u7ec6\u8bfb\u4e00\u904d\uff0c\u5f04\u6e05\u695a\u5b83\u5230\u5e95\u5728\u95ee\u4ec0\u4e48\u3002\nThen, plan your essay with a clear idea of what you\u2019re supposed to discuss.\n\u7136\u540e\uff0c\u5e26\u7740\u660e\u786e\u7684\u601d\u8def\u53bb\u89c4\u5212\u4f60\u7684\u6587\u7ae0\u5185\u5bb9\u3002\n\nSpeaker 1 (Female)\nOh, so you all do the reading first and then the planning?\n\u54e6\uff0c\u6240\u4ee5\u4f60\u4eec\u90fd\u662f\u5148\u9605\u8bfb\u6750\u6599\uff0c\u7136\u540e\u518d\u505a\u89c4\u5212\uff1f\nI do the exact opposite! I start by outlining my essay\u2019s structure first, and then go back to carefully read the question and relevant materials.\n\u6211\u6b63\u597d\u76f8\u53cd\uff01\u6211\u4f1a\u5148\u642d\u597d\u8bba\u6587\u7684\u5927\u81f4\u6846\u67b6\uff0c\u7136\u540e\u518d\u56de\u8fc7\u5934\u53bb\u4ed4\u7ec6\u9605\u8bfb\u9898\u76ee\u548c\u76f8\u5173\u8d44\u6599\u3002\nI find that this way, I have a clearer idea of what kind of information I need to look for and use.\n\u6211\u89c9\u5f97\u8fd9\u6837\u6211\u80fd\u66f4\u6e05\u695a\u81ea\u5df1\u9700\u8981\u627e\u54ea\u4e9b\u4fe1\u606f\u3001\u7528\u54ea\u4e9b\u5185\u5bb9\u3002\n\nSpeaker 3 (Male)\nWell, I think the order really doesn\u2019t matter at all.\n\u6211\u89c9\u5f97\u8fd9\u4e2a\u987a\u5e8f\u5176\u5b9e\u4e0d\u91cd\u8981\uff0c\nBoth reading and planning are really important\u2014but honestly, what\u2019s even more valuable is getting someone else to read your work.\n\u56e0\u4e3a\u9605\u8bfb\u548c\u89c4\u5212\u90fd\u5f88\u91cd\u8981\u2014\u2014\u4f46\u8bf4\u5b9e\u8bdd\uff0c\u66f4\u5173\u952e\u7684\u662f\u627e\u4eba\u8bfb\u4e00\u8bfb\u4f60\u7684\u6587\u7ae0\u3002\nWhat you really need is their feedback: fresh eyes can spot things you\u2019ve missed,\n\u4f60\u771f\u6b63\u9700\u8981\u7684\u662f\u4ed6\u4eec\u7684\u53cd\u9988\uff1a\u522b\u4eba\u7528\u65b0\u7684\u89c6\u89d2\u80fd\u770b\u51fa\u4f60\u5ffd\u7565\u7684\u95ee\u9898\uff0c\nand their suggestions often help you see your essay in a whole new light.\n\u4ed6\u4eec\u7684\u5efa\u8bae\u5e38\u5e38\u80fd\u8ba9\u4f60\u5bf9\u81ea\u5df1\u7684\u8bba\u6587\u6709\u5168\u65b0\u7684\u8ba4\u8bc6\u3002\n\nSpeaker 2 (Male)\nWell, I have to say that\u2019s a good point.\n\u55ef\uff0c\u6211\u5f97\u8bf4\u8fd9\u786e\u5b9e\u662f\u4e2a\u597d\u89c2\u70b9\u3002\nBut it\u2019s not easy to find someone else to read your essay.\n\u4f46\u60f3\u627e\u4e2a\u4eba\u5e2e\u4f60\u8bfb\u8bba\u6587\u5176\u5b9e\u5e76\u4e0d\u5bb9\u6613\u3002\nIf you ask a classmate, you have to worry about whether they might copy your work, either consciously or unconsciously, ending up with similar ideas or content.\n\u5982\u679c\u4f60\u8bf7\u540c\u5b66\u5e2e\u5fd9\uff0c\u5c31\u5f97\u62c5\u5fc3\u4ed6\u4eec\u4f1a\u4e0d\u4f1a\u76f4\u63a5\u6284\u4f60\u7684\u5185\u5bb9\u2014\u2014\u54ea\u6015\u4e0d\u662f\u6545\u610f\u7684\uff0c\u4e5f\u53ef\u80fd\u4e0d\u77e5\u4e0d\u89c9\u5199\u51fa\u76f8\u4f3c\u7684\u89c2\u70b9\u6216\u7d20\u6750\u3002\nPlus, you also need to consider whether they even have the time.\n\u800c\u4e14\u4f60\u8fd8\u5f97\u8003\u8651\u5bf9\u65b9\u6709\u6ca1\u6709\u65f6\u95f4\u3002\nI mean, our lecturers and tutors are always busy with their own classes and projects.\n\u6bd5\u7adf\u6211\u4eec\u7684\u8bb2\u5e08\u548c\u52a9\u6559\u603b\u662f\u5fd9\u4e8e\u81ea\u5df1\u7684\u8bfe\u7a0b\u548c\u9879\u76ee\u3002\nAnd if you seek feedback from fellow students, I\u2019m not sure they can give you truly meaningful or constructive comments.\n\u5982\u679c\u4f60\u8f6c\u800c\u5411\u5176\u4ed6\u5b66\u751f\u5bfb\u6c42\u53cd\u9988\uff0c\u6211\u4e5f\u6000\u7591\u4ed6\u4eec\u662f\u5426\u771f\u80fd\u7ed9\u51fa\u6709\u610f\u4e49\u3001\u6709\u5efa\u8bbe\u6027\u7684\u610f\u89c1\u3002\n\nSpeaker 1 (Female)\nWell, I think it\u2019s a good idea to have someone read your essay and give feedback before you submit it.\n\u55ef\uff0c\u6211\u89c9\u5f97\u5728\u4ea4\u8bba\u6587\u4e4b\u524d\u627e\u4e2a\u4eba\u8bfb\u4e00\u8bfb\u3001\u7ed9\u70b9\u53cd\u9988\u662f\u4e2a\u597d\u4e3b\u610f\u3002\nDon\u2019t overthink finding the \u201cperfect\u201d person\u2014after all, I\u2019m sure I can find at least one person who\u2019s willing and able to help.\n\u522b\u592a\u7ea0\u7ed3\u975e\u5f97\u627e\u4e2a\u201c\u6700\u5408\u9002\u201d\u7684\u4eba\u2014\u2014\u8bf4\u5230\u5e95\uff0c\u6211\u80af\u5b9a\u81f3\u5c11\u80fd\u627e\u5230\u4e00\u4e2a\u613f\u610f\u5e2e\u5fd9\u3001\u4e5f\u80fd\u5e2e\u4e0a\u5fd9\u7684\u4eba\u3002\nAnd once I get their suggestions, I can always decide whether or not to take them after thinking things through carefully.\n\u7b49\u62ff\u5230\u5efa\u8bae\u540e\uff0c\u6211\u5b8c\u5168\u53ef\u4ee5\u4ed4\u7ec6\u60f3\u60f3\uff0c\u518d\u51b3\u5b9a\u8981\u4e0d\u8981\u91c7\u7eb3\u3002\nHonestly, that sounds like a solid plan. I\u2019m already feeling better about this essay!\n\u8001\u5b9e\u8bf4\uff0c\u8fd9\u542c\u8d77\u6765\u771f\u662f\u4e2a\u4e0d\u9519\u7684\u8ba1\u5212\u3002\u6211\u73b0\u5728\u5bf9\u8fd9\u7bc7\u8bba\u6587\u611f\u89c9\u597d\u591a\u4e86\uff01","answer":"The conversation is about three speakers discussing how to plan an essay.\nSpeaker 1 talked about struggling with this essay and also mentioned she doesn\u2019t know where to begin, and believed she may start by drafting the conclusion.\nThen, Speaker 2 said they should make sure they understand the question, read it carefully, and then discuss how they should plan their essay with a clear idea.\nAnd then, Speaker 1 argued they should do the reading first and then the planning, and also referred to outlining my essay\u2019s structure first, and said they can go back to read the question, materials and what information I need to look for and use.\nSpeaker 3 mentioned that the order doesn\u2019t matter, and also mentioned that the more valuable thing is getting someone else to read the work.\nThen, Speaker 2 said that if they ask a classmate, they may worry others might copy their work, and then discussed that they should consider whether other people have the time, like lecturers and tutors, who are busy with classes and projects, and mentioned that if they seek feedback from fellow students, he is not sure whether he can get meaningful or constructive comments.\nAnd then, Speaker 1 argued they can read the essay and give feedback before submitting, and also said they can find at least one person who\u2019s willing and able to help and decide whether or not to take suggestions.","points":[{"speaker":"Speaker 1 (Female)","points":["struggling with this essay \u5199\u8fd9\u7bc7\u8bba\u6587\u7279\u522b\u5403\u529b","don\u2019t know where to begin \u4e0d\u77e5\u9053\u8be5\u4ece\u54ea\u513f\u4e0b\u624b","start by drafting the conclusion \u5148\u8d77\u8349\u7ed3\u8bba\u90e8\u5206"]},{"speaker":"Speaker 2 (Male)","points":["make sure understand the question\u8981\u786e\u4fdd\u7406\u89e3\u9898\u76ee","read it carefully \u4ed4\u7ec6\u8bfb","plan your essay with a clear idea \u5e26\u7740\u660e\u786e\u7684\u601d\u8def\u53bb\u89c4\u5212\u4f60\u7684\u6587\u7ae0"]},{"speaker":"Speaker 1 (Female)","points":["do the reading first and then the planning \u5148\u9605\u8bfb\u6750\u6599\u518d\u505a\u89c4\u5212","start by outlining my essay\u2019s structure first \u5148\u642d\u597d\u8bba\u6587\u7684\u5927\u81f4\u6846\u67b6","then go back to read the question and materials \u518d\u56de\u8fc7\u5934\u53bb\u9605\u8bfb\u9898\u76ee\u548c\u8d44\u6599","what information I need to look for and use. \u627e\u54ea\u4e9b\u4fe1\u606f\u3001\u7528\u54ea\u4e9b\u5185\u5bb9"]},{"speaker":"Speaker 3 (Male)","points":["the order doesn\u2019t matter \u987a\u5e8f\u4e0d\u91cd\u8981","more valuable is getting someone else to read the work \u5173\u952e\u662f\u627e\u4eba\u8bfb\u4f60\u7684\u6587\u7ae0"]},{"speaker":"Speaker 2 (Male)","points":["ask a classmate \u8bf7\u540c\u5b66\u5e2e\u5fd9","might copy your work \u53ef\u80fd\u76f4\u63a5\u6284\u4f60\u7684\u5185\u5bb9","consider whether they have the time \u8003\u8651\u5bf9\u65b9\u6709\u6ca1\u6709\u65f6\u95f4","lecturers and tutors are busy with classes and projects \u8bb2\u5e08\u52a9\u6559\u5fd9\u4e8e\u8bfe\u7a0b\u548c\u9879\u76ee","seek feedback from fellow students \u5411\u5176\u4ed6\u5b66\u751f\u5bfb\u6c42\u53cd\u9988","meaningful or constructive comments \u6709\u610f\u4e49\u3001\u6709\u5efa\u8bbe\u6027\u7684\u610f\u89c1"]},{"speaker":"Speaker 1 (Female)","points":["read essay and give feedback before submit \u4ea4\u8bba\u6587\u4e4b\u524d\u8bfb\u4e00\u8bfb\u7ed9\u70b9\u53cd\u9988","find at least one person who\u2019s willing and able to help \u81f3\u5c11\u80fd\u627e\u5230\u4e00\u4e2a\u613f\u610f\u4e5f\u80fd\u5e2e\u5fd9\u7684","decide whether or not to take suggestions \u51b3\u5b9a\u8981\u4e0d\u8981\u91c7\u7eb3\u5efa\u8bae"]}],"keywords":["constructive","information","suggestions","struggling","conclusion","understand","meaningful","carefully","outlining","structure","materials","classmate","lecturers","drafting","question","planning","valuable","consider","projects","feedback","comments","reading","someone","whether","willing","matter","tutors","fellow","before","submit","decide","essay","begin","start","clear","order","doesn","least","read","plan","idea","back","look","else","work","copy","busy","seek","find","able","help","don","use"]},{"qid":"F211053","title":"Studying in the Library \u5728\u56fe\u4e66\u9986\u5b66\u4e60","source":"\u8424\u706b\u866b\u5b98\u65b9\u5468\u9884\u6d4b \u00b7 \u6781\u9ad8\u9891 \u00b7 \u65b0\u9898","tags":["\u6781\u9ad8\u9891","\u65b0\u9898"],"kind":"F","audio":"sgd_audio/F211053.mp3","audio_remote":"https://upload.fireflyau.com/pte/SSGD/r/88f89d6a3e225b07ad88453bab57f384.mp3","discussion":"Three students are discussing the advantages and disadvantages of studying in the library.\n\nHey, are you two planning to study this afternoon? I was thinking about going to the library, and I wondered if you'd like to join me. I find it much easier to concentrate when I'm studying somewhere quiet.\n\nActually, I prefer studying at home. It's more comfortable, and I don't have to spend time travelling to the library. I can organize my own schedule and take breaks whenever I want.\n\nI see what you mean, but I find studying at home really distracting. There are always so many things going on, and it's difficult to focus on my assignments. That's why I usually prefer going to the library.\n\nI have the same problem when I study at home. I always end up doing something else, like cleaning my room or doing housework. By the time I decide to go to the library, it's often already quite late. So I think going there earlier might help me manage my time better.\n\nBut the library isn't always a good place to study either. Sometimes it's really difficult to find an available seat, especially during exam periods. Some students even leave their belongings on chairs to reserve seats when they're not actually there. And the library can get quite noisy because there are always groups of students having discussions.\n\nThat's true. It can be frustrating when you can't find a quiet place to sit. But we don't necessarily have to study in the library. We could use one of the classrooms in our faculty building instead. They're usually much quieter, and we might have more space to work.\n\nThat sounds like a good idea. I'd be happy to go with you. I think studying in a classroom would help me avoid distractions at home without having to deal with the noise in the library. Let's go together this afternoon and see if we can find an empty classroom.","bilingual":"Three students are discussing the advantages and disadvantages of studying in the library.\n\u4e09\u540d\u5b66\u751f\u6b63\u5728\u8ba8\u8bba\u5728\u56fe\u4e66\u9986\u5b66\u4e60\u7684\u4f18\u7f3a\u70b9\u3002\n\nSpeaker 1 (Female)\nHey, are you two planning to study this afternoon?\n\u563f\uff0c\u4f60\u4eec\u4e24\u4e2a\u4eca\u5929\u4e0b\u5348\u6253\u7b97\u5b66\u4e60\u5417\uff1f\nI was thinking about going to the library, and I wondered if you'd like to join me.\n\u6211\u6b63\u6253\u7b97\u53bb\u56fe\u4e66\u9986\uff0c\u60f3\u95ee\u95ee\u4f60\u4eec\u8981\u4e0d\u8981\u4e00\u8d77\u53bb\u3002\nI find it much easier to concentrate when I'm studying somewhere quiet.\n\u6211\u53d1\u73b0\uff0c\u5728\u5b89\u9759\u7684\u5730\u65b9\u5b66\u4e60\u66f4\u5bb9\u6613\u96c6\u4e2d\u6ce8\u610f\u529b\u3002\n\nSpeaker 2 (Male)\nActually, I prefer studying at home.\n\u5176\u5b9e\u6211\u66f4\u559c\u6b22\u5728\u5bb6\u5b66\u4e60\u3002\nIt's more comfortable, and I don't have to spend time travelling to the library.\n\u5728\u5bb6\u66f4\u8212\u670d\uff0c\u800c\u4e14\u6211\u4e5f\u4e0d\u7528\u82b1\u65f6\u95f4\u53bb\u56fe\u4e66\u9986\u3002\nI can organize my own schedule and take breaks whenever I want.\n\u6211\u53ef\u4ee5\u81ea\u5df1\u5b89\u6392\u5b66\u4e60\u65f6\u95f4\uff0c\u60f3\u4f11\u606f\u7684\u65f6\u5019\u5c31\u4f11\u606f\u3002\n\nSpeaker 1 (Female)\nI see what you mean, but I find studying at home really distracting.\n\u6211\u660e\u767d\u4f60\u7684\u610f\u601d\uff0c\u4f46\u6211\u89c9\u5f97\u5728\u5bb6\u5b66\u4e60\u771f\u7684\u5f88\u5bb9\u6613\u5206\u5fc3\u3002\nThere are always so many things going on, and it's difficult to focus on my assignments.\n\u5bb6\u91cc\u603b\u662f\u6709\u5404\u79cd\u4e8b\u60c5\u53d1\u751f\uff0c\u8ba9\u6211\u5f88\u96be\u4e13\u6ce8\u4e8e\u4f5c\u4e1a\u3002\nThat's why I usually prefer going to the library.\n\u6240\u4ee5\u6211\u901a\u5e38\u66f4\u559c\u6b22\u53bb\u56fe\u4e66\u9986\u3002\n\nSpeaker 3 (Male)\nI have the same problem when I study at home.\n\u6211\u5728\u5bb6\u5b66\u4e60\u7684\u65f6\u5019\u4e5f\u6709\u540c\u6837\u7684\u95ee\u9898\u3002\nI always end up doing something else, like cleaning my room or doing housework.\n\u6211\u6700\u540e\u603b\u4f1a\u53bb\u505a\u522b\u7684\u4e8b\u60c5\uff0c\u6bd4\u5982\u6253\u626b\u623f\u95f4\u6216\u8005\u505a\u5bb6\u52a1\u3002\nBy the time I decide to go to the library, it's often already quite late.\n\u7b49\u6211\u51b3\u5b9a\u53bb\u56fe\u4e66\u9986\u7684\u65f6\u5019\uff0c\u901a\u5e38\u5df2\u7ecf\u5f88\u665a\u4e86\u3002\nSo I think going there earlier might help me manage my time better.\n\u6240\u4ee5\u6211\u89c9\u5f97\u65e9\u70b9\u53bb\u56fe\u4e66\u9986\u53ef\u80fd\u4f1a\u5e2e\u52a9\u6211\u66f4\u597d\u5730\u7ba1\u7406\u65f6\u95f4\u3002\n\nSpeaker 2 (Male)\nBut the library isn't always a good place to study either.\n\u4f46\u662f\u56fe\u4e66\u9986\u4e5f\u4e0d\u603b\u662f\u4e00\u4e2a\u9002\u5408\u5b66\u4e60\u7684\u5730\u65b9\u3002\nSometimes it's really difficult to find an available seat, especially during exam periods.\n\u6709\u65f6\u5019\u771f\u7684\u5f88\u96be\u627e\u5230\u7a7a\u5ea7\u4f4d\uff0c\u5c24\u5176\u662f\u5728\u8003\u8bd5\u671f\u95f4\u3002\nSome students even leave their belongings on chairs to reserve seats when they're not actually there.\n\u6709\u4e9b\u5b66\u751f\u751a\u81f3\u4f1a\u628a\u81ea\u5df1\u7684\u4e1c\u897f\u653e\u5728\u6905\u5b50\u4e0a\u5360\u5ea7\uff0c\u4f46\u4eba\u5176\u5b9e\u5e76\u4e0d\u5728\u90a3\u91cc\u3002\nAnd the library can get quite noisy because there are always groups of students having discussions.\n\u800c\u4e14\u56fe\u4e66\u9986\u6709\u65f6\u5019\u4f1a\u5f88\u5435\uff0c\u56e0\u4e3a\u603b\u6709\u4e00\u4e9b\u5b66\u751f\u5728\u8fdb\u884c\u5c0f\u7ec4\u8ba8\u8bba\u3002\n\nSpeaker 1 (Female)\nThat's true. It can be frustrating when you can't find a quiet place to sit.\n\u786e\u5b9e\u5982\u6b64\u3002\u5f53\u4f60\u627e\u4e0d\u5230\u4e00\u4e2a\u5b89\u9759\u7684\u5ea7\u4f4d\u65f6\uff0c\u771f\u7684\u4f1a\u5f88\u70e6\u3002\nBut we don't necessarily have to study in the library.\n\u4e0d\u8fc7\u6211\u4eec\u4e5f\u4e0d\u4e00\u5b9a\u975e\u8981\u5728\u56fe\u4e66\u9986\u5b66\u4e60\u3002\nWe could use one of the classrooms in our faculty building instead.\n\u6211\u4eec\u53ef\u4ee5\u53bb\u5b66\u9662\u6559\u5b66\u697c\u91cc\u627e\u4e00\u95f4\u6559\u5ba4\u5b66\u4e60\u3002\nThey're usually much quieter, and we might have more space to work.\n\u90a3\u4e9b\u6559\u5ba4\u901a\u5e38\u5b89\u9759\u5f97\u591a\uff0c\u800c\u4e14\u6211\u4eec\u53ef\u80fd\u6709\u66f4\u591a\u5b66\u4e60\u7a7a\u95f4\u3002\n\nSpeaker 3 (Male)\nThat sounds like a good idea.\n\u542c\u8d77\u6765\u662f\u4e2a\u4e0d\u9519\u7684\u4e3b\u610f\u3002\nI'd be happy to go with you.\n\u6211\u5f88\u613f\u610f\u8ddf\u4f60\u4e00\u8d77\u53bb\u3002\nI think studying in a classroom would help me avoid distractions at home without having to deal with the noise in the library.\n\u6211\u89c9\u5f97\u5728\u6559\u5ba4\u5b66\u4e60\u65e2\u80fd\u8ba9\u6211\u907f\u5f00\u5bb6\u91cc\u7684\u5e72\u6270\uff0c\u4e5f\u4e0d\u7528\u5fcd\u53d7\u56fe\u4e66\u9986\u91cc\u7684\u566a\u97f3\u3002\nLet's go together this afternoon and see if we can find an empty classroom.\n\u6211\u4eec\u4eca\u5929\u4e0b\u5348\u4e00\u8d77\u53bb\u770b\u770b\u80fd\u4e0d\u80fd\u627e\u5230\u4e00\u95f4\u7a7a\u6559\u5ba4\u5427\u3002","answer":"The conversation is about three speakers discussing the advantages and disadvantages of studying in the library.\nSpeaker 1 suggested going to the library to study and asked the other speakers to join her, and also mentioned it\u2019s easier to concentrate when studying in the library.\nThen, Speaker 2 said that he prefers studying at home because it\u2019s comfortable, and then argued that he doesn\u2019t have to spend time travelling.\nAnd then, Speaker 1 argued that it\u2019s distracting when studying at home, and she suggested that it\u2019s difficult to focus on her assignments.\nSpeaker 3 mentioned that when he studies at home, he always ends up with doing housework, and also mentioned he can manager his time better.\nThen, Speaker 2 said that sometimes it\u2019s difficult to find an available seat in the library, and also mentioned it can get quite noisy.\nAnd then, Speaker 1 suggested that they should use one of the classrooms in their faculty building, and also mentioned that there will be more space to work.\nSpeaker 3 said that he is happy to go with her, and mentioned that they can avoid distractions.","points":[{"speaker":"Speaker 1 (Female)","points":["going to the library to study \u53bb\u56fe\u4e66\u9986\u5b66\u4e60","join me \u4e00\u8d77\u53bb","easier to concentrate \u5bb9\u6613\u96c6\u4e2d\u6ce8\u610f\u529b"]},{"speaker":"Speaker 2 (Male)","points":["prefer studying at home \u559c\u6b22\u5728\u5bb6\u5b66\u4e60","comfortable \u8212\u670d","don't have to spend time travelling \u4e0d\u7528\u82b1\u65f6\u95f4\u5728\u8def\u4e0a"]},{"speaker":"Speaker 1 (Female)","points":["distracting \uff08\u5728\u5bb6\u5b66\u4e60\uff09\u5bb9\u6613\u5206\u5fc3","difficult to focus on my assignments \u5f88\u96be\u4e13\u6ce8\u4e8e\u4f5c\u4e1a"]},{"speaker":"Speaker 3 (Male)","points":["doing housework \u505a\u5bb6\u52a1","manage my time better \u66f4\u597d\u5730\u7ba1\u7406\u65f6\u95f4"]},{"speaker":"Speaker 2 (Male)","points":["difficult to find an available seat \u96be\u627e\u5230\u7a7a\u5ea7\u4f4d","get quite noisy \u6709\u65f6\u5019\u4f1a\u5f88\u5435"]},{"speaker":"Speaker 1 (Female)","points":["use one of the classrooms in our faculty building \u53bb\u5b66\u9662\u6559\u5b66\u697c\u91cc\u627e\u95f4\u6559\u5ba4\u5b66\u4e60","more space to work \u66f4\u591a\u5b66\u4e60\u7a7a\u95f4"]},{"speaker":"Speaker 3 (Male)","points":["happy to go with you \u613f\u610f\u8ddf\u4f60\u4e00\u8d77\u53bb","avoid distractions \u907f\u5f00\u5e72\u6270"]}],"keywords":["distractions","concentrate","comfortable","distracting","assignments","travelling","classrooms","difficult","housework","available","studying","building","library","faculty","easier","prefer","manage","better","going","study","don't","spend","focus","quite","noisy","space","happy","avoid","join","home","find","seat","work","use"]},{"qid":"F211034","title":"Complaint in the Library \u56fe\u4e66\u9986\u6295\u8bc9","source":"\u8424\u706b\u866b\u5b98\u65b9\u5468\u9884\u6d4b \u00b7 \u6781\u9ad8\u9891","tags":["\u6781\u9ad8\u9891"],"kind":"F","audio":"sgd_audio/F211034.mp3","audio_remote":"https://upload.fireflyau.com/pte/SSGD/r/6ee0177d8defa2259faa0b8c1913ce39.mp3","discussion":"Two students are complaining to the library staff about the noise in the library.\n\nExcuse me, I\u2019d like to complain about the noise in the library. Some people treat this place like a club instead of a study area. The library is supposed to be a quiet place for people to study, but there are always people chatting and watching videos here without putting their headphones on.\n\nWell, I'm aware of the situation you\u2019ve complained about, but students\u2019 behavior is difficult to manage because the library is really big and there are only a few staff around. It\u2019s hard for us to monitor everything. You know, the library does have a silent zone, so if you\u2019re distracted by noise here, you can call security and they\u2019ll help resolve the problem. But we can\u2019t control the noise from other areas, like the computer section. Talking is allowed outside the silent zones.\n\nWell, in this case, may I offer you some suggestions? Why is it that people are required to keep quiet in the silent area, but talking isn't prohibited in the computer room? It seems a bit unfair to students who want to focus on studying, since the noise from the computer area can still be clearly heard and easily disturbs people nearby.\n\nYou'd better write down your complaints and suggestions, because the university takes advice from students seriously. By writing down your experience clearly, the school can better understand the noise problems in the library and take more effective measures to improve the study environment for everyone.\n\nI also have something to complain about. I mean \u2014 can we bring food into the library? I often see students bringing all kinds of food to the study rooms and eating while they study. For example, some people bring strong-smelling food like instant noodles or takeout meals. These smells spread quickly in the library and make it really hard to concentrate. This is another big problem that influences our study environment.\n\nFood from outside is not allowed in the library. Even food without strong smells, like bread, is not permitted. The movements and sounds people make while eating can really disturb others who are studying. We\u2019ve been strictly enforcing this rule, but some students still break it. If you\u2019re bothered by this again next time, you can ask security for help.","bilingual":"Two students are complaining to the library staff about the noise in the library.\n\u4e24\u540d\u5b66\u751f\u5411\u56fe\u4e66\u9986\u5de5\u4f5c\u4eba\u5458\u62b1\u6028\u56fe\u4e66\u9986\u5185\u566a\u97f3\u592a\u5927\u4e86\u3002\n\nStudent 1 (Female)\nExcuse me, I\u2019d like to complain about the noise in the library.\n\u4f60\u597d\uff0c\u6211\u60f3\u6295\u8bc9\u4e00\u4e0b\u56fe\u4e66\u9986\u7684\u566a\u97f3\u95ee\u9898\u3002\nSome people treat this place like a club instead of a study area.\n\u6709\u4e9b\u4eba\u628a\u8fd9\u513f\u5f53\u6210\u4ff1\u4e50\u90e8\uff0c\u6839\u672c\u4e0d\u50cf\u662f\u5b66\u4e60\u7684\u5730\u65b9\u3002\nThe library is supposed to be a quiet place for people to study, but there are always people chatting and watching videos here without putting their headphones on.\n\u56fe\u4e66\u9986\u672c\u6765\u5c31\u8be5\u662f\u5b89\u5b89\u9759\u9759\u4f9b\u5927\u5bb6\u5b66\u4e60\u7684\u5730\u65b9\uff0c\u53ef\u603b\u6709\u4eba\u5728\u8fd9\u513f\u95f2\u804a\uff0c\u8fd8\u5916\u653e\u770b\u89c6\u9891\uff0c\u8fde\u8033\u673a\u90fd\u4e0d\u5e26\u3002\n\nStaff (Male)\nWell, I'm aware of the situation you\u2019ve complained about, but students\u2019 behavior is difficult to manage\n\u6211\u77e5\u9053\u4f60\u6295\u8bc9\u7684\u8fd9\u4e2a\u60c5\u51b5\uff0c\u53ef\u662f\u5b66\u751f\u7684\u884c\u4e3a\u786e\u5b9e\u5f88\u96be\u7ba1\u7406\u3002\nbecause the library is really big and there are only a few staff around. It\u2019s hard for us to monitor everything.\n\u56fe\u4e66\u9986\u592a\u5927\u4e86\uff0c\u5de5\u4f5c\u4eba\u5458\u53c8\u5c11\uff0c\u6211\u4eec\u5f88\u96be\u5168\u7a0b\u770b\u7ba1\u3002\nYou know, the library does have a silent zone, so if you\u2019re distracted by noise here, you can call security and they\u2019ll help resolve the problem.\n\u4f60\u4e5f\u77e5\u9053\uff0c\u56fe\u4e66\u9986\u662f\u6709\u5b89\u9759\u533a\u7684\uff0c\u5982\u679c\u4f60\u5728\u90a3\u91cc\u88ab\u566a\u97f3\u5e72\u6270\uff0c\u53ef\u4ee5\u627e\u5b89\u4fdd\u4eba\u5458\uff0c\u4ed6\u4eec\u4f1a\u5e2e\u5fd9\u5904\u7406\u3002\nBut we can\u2019t control the noise from other areas, like the computer section. Talking is allowed outside the silent zones.\n\u4f46\u5176\u4ed6\u533a\u57df\u6bd4\u5982\u7535\u8111\u533a\u7684\u566a\u97f3\u6211\u4eec\u6ca1\u6cd5\u5b8c\u5168\u63a7\u5236\uff0c\u5b89\u9759\u533a\u4ee5\u5916\u662f\u5141\u8bb8\u8bf4\u8bdd\u7684\u3002\n\nStudent 1 (Female)\nWell, in this case, may I offer you some suggestions?\n\u90a3\u8fd9\u6837\u7684\u8bdd\uff0c\u6211\u53ef\u4ee5\u63d0\u4e00\u4e9b\u5efa\u8bae\u5417\uff1f\nWhy is it that people are required to keep quiet in the silent area, but talking isn't prohibited in the computer room?\n\u4e3a\u4ec0\u4e48\u5b89\u9759\u533a\u8981\u6c42\u5927\u5bb6\u4fdd\u6301\u5b89\u9759\uff0c\u53ef\u7535\u8111\u623f\u5374\u4e0d\u7981\u6b62\u4ea4\u8c08\u5462\uff1f\nIt seems a bit unfair to students who want to focus on studying,\n\u8fd9\u5bf9\u60f3\u8981\u4e13\u5fc3\u5b66\u4e60\u7684\u5b66\u751f\u6765\u8bf4\u6709\u70b9\u4e0d\u516c\u5e73\uff0c\nsince the noise from the computer area can still be clearly heard and easily disturbs people nearby.\n\u56e0\u4e3a\u7535\u8111\u533a\u4f20\u6765\u7684\u566a\u97f3\u4f9d\u7136\u5f88\u6e05\u695a\uff0c\u5f88\u5bb9\u6613\u6253\u6270\u5230\u65c1\u8fb9\u7684\u4eba\u3002\n\nStaff (Male)\nYou'd better write down your complaints and suggestions, because the university takes advice from students seriously.\n\u4f60\u6700\u597d\u628a\u4f60\u7684\u6295\u8bc9\u548c\u5efa\u8bae\u5199\u4e0b\u6765\uff0c\u56e0\u4e3a\u5b66\u6821\u8ba4\u771f\u542c\u53d6\u5b66\u751f\u7684\u53cd\u9988\u3002\nBy writing down your experience clearly, the school can better understand the noise problems in the library\n\u628a\u4f60\u7684\u7ecf\u5386\u6e05\u695a\u5730\u8bb0\u5f55\u4e0b\u6765\uff0c\u5b66\u6821\u624d\u80fd\u66f4\u597d\u5730\u4e86\u89e3\u56fe\u4e66\u9986\u7684\u566a\u97f3\u95ee\u9898\uff0c\nand take more effective measures to improve the study environment for everyone.\n\u5e76\u91c7\u53d6\u66f4\u6709\u6548\u7684\u63aa\u65bd\uff0c\u4e3a\u5927\u5bb6\u6539\u5584\u5b66\u4e60\u73af\u5883\u3002\n\nStudent 2 (Female)\nI also have something to complain about.\n\u6211\u8fd8\u6709\u522b\u7684\u95ee\u9898\u8981\u6295\u8bc9\u3002\nI mean \u2014 can we bring food into the library?\n\u6211\u662f\u8bf4 \u2014\u2014 \u6211\u4eec\u53ef\u4ee5\u628a\u98df\u7269\u5e26\u8fdb\u56fe\u4e66\u9986\u5417\uff1f\nI often see students bringing all kinds of food to the study rooms and eating while they study.\n\u6211\u7ecf\u5e38\u770b\u5230\u6709\u5b66\u751f\u628a\u5404\u79cd\u5404\u6837\u7684\u98df\u7269\u5e26\u5230\u81ea\u4e60\u5ba4\uff0c\u8fb9\u5b66\u4e60\u8fb9\u5403\u4e1c\u897f\u3002\nFor example, some people bring strong-smelling food like instant noodles or takeout meals.\n\u6bd4\u5982\u6709\u4eba\u4f1a\u5e26\u6c14\u5473\u5f88\u91cd\u7684\u6ce1\u9762\u6216\u8005\u5916\u5356\uff0c\nThese smells spread quickly in the library and make it really hard to concentrate.\n\u8fd9\u4e9b\u6c14\u5473\u5728\u56fe\u4e66\u9986\u91cc\u6269\u6563\u5f97\u5f88\u5feb\uff0c\u8ba9\u4eba\u5f88\u96be\u96c6\u4e2d\u6ce8\u610f\u529b\u3002\nThis is another big problem that influences our study environment.\n\u8fd9\u4e5f\u662f\u5f71\u54cd\u6211\u4eec\u5b66\u4e60\u73af\u5883\u7684\u4e00\u5927\u95ee\u9898\u3002\n\nStaff (Male)\nFood from outside is not allowed in the library.\n\u56fe\u4e66\u9986\u662f\u7981\u6b62\u5916\u5e26\u98df\u7269\u7684\u3002\nEven food without strong smells, like bread, is not permitted.\n\u5c31\u7b97\u662f\u9762\u5305\u8fd9\u79cd\u6ca1\u5473\u9053\u7684\u98df\u7269\u4e5f\u4e0d\u884c\u3002\nThe movements and sounds people make while eating can really disturb others who are studying.\n\u56e0\u4e3a\u5403\u4e1c\u897f\u7684\u52a8\u4f5c\u548c\u53d1\u51fa\u7684\u58f0\u97f3\uff0c\u786e\u5b9e\u4f1a\u5f71\u54cd\u5468\u56f4\u7684\u4eba\u5b66\u4e60\u3002\nWe\u2019ve been strictly enforcing this rule, but some students still break it.\n\u6211\u4eec\u5df2\u7ecf\u5728\u4e25\u683c\u7ba1\u7406\u8fd9\u4ef6\u4e8b\u4e86\uff0c\u4f46\u8fd8\u662f\u6709\u5b66\u751f\u8fdd\u53cd\u89c4\u5b9a\u3002\nIf you\u2019re bothered by this again next time, you can ask security for help.\n\u4e0b\u6b21\u4f60\u518d\u56e0\u4e3a\u8fd9\u79cd\u4e8b\u53d7\u56f0\u6270\uff0c\u53ef\u4ee5\u627e\u5b89\u4fdd\u4eba\u5458\u5904\u7406\u3002","answer":"The conversation is about three speakers discussing complaints in the library.\nStudent 1 complains about the noise in the library, and also mentioned that there are students chatting and watching videos without putting their headphones on.\nThen, the staff said he is aware of the situation, but his behaviour is difficult to manage, and then discussed that there is a silent zone, so if they get distracted, they can call security, and security will help.\nAnd then, Student 1 offered suggestions, and also believes it is unfair to students who want to study, and the computer area noise disturbs people nearby.\nThe staff talked about writing down complaints and suggestions, and also mentioned university should take advice from students seriously and take effective measures to improve the study environment.\nThen, Student 2 said some people bring food into the library, and the smells spread quickly, and then discussed how it\u2019s hard to concentrate.\nAnd then, the staff argued that food from outside is not allowed in the library, and also said they\u2019ve been strictly enforcing this rule, but some still break it.","points":[{"speaker":"style=\"height: 50.5898px;\"> Student 1 (Female)","points":["complain about the noise in the library \u6295\u8bc9\u56fe\u4e66\u9986\u7684\u566a\u97f3\u95ee\u9898","chatting and watching videos \u95f2\u804a\u5e76\u770b\u89c6\u9891","without putting their headphones on \u8fde\u8033\u673a\u90fd\u4e0d\u5e26"]},{"speaker":"style=\"height: 67.4531px;\"> Staff (Male)","points":["aware of the situation \u77e5\u9053\u8fd9\u4e2a\u60c5\u51b5","behavior is difficult to manage \u884c\u4e3a\u5f88\u96be\u7ba1\u7406","a silent zone \u5b89\u9759\u533a","if distracted, call security and they\u2019ll help \u5982\u679c\u88ab\u6253\u6270\uff0c\u53ef\u627e\u5b89\u4fdd\u4eba\u5458\uff0c\u4ed6\u4eec\u4f1a\u5e2e\u5fd9"]},{"speaker":"style=\"height: 50.5898px;\"> Student 1 (Female)","points":["offer suggestions \u63d0\u5efa\u8bae","unfair to students who want to study \u5bf9\u60f3\u8981\u5b66\u4e60\u7684\u5b66\u751f\u6765\u8bf4\u4e0d\u516c\u5e73","computer area noise disturbs people nearby \u7535\u8111\u533a\u7684\u566a\u97f3\u6253\u6270\u5230\u65c1\u8fb9\u7684\u4eba"]},{"speaker":"style=\"height: 50.5898px;\"> Staff (Male)","points":["write down complaints and suggestions \u628a\u6295\u8bc9\u548c\u5efa\u8bae\u5199\u4e0b\u6765","university takes advice from students seriously \u5b66\u6821\u8ba4\u771f\u542c\u53d6\u5b66\u751f\u7684\u53cd\u9988","take effective measures to improve the study environment \u91c7\u53d6\u6709\u6548\u63aa\u65bd\u6539\u5584\u5b66\u4e60\u73af\u5883"]},{"speaker":"style=\"height: 50.5898px;\"> Student 2 (Female)","points":["bring food into the library \u628a\u98df\u7269\u5e26\u8fdb\u56fe\u4e66\u9986","smells spread quickly \u6c14\u5473\u6269\u6563\u5f97\u5f88\u5feb","hard to concentrate \u5f88\u96be\u96c6\u4e2d\u6ce8\u610f\u529b"]},{"speaker":"style=\"height: 50.5898px;\"> Staff (Male)","points":["food from outside is not allowed in the library\u56fe\u4e66\u9986\u662f\u7981\u6b62\u5916\u5e26\u98df\u7269\u7684","strictly enforcing this rule \u4e25\u683c\u7ba1\u7406\u8fd9\u4ef6\u4e8b","still break it \u8fd8\u662f\u8fdd\u53cd\u89c4\u5b9a"]}],"keywords":["suggestions","environment","concentrate","headphones","distracted","complaints","situation","difficult","seriously","effective","enforcing","complain","chatting","watching","behavior","security","computer","disturbs","measures","strictly","library","without","putting","improve","quickly","outside","allowed","videos","manage","silent","unfair","nearby","advice","smells","spread","noise","aware","offer","study","write","takes","bring","break","zone","call","help","area","food","hard","rule"]},{"qid":"F211013","title":"Where to Live in Final Year \u6700\u540e\u4e00\u5e74\u4f4f\u54ea\u91cc","source":"\u8424\u706b\u866b\u5b98\u65b9\u5468\u9884\u6d4b \u00b7 \u6781\u9ad8\u9891","tags":["\u6781\u9ad8\u9891"],"kind":"F","audio":"sgd_audio/F211013.mp3","audio_remote":"https://upload.fireflyau.com/pte/SSGD/r/1a613d1ec01351944b51fdc7cccfbf84.mp3","discussion":"Three students are discussing where to live in their final year.\n\nSo, have you guys thought about where to live for our final year?\n\nYeah, we\u2019re planning to live off campus.\n\nOh, really? Why is that? I feel the opposite\u2014I\u2019m actually planning to move back into the school residence.\n\nI get that. Living on campus is definitely nice\u2014there are good facilities, entertainment, and plenty of support. Especially in the first year, I really needed that. But after two years, I feel like I want a change, so I\u2019ve decided to go for a flat share.\n\nExactly. I also want a new environment and the chance to meet more people. And honestly, when it comes to exam season, I don\u2019t want to be in the library surrounded by stressed-out students, all fighting for a quiet spot.\n\nThat makes sense, but you do need to be careful when choosing who to live with. In my last two years, I was in a flat share, and my roommate only wanted to party instead of study. I ended up having to shut myself in my room just to get any work done.\n\nThat won\u2019t be a problem for me. Four of us\u2014close friends\u2014have already decided to share a flat together. We\u2019re all really ambitious, we can study together and stay focused, and honestly, we usually manage to get top grades anyway.\n\nSame here. I already have a friend renting a place off campus, and he\u2019s invited me to join him. We\u2019ve known each other for years, we get along really well, and we\u2019ve even agreed to keep the place tidy by sharing cleaning duties.\n\nOh, that\u2019s smart. Cleaning is such a big issue. My old roommates never did any cleaning at all, and in the end it all fell on me.","bilingual":"Three students are discussing where to live in their final year.\n\u4e09\u540d\u5b66\u751f\u6b63\u5728\u8ba8\u8bba\u5927\u56db (\u6700\u540e\u4e00\u5e74\uff09\u4f4f\u5728\u54ea\u91cc\u3002\n\nSpeaker 1 (Female)\nSo, have you guys thought about where to live for our final year?\n\u90a3\u4f60\u4eec\u6709\u6ca1\u6709\u60f3\u8fc7\u6211\u4eec\u6700\u540e\u4e00\u5e74\u8981\u4f4f\u5728\u54ea\u91cc\uff1f\n\nSpeaker 2 (Male)\nYeah, we\u2019re planning to live off campus.\n\u6709\u7684\uff0c\u6211\u4eec\u6253\u7b97\u4f4f\u5728\u6821\u5916\u3002\n\nSpeaker 1 (Female)\nOh, really? Why is that?\n\u54e6\uff0c\u662f\u5417\uff1f\u4e3a\u4ec0\u4e48\u5462\uff1f\nI feel the opposite\u2014I\u2019m actually planning to move back into the school residence.\n\u6211\u6b63\u597d\u76f8\u53cd\u2014\u2014\u6211\u53cd\u800c\u6253\u7b97\u642c\u56de\u5b66\u6821\u5bbf\u820d\u4f4f\u3002\n\nSpeaker 2 (Male)\nI get that. Living on campus is definitely nice\u2014there are good facilities, entertainment, and plenty of support.\n\u6211\u80fd\u7406\u89e3\u3002\u4f4f\u5728\u6821\u5185\u786e\u5b9e\u5f88\u597d\uff0c\u8bbe\u65bd\u5b8c\u5584\uff0c\u4e5f\u6709\u5a31\u4e50\u6d3b\u52a8\u548c\u5404\u79cd\u652f\u6301\uff0c\nEspecially in the first year, I really needed that.\n\u5c24\u5176\u662f\u5927\u4e00\u7684\u65f6\u5019\uff0c\u6211\u771f\u7684\u5f88\u9700\u8981\u8fd9\u4e9b\u3002\nBut after two years, I feel like I want a change, so I\u2019ve decided to go for a flat share.\n\u4f46\u4f4f\u4e86\u4e24\u5e74\u4e4b\u540e\uff0c\u6211\u89c9\u5f97\u81ea\u5df1\u60f3\u6362\u4e2a\u73af\u5883\uff0c\u6240\u4ee5\u51b3\u5b9a\u53bb\u5408\u79df\u4e00\u5957\u516c\u5bd3\u3002\n\nSpeaker 3 (Male)\nExactly. I also want a new environment and the chance to meet more people.\n\u6ca1\u9519\u3002\u6211\u4e5f\u60f3\u6362\u4e2a\u65b0\u73af\u5883\uff0c\u987a\u4fbf\u8ba4\u8bc6\u66f4\u591a\u7684\u4eba\u3002\nAnd honestly, when it comes to exam season, I don\u2019t want to be in the library surrounded by stressed-out students, all fighting for a quiet spot.\n\u800c\u4e14\u8bf4\u5b9e\u8bdd\uff0c\u5230\u4e86\u8003\u8bd5\u5b63\uff0c\u6211\u771f\u7684\u4e0d\u60f3\u5f85\u5728\u56fe\u4e66\u9986\u91cc\uff0c\u88ab\u4e00\u7fa4\u538b\u529b\u5c71\u5927\u7684\u5b66\u751f\u5305\u56f4\uff0c\u5927\u5bb6\u90fd\u5728\u62a2\u5b89\u9759\u7684\u5ea7\u4f4d\u3002\n\nSpeaker 1 (Female)\nThat makes sense, but you do need to be careful when choosing who to live with.\n\u8fd9\u5012\u4e5f\u6709\u9053\u7406\uff0c\u4e0d\u8fc7\u9009\u5ba4\u53cb\u7684\u65f6\u5019\u771f\u7684\u8981\u5c0f\u5fc3\u3002\nIn my last two years, I was in a flat share, and my roommate only wanted to party instead of study.\n\u6211\u524d\u4e24\u5e74\u4e5f\u662f\u5408\u79df\uff0c\u4f46\u6211\u7684\u5ba4\u53cb\u53ea\u60f3\u73a9\u3001\u4e0d\u60f3\u5b66\u4e60\uff0c\nI ended up having to shut myself in my room just to get any work done.\n\u6700\u540e\u6211\u53ea\u80fd\u628a\u81ea\u5df1\u5173\u5728\u623f\u95f4\u91cc\uff0c\u624d\u80fd\u52c9\u5f3a\u5b8c\u6210\u4f5c\u4e1a\u3002\n\nSpeaker 2 (Male)\nThat won\u2019t be a problem for me.\n\u8fd9\u5bf9\u6211\u6765\u8bf4\u5e94\u8be5\u4e0d\u662f\u95ee\u9898\u3002\nFour of us\u2014close friends\u2014have already decided to share a flat together.\n\u6211\u4eec\u56db\u4e2a\u597d\u670b\u53cb\u5df2\u7ecf\u51b3\u5b9a\u4e00\u8d77\u5408\u79df\u4e86\u3002\nWe\u2019re all really ambitious, we can study together and stay focused, and honestly, we usually manage to get top grades anyway.\n\u5927\u5bb6\u90fd\u5f88\u6709\u4e0a\u8fdb\u5fc3\uff0c\u53ef\u4ee5\u4e00\u8d77\u5b66\u4e60\u3001\u4fdd\u6301\u4e13\u6ce8\uff0c\u800c\u4e14\u8bf4\u5b9e\u8bdd\uff0c\u6211\u4eec\u5e73\u65f6\u6210\u7ee9\u4e5f\u4e00\u76f4\u90fd\u4e0d\u9519\u3002\n\nSpeaker 3 (Male)\nSame here. I already have a friend renting a place off campus, and he\u2019s invited me to join him.\n\u6211\u4e5f\u662f\u3002\u6211\u5df2\u7ecf\u6709\u4e00\u4e2a\u670b\u53cb\u5728\u6821\u5916\u79df\u623f\u4e86\uff0c\u4ed6\u9080\u8bf7\u6211\u4e00\u8d77\u4f4f\u3002\nWe\u2019ve known each other for years, we get along really well, and we\u2019ve even agreed to keep the place tidy by sharing cleaning duties.\n\u6211\u4eec\u8ba4\u8bc6\u5f88\u591a\u5e74\u4e86\uff0c\u76f8\u5904\u5f97\u5f88\u597d\uff0c\u751a\u81f3\u8fd8\u7ea6\u5b9a\u597d\u8981\u5206\u62c5\u6e05\u6d01\u5de5\u4f5c\uff0c\u4fdd\u6301\u623f\u5b50\u6574\u6d01\u3002\n\nSpeaker 1 (Female)\nOh, that\u2019s smart. Cleaning is such a big issue.\n\u54e6\uff0c\u90a3\u771f\u7684\u5f88\u806a\u660e\u3002\u6e05\u6d01\u95ee\u9898\u592a\u91cd\u8981\u4e86\u3002\nMy old roommates never did any cleaning at all, and in the end it all fell on me.\n\u6211\u4ee5\u524d\u7684\u5ba4\u53cb\u5b8c\u5168\u4e0d\u6253\u626b\u536b\u751f\uff0c\u6700\u540e\u6240\u6709\u4e8b\u60c5\u90fd\u843d\u5728\u6211\u4e00\u4e2a\u4eba\u8eab\u4e0a\u3002","answer":"The conversation is about three speakers discussing where to live in the final year.\nSpeaker 1 asked about where to live for our final year.\nThen, Speaker 2 said he will live off campus.\nAnd then, Speaker 1 argued he plans to move back into the school residence.\nSpeaker 2 said it\u2019s good to live on campus because of the good facilities and entertainment, and also mentioned he plans to flat share after two years.\nThen, Speaker 3 said he wants a new environment and the chance to meet more people, and then discussed that in exam season, he doesn\u2019t want to be in the library surrounded by stressed-out students.\nAnd then, Speaker 1 argued they should be careful when choosing who to live with, and also said her roommate only wanted to party, and she had to shut herself in her room.\nSpeaker 2 talked about his friends, and he decided to share a flat together, and also mentioned they can study together and stay focused, so they can get top grades.\nThen, Speaker 3
